    const kw = ruleKeywordOf(row);
    if (row.debitCode) learnReceiptRule(row);
    else { const rc = receiptSettingsOf(row.companyId); rc.rules = rc.rules.filter(x => normName(x.keyword) !== normName(kw)); }
    for (const o of rows) if (o !== row && o.companyId === row.companyId && o.source === "receipt" && o.review !== "exported" && !o.debitCode && normName(ruleKeywordOf(o)) === normName(kw)) { o.debitCode = row.debitCode; setAutoTax(o, "debit"); }
    saveReceiptSettings(); save(); render();
  }
  else if (FIELDS.find(f => f.key === key)?.num && row[key] !== "") e.target.value = Number(row[key]).toLocaleString();
  else if (key === "debitCode" || key === "creditCode" || key === "summary" || key === "creditSummary") { save(); render(); }
});

// ＋：借方か貸方に、空の塊を1つ足す（1つずつの仕訳は、借方の行と貸方の行に分けてから足す）
function addLine(v, side) {
  const vr = rows.filter(r => r.companyId === currentCompanyId && vidOf(r) === v);
  const anchor = vr[0];
  if (!anchor) return;
  const blank = { debitCode: "", debitSub: "", debitAmount: "", debitTax: "", debitRate: "", debitBiz: "課税事業者",
    creditCode: "", creditSub: "", creditAmount: "", creditTax: "", creditRate: "", creditBiz: "課税事業者", summary: "", creditSummary: "", store: "", note: "" };
  const base = { groupId: anchor.groupId, companyId: anchor.companyId, source: anchor.source, thumb: "", status: "done", review: "pending", date: anchor.date, taxHint: {}, bizV2: true, vid: v };
  if (vr.length === 1 && lineOf(anchor) === "pair") {
    // 今の貸方を、貸方だけの行に移す
    const c = { ...base, ...blank, id: uid(), line: "c", creditCode: anchor.creditCode, creditSub: anchor.creditSub, creditAmount: anchor.creditAmount,
      creditTax: anchor.creditTax, creditRate: anchor.creditRate, creditBiz: anchor.creditBiz, creditSummary: creditSummaryOf(anchor),
      taxManual: anchor.taxManual?.credit ? { credit: true } : undefined };
    anchor.line = "d"; anchor.vid = v;
    rows.splice(rows.indexOf(anchor) + 1, 0, c);
    vr.push(c);
  } else for (const r of vr) { r.line = lineOf(r); r.vid = v; delete r.splitRole; } // 8%と10%に分けた仕訳も、ふつうの複合仕訳として扱う
  const nb = { ...base, ...blank, id: uid(), line: side === "debit" ? "d" : "c" };
  rows.splice(rows.indexOf(vr[vr.length - 1]) + 1, 0, nb);
  save(); render();
}
// －：借方か貸方の塊を1つ消す。借方・貸方が1つずつに戻ったら、ふつうの仕訳（1行）にまとめる
function removeLine(id) {
  const row = rows.find(r => r.id === id);
  if (!row) return;
  // 何か入っている塊は、消してよいか確かめる（空の塊はそのまま消す）
  const side = lineOf(row) === "c" ? "credit" : "debit";
  const filled = side === "debit" ? row.debitCode || Number(row.debitAmount) || String(row.summary || "").trim()
    : row.creditCode || Number(row.creditAmount) || String(creditSummaryOf(row)).trim();
  if (filled && !confirm(`この${side === "debit" ? "借方" : "貸方"}を消しますか？`)) return;
  const vr = voucherRows(row).filter(r => r !== row);
  rows = rows.filter(r => r !== row);
  const D = vr.filter(r => lineOf(r) !== "c"), C = vr.filter(r => lineOf(r) !== "d");
  if (D.length === 1 && C.length === 1 && D[0] !== C[0]) {
    const d = D[0], c = C[0];
    Object.assign(d, { creditCode: c.creditCode, creditSub: c.creditSub, creditAmount: c.creditAmount, creditTax: c.creditTax, creditRate: c.creditRate,
      creditBiz: c.creditBiz, creditSummary: creditSummaryOf(c), taxManual: { ...d.taxManual, credit: !!c.taxManual?.credit } });
    delete d.line; delete d.vid; delete d.splitRole;
    rows = rows.filter(r => r !== c);
  }
  save(); render();
}
list.addEventListener("click", async e => {
  const t = e.target.closest("[data-del], [data-retry], [data-addline], [data-linedel], [data-lock], .thumb");
  if (!t) return;
  if (t.dataset.addline) addLine(t.dataset.vid, t.dataset.addline);
  else if (t.dataset.linedel) removeLine(t.dataset.linedel);

    // 完了：その仕訳を触っても変わらないようにする（完了解除で戻す）
    const vr = rows.filter(r => r.companyId === currentCompanyId && vidOf(r) === t.dataset.lock);
    const lock = !vr.some(r => r.locked);
    for (const r of vr) r.locked = lock;
    save(); render();
  } else if (t.dataset.del) {
    const row = rows.find(r => r.id === t.dataset.del);
    if (row && (row.status !== "done" || confirm("この仕訳を削除しますか？"))) {

    }
  } else if (t.dataset.retry) {

      alert("元の画像が残っていないため再読み取りできません。もう一度撮影してください。");
      return;

    queue.push(row.groupId);

});
// ---- 写真を大きく見る ----
const viewer = document.getElementById("viewer"), viewerImg = document.getElementById("modalImg");
let vz = { s: 1, x: 0, y: 0 };            // 拡大率と、ずらした量
const pointers = new Map();               // 画面に触れている指（マウス）
let pinch = null, drag = null, lastTap = 0;
function applyZoom() {
  viewerImg.style.transform = `translate(${vz.x}px, ${vz.y}px) scale(${vz.s})`;
  viewer.classList.toggle("zoomed", vz.s > 1.01);
}
// 画面上の点(cx, cy)を中心に、拡大率を s にする
function zoomAt(s, cx, cy) {
  s = Math.min(8, Math.max(1, s));
  const rc = viewerImg.getBoundingClientRect();
  const ix = (cx - rc.left) / vz.s, iy = (cy - rc.top) / vz.s; // 画像の中のどこか
  vz.x += (cx - rc.left) - ix * s; vz.y += (cy - rc.top) - iy * s;
  vz.s = s;
  if (s === 1) vz.x = vz.y = 0;
  applyZoom();
}
function viewerCenter() { const rc = viewer.getBoundingClientRect(); return [rc.left + rc.width / 2, rc.top + rc.height / 2]; }
function openViewer(src) {
  viewerImg.src = src; vz = { s: 1, x: 0, y: 0 }; applyZoom();
  document.getElementById("modal").classList.add("open");
}
function closeViewer() { document.getElementById("modal").classList.remove("open"); pointers.clear(); pinch = drag = null; }
document.getElementById("viewerClose").onclick = closeViewer;
document.querySelector(".viewer-bar").addEventListener("click", e => {
  const b = e.target.closest("[data-zoom]"); if (!b) return;
  const [cx, cy] = viewerCenter();
  if (b.dataset.zoom === "fit") zoomAt(1, cx, cy);
  else zoomAt(vz.s * (b.dataset.zoom === "in" ? 1.6 : 1 / 1.6), cx, cy);
});
addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("modal").classList.contains("open")) closeViewer(); });
viewer.addEventListener("wheel", e => { e.preventDefault(); zoomAt(vz.s * Math.exp(-e.deltaY / 300), e.clientX, e.clientY); }, { passive: false });
viewer.addEventListener("pointerdown", e => {
  viewer.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: vz.s };
    drag = null;
  } else if (pointers.size === 1) {
    drag = { x: e.clientX, y: e.clientY, vx: vz.x, vy: vz.y, moved: false, onImg: e.target === viewerImg };
  }
});
viewer.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    zoomAt(pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, (a.x + b.x) / 2, (a.y + b.y) / 2);
  } else if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
    if (vz.s > 1.01) { vz.x = drag.vx + dx; vz.y = drag.vy + dy; applyZoom(); }
  }
});
function endPointer(e) {
  const wasDrag = drag && !drag.moved && pointers.size === 1, onImg = drag?.onImg;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!wasDrag) { if (!pointers.size) drag = null; return; }
  drag = null;
  // タップ: 2回続けて押したら拡大／元に戻す。拡大していないときに画像の外を押したら閉じる
  const now = Date.now();
  if (now - lastTap < 320) { zoomAt(vz.s > 1.01 ? 1 : 2.5, e.clientX, e.clientY); lastTap = 0; return; }
  lastTap = now;
  if (vz.s <= 1.01 && !onImg) setTimeout(() => { if (lastTap === now) closeViewer(); }, 330);
}
viewer.addEventListener("pointerup", endPointer);
viewer.addEventListener("pointercancel", endPointer);

// ---- CSV ----
const CSV_HEADERS = {
  date: "伝票日付", debitCode: "借方勘定科目コード", debitSub: "借方科目別補助コード", debitAmount: "借方金額", debitTax: "借方消費税コード", debitRate: "借方消費税率",
  summary: "借方摘要", creditCode: "貸方勘定科目コード", creditSub: "貸方科目別補助コード", creditAmount: "貸方金額", creditTax: "貸方消費税コード", creditRate: "貸方消費税率", creditSummary: "貸方摘要",
  debitBiz: "借方事業者取引区分", creditBiz: "貸方事業者取引区分",
};
// CSVでは、消費税・税率・事業者取引区分をミロクのコードにする（全社共通）
const CSV_CODES = {
  Tax: { 課税: "10", 非課税: "30", 対象外: "40" },
  Rate: { "10%": "4", "8%軽": "5", "8%": "3", 非課税: "0", 対象外: "0" },
  Biz: { 課税事業者: "0", 免税事業者: "1", "": "0" },
};
document.getElementById("download").onclick = async () => {
  // 複合仕訳の塊で、金額もコードも空のもの（使わなかった8%の行など）は書き出さない
  const emptyLine = r => lineOf(r) !== "pair" && !Number(lineOf(r) === "c" ? r.creditAmount : r.debitAmount) && !(lineOf(r) === "c" ? r.creditCode : r.debitCode);
  const done = csvTargetRows().filter(r => !emptyLine(r));
  if (!done.length) return;
  const incomplete = done.filter(r => r.source === TRIAL_SOURCE
    ? !r.date || !(Number(r.debitAmount) ? r.debitCode : r.creditCode)
    : !r.date || !Number(lineOf(r) === "c" ? r.creditAmount : r.debitAmount));
  if (incomplete.length && !confirm(`日付・金額・コードが空の行が ${incomplete.length} 件あります。このままダウンロードしますか？`)) return;
  if (done.some(r => r.source === TRIAL_SOURCE)) {
    const d = done.reduce((s, r) => s + Number(r.debitAmount || 0), 0), c = done.reduce((s, r) => s + Number(r.creditAmount || 0), 0);
    if (d !== c && !confirm(`借方合計（${d.toLocaleString()}）と貸方合計（${c.toLocaleString()}）が一致していません。このままダウンロードしますか？`)) return;
  }

  const formatDate = d => !d ? "" : settings.dateFormat === "compact" ? d.replace(/-/g, "") : d.replace(/-/g, "/");
  const cell = v => { const t = String(v ?? ""); return /[",\r\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  // 試算表の行は片側だけなので、反対側を諸口にする（その会社のミロク科目マスタの「諸口」。なければミロクで基本の 3999）
  const shokuchi = shokuchiOf();
  const fields = visibleFields(); // CSVは確認画面と同じ項目
  // 複合仕訳（借方か貸方が2つ以上）は、相手科目を諸口にして1行ずつ書く
  //   借方だけの行：借方 科目 ／ 貸方 諸口　　貸方だけの行：借方 諸口 ／ 貸方 科目
  const lineCsv = r => {
    const ln = lineOf(r);
    if (ln === "d") return { ...r, creditCode: shokuchi, creditSub: "", creditAmount: r.debitAmount, creditTax: "対象外", creditRate: "対象外", creditBiz: "課税事業者", creditSummary: r.summary };
    if (ln === "c") return { ...r, date: voucherRows(r)[0].date, debitCode: shokuchi, debitSub: "", debitAmount: r.creditAmount, debitTax: "対象外", debitRate: "対象外", debitBiz: "課税事業者", summary: creditSummaryOf(r) };
    return r;
  };
  const lines = done.map(lineCsv).map(r => {
    let { debitCode, debitAmount, creditCode, creditAmount } = r;
    if (r.source === TRIAL_SOURCE && shokuchi) {
      if (Number(debitAmount) && !creditCode && !Number(creditAmount)) { creditCode = shokuchi; creditAmount = debitAmount; }
      else if (Number(creditAmount) && !debitCode && !Number(debitAmount)) { debitCode = shokuchi; debitAmount = creditAmount; }
    }
    const v = { ...r, date: formatDate(r.date), debitCode, debitAmount, creditCode, creditAmount, creditSummary: creditSummaryOf(r) };
    return fields.map(f => { const codes = CSV_CODES[kindOf(f.key)]; return cell(codes ? codes[v[f.key] ?? ""] ?? "" : v[f.key]); }).join(",");
  });
  const isTrialCsv = currentSource() === TRIAL_SOURCE;
  if (settings.includeHeader) lines.unshift(fields.map(f => isTrialCsv && f.key === "summary" ? "摘要" : CSV_HEADERS[f.key]).join(","));
  const csv = lines.join("\r\n") + "\r\n";

  const bytes = settings.encoding === "utf8"
    ? new TextEncoder().encode("﻿" + csv)
    : new Uint8Array(Encoding.convert(Encoding.stringToCode(csv), { to: "SJIS", from: "UNICODE" }));
  const blob = new Blob([bytes], { type: "text/csv" });
  const stamp = new Date().toLocaleString("sv-SE", { timeZone: "Asia/Tokyo" }).replace(/[-: ]/g, "").slice(0, 12);
  const company = (currentCompany()?.name || "会社").replace(/[\\/:*?"<>|]/g, "_");
  const name = `${company}_仕訳_${stamp}.csv`;
  if (!(await saveFile(blob, name))) return; // 保存をキャンセルした場合は一覧に残す

  // 書き出した（完成した）領収書の仕訳は、自動入力ルールに覚える（次から同じお店に同じ科目が入る）
  for (const r of done) learnReceiptRule(r);
  saveReceiptSettings();
  // 出力した仕訳は「出力済み」の印を付けて、一覧に残す
  setReview(done.map(r => r.id), "exported", `${voucherCount(done)}件を保存しました`);
};

// ファイルの保存。スマホはリンクからのダウンロードが不安定（特にiPhone）なので、
// 標準の共有シート（「ファイルに保存」など）を使う。保存できたら true
async function saveFile(blob, name) {
  if (NATIVE) {
    // アプリでは iPhone の共有シートを直接開く
    const data = await new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(",")[1]);
      reader.readAsDataURL(blob);
    });
    const { completed } = await callNative("shareFile", { data, filename: name });
    return !!completed;
  }
  const file = new File([blob], name, { type: blob.type });
  const touch = matchMedia("(pointer: coarse)").matches;
  if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file] });
      return true;
    } catch (err) {
      if (err.name === "AbortError") return false; // 共有シートを閉じた
      if (err.name === "NotAllowedError") return tapToShare(file); // 確認ダイアログなどで操作の直後と判定されなかった
      // それ以外はリンクからのダウンロードに切り替える
    }
  }
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: name });
  document.body.appendChild(a);
  a.click();
  a.remove();
  // すぐに破棄すると保存画面で中身が読めなくなるため、しばらく残す
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  return true;
}

// 共有シートはタップの直後にしか開けないため、もう一度タップしてもらう
function tapToShare(file) {
  return new Promise(resolve => {
    const toast = document.getElementById("toast");
    toast.innerHTML = `<span>CSVの準備ができました</span><button class="toast-undo">保存する</button><button class="toast-close" aria-label="閉じる">✕</button>`;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toast.querySelector(".toast-undo").onclick = async () => {
      toast.hidden = true;
      try { await navigator.share({ files: [file] }); resolve(true); } catch { resolve(false); }
    };
    toast.querySelector(".toast-close").onclick = () => { toast.hidden = true; resolve(false); };
  });
}

// ==== ③ 試算表入力 ====
// 他の会計ソフトの試算表（PDF・画像）を読み取り、各科目の「当月の借方・貸方」を、相手を諸口にした仕訳にする。
// 元の科目 → ミロクの科目コードは、会社ごとの「対応表」で変換する（初回だけ選べば、翌月から自動）

const TRIAL_SOURCE = "format3";
const MASTERS_KEY = "shiwake-masters";   // { 会社ID: { adds: [{ code, name }], deleted: [code] } }  ミロクの科目マスタの、標準との違いだけ
const MAPPINGS_KEY = "shiwake-mappings"; // { 会社ID: { 元の科目キー: { code, srcName, srcCode } } }
// 標準の科目マスタ（ミロクの科目コードと科目名）。会社を追加したときは、これが最初から入る。
// 銀行口座など会社ごとに違う科目は、各会社の「科目マスタ・対応表」で手直しする
// ミロクの科目マスタは会社ごとに違うので、アプリには標準のマスタを入れない（会社ごとにファイルから読み込む）
let DEFAULT_MASTER = [];
try { localStorage.removeItem("shiwake-standard"); } catch {}
// 標準のマスタをなくしたので、それまでに試しで入った「ミロク科目マスタ」「別会計ソフト対応表」は一度だけ空にする
try {
  if (!localStorage.getItem("shiwake-data-v2")) {
    localStorage.removeItem(MASTERS_KEY); localStorage.removeItem(MAPPINGS_KEY);
    localStorage.setItem("shiwake-data-v2", "1");
  }
} catch {}
// 別の会計システムの種類。会社設定で選ぶと、その標準の対応表を使う（会社ごとに違う科目は会社の対応表で上書き）
const SOURCE_SYSTEMS = [
  { id: "pca", name: "PCA会計", mapping: [] },
  { id: "yayoi", name: "弥生会計", mapping: [] },
  { id: "freee", name: "freee", mapping: [] },
  { id: "mf", name: "マネーフォワード", mapping: [] },
  { id: "bugyo", name: "勘定奉行", mapping: [] },
  { id: "other", name: "その他", mapping: [] },
];
const NO_SYSTEM = { id: "", name: "未設定", mapping: [] };
const systemOf = (cid = currentCompanyId) => {
  const id = companies.find(c => c.id === cid)?.system || "";
  return SOURCE_SYSTEMS.find(x => x.id === id) || NO_SYSTEM;
};
// 会社の科目マスタは「標準 ＋ その会社だけの違い」で持つ。保存するのは違い（追加・名前の変更・削除）だけなので、
// 標準（DEFAULT_MASTER）を直すと、すべての会社に反映され、会社ごとの手直しは残る
function masterDiffOf(list) {
  const std = new Map(DEFAULT_MASTER.map(m => [m.code, m.name]));
  const codes = new Set(list.map(m => m.code));
  return {
    adds: list.filter(m => !std.has(m.code) || std.get(m.code) !== m.name).map(m => ({ code: m.code, name: m.name })),
    deleted: DEFAULT_MASTER.filter(m => !codes.has(m.code)).map(m => m.code),
  };
}
function masterFromDiff(diff) {
  const deleted = new Set(diff.deleted || []);
  const adds = diff.adds || [];
  const changed = new Map(adds.filter(m => m.code).map(m => [m.code, m.name]));
  const list = DEFAULT_MASTER.filter(m => !deleted.has(m.code)).map(m => ({ code: m.code, name: changed.has(m.code) ? changed.get(m.code) : m.name }));
  const stdCodes = new Set(DEFAULT_MASTER.map(m => m.code));
  return [...adds.filter(m => !stdCodes.has(m.code) || !m.code).map(m => ({ ...m })), ...list];
}
// 以前の形（会社ごとに全科目を丸ごと保存）は、ここで違いだけの形に直す
const masterDiffs = Object.fromEntries(Object.entries(load(MASTERS_KEY, {})).map(([cid, v]) => [cid, Array.isArray(v) ? masterDiffOf(v) : v]));
const masters = {}; // 画面で使う、会社ごとの科目マスタ（標準 ＋ 違い）
let mappings = load(MAPPINGS_KEY, {});
function saveMasters() {
  for (const [cid, list] of Object.entries(masters)) masterDiffs[cid] = masterDiffOf(list);
  try { localStorage.setItem(MASTERS_KEY, JSON.stringify(masterDiffs)); localStorage.setItem(MAPPINGS_KEY, JSON.stringify(mappings)); } catch {} }
// レシートの設定（会社ごと）: 貸方のいつもの科目と、「店名・品目 → 借方の科目」のルール
// 原始資料の自動入力ルール（会社ごと・書類の種類ごと）

// 科目名から、ミロクのコードを推測する（完全一致 → 似ている）
function nameSimilarity(a, b) {
  const B = [...b], used = new Array(B.length).fill(false); let hit = 0;
  for (const ch of a) { const i = B.findIndex((c, k) => !used[k] && c === ch); if (i >= 0) { used[i] = true; hit++; } }
  return (2 * hit) / (a.length + B.length || 1);
}
function suggestCode(srcName, cid = currentCompanyId) {
  const n = normName(srcName);
  const list = masterOf(cid).map(m => ({ ...m, n: normName(m.name) }));
  const exact = list.filter(m => m.n === n);
  if (exact.length === 1) return exact[0].code;          // 同じ名前が2つある科目（製造原価と販管費など）は推測しない
  if (exact.length > 1) return "";
  const best = list.map(m => ({ ...m, s: nameSimilarity(n, m.n) })).sort((a, b) => b.s - a.s)[0];
  return best && best.s >= 0.75 ? best.code : "";
}

// ---- 現金預金収支日計表（手書き） ----
// 決まった用紙（上: 収入の部・支出の部、真ん中: 本日の合計、下: 振替）を、iPhoneアプリの文字認識で読み、
// 用紙の中の位置から「科目・相手先・内容・金額」を取り出して仕訳にする。
// 手書きの科目名は読み違えやすいので、科目のコード（4桁）と金額を頼りにし、合計欄と照らし合わせて確かめる。
const NIKKEI_SOURCE = "format2";
// 用紙の中の列の位置（用紙の幅を1とした左からの割合）。読み取った文字の中心がどの範囲にあるかで列を決める
const NIKKEI_COLS = {
  income:  [[0.155, "acct"], [0.18, "code"], [0.28, "party"], [0.40, "content"], [0.425, "day"], [0.50, "amount"]],
  expense: [[0.59, "acct"], [0.615, "code"], [0.71, "party"], [0.765, "check"], [0.885, "content"], [0.91, "day"], [1, "amount"]],
  transfer: [[0.265, "party"], [0.32, "check"], [0.565, "content"], [0.615, "day"], [0.70, "dAcct"], [0.725, "dCode"], [0.80, "dAmount"], [0.885, "cAcct"], [0.91, "cCode"], [1, "cAmount"]],
};
// 手書きの数字を英字と読み違えたものを直す（例: 「Slol保険」→「5101保険」）
// 表の枠線（「|」）は文字ではないので消す。英字が混ざった3〜5文字だけを数字に直す
function fixDigits(t) {
  return t.replace(/[|｜]/g, " ").replace(/(^|[^A-Za-z])([SslIoOBZ0-9]{3,5})(?=[^\x00-\x7F]|$)/g, (m, p, g) =>
    /[SslIoOBZ]/.test(g) ? p + g.replace(/[Ss]/g, "5").replace(/[lI]/g, "1").replace(/[oO]/g, "0").replace(/B/g, "8").replace(/Z/g, "2") : m);
}
// 文字のかたまりを「数字のかたまり」と「それ以外」に分け、それぞれの中心の位置を見積もる
function nikkeiTokens(items) {
  const out = [];
  for (const it of items) {
    const text = fixDigits(String(it.text || "").normalize("NFKC"));
    if (!text.trim()) continue;
    const re = /[\d,]+|[^\d,\s]+/g; let m;
    while ((m = re.exec(text))) {
      const mid = (m.index + m[0].length / 2) / text.length;
      out.push({ t: m[0], x: it.x + it.w * mid, y: it.y + it.h / 2, h: it.h });
    }
  }
  return out;
}
const numOf = t => Number(String(t).replace(/[^\d]/g, "")) || 0;
function nikkeiCell(cols, x) { for (const [edge, name] of cols) if (x < edge) return name; return null; }
// 行ごとに、列の名前 → 文字 の形にまとめる
function nikkeiRows(tokens, cols, x0) {
  const rows = [];
  for (const k of tokens.filter(k => k.x >= x0).sort((a, b) => a.y - b.y)) {
    const row = rows.find(r => Math.abs(r.y - k.y) < 0.012);
    if (row) row.toks.push(k); else rows.push({ y: k.y, toks: [k] });
  }
  return rows.map(r => {
    const cells = {};
    for (const k of r.toks.sort((a, b) => a.x - b.x)) {
      const c = nikkeiCell(cols, k.x); if (!c) continue;
      cells[c] = (cells[c] || "") + k.t;
    }
    return cells;
  });
}
// 「5101保険窓口」→ コードと科目名。コードがマスタになければ、科目名から推測する
function nikkeiAccount(text, cid) {
  const t = String(text || "").replace(/[〃”"'’`]/g, "").trim();
  const code = (t.match(/\d{3,5}/) || [""])[0];
  const name = t.replace(code, "").trim();
  const master = masterOf(cid);
  if (code && master.some(m => m.code === code)) return { code, how: "" };
  const guess = name && suggestCode(name, cid);
  if (guess) return { code: guess, how: "推測" };
  return { code, how: "" };
}
const isDitto = t => !String(t || "").replace(/[〃”"'’`\s]/g, ""); // 「〃」（上と同じ）や空欄
const isDittoMark = t => /^[〃”"'’`]+$/.test(String(t || "").trim()); // はっきり「〃」と書いてある
function parseNikkei(items, cid) {
  const tokens = nikkeiTokens(items);
  const find = re => items.find(it => re.test(String(it.text || "").normalize("NFKC")));
  // 日付（例: 令和7年7月2日。手書きの「1」が「／」などに読まれることがある）
  let date = "";
  for (const it of items) {
    const m = String(it.text || "").normalize("NFKC").replace(/[／/|lI!]/g, "1").match(/(\d{1,2})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
    if (m) { const y = 2018 + Number(m[1]); if (validDate(y, +m[2], +m[3])) { date = `${y}-${pad(+m[2])}-${pad(+m[3])}`; break; } }
  }
  // 区切りの位置: 見出しの行、本日の合計の行、振替の見出しの行
  const headY = (find(/金額|科目名/)?.y ?? 0.11) + 0.012;
  const totalIt = find(/本日入金合計|入金合計/);
  const bLabel = items.filter(it => /\(B\)|（B）/.test(it.text) && it.y > 0.3).sort((a, b) => a.y - b.y)[0];
  const totalY = Math.min(totalIt?.y ?? 0.5, bLabel?.y ?? 1) - 0.008;
  const transIt = find(/借方科目名|借方金額/);
  const transY = (transIt?.y ?? 0.57) + 0.012;
  const upper = tokens.filter(k => k.y > headY && k.y < totalY);
  const lower = tokens.filter(k => k.y > transY);
  const entries = [];
  // 収入の部・支出の部（「〃」や空欄の科目・相手先は、上の行と同じ）
  for (const [side, cols, x0, x1] of [["income", NIKKEI_COLS.income, 0, 0.5], ["expense", NIKKEI_COLS.expense, 0.5, 1]]) {
    let last = {};
    for (const c of nikkeiRows(upper.filter(k => k.x >= x0 && k.x < x1), cols, x0)) {
      const amount = numOf(c.amount);
      const acct = isDitto(c.acct) && !c.code ? last.acct : (c.acct || "") + (c.code || "");
      const party = isDittoMark(c.party) ? last.party : c.party;
      last = { acct, party };
      if (!amount) continue;
      entries.push({ side, acct, party: party || "", content: (c.content || "").replace(/^[〃”"'’`]+/, ""), amount });
    }
  }
  // 振替（現金以外の取引）
  let last = {};
  for (const c of nikkeiRows(lower, NIKKEI_COLS.transfer, 0)) {
    const dAmount = numOf(c.dAmount), cAmount = numOf(c.cAmount);
    const dAcct = isDitto(c.dAcct) && !c.dCode ? last.dAcct : (c.dAcct || "") + (c.dCode || "");
    const cAcct = isDitto(c.cAcct) && !c.cCode ? last.cAcct : (c.cAcct || "") + (c.cCode || "");
    const party = isDittoMark(c.party) ? last.party : c.party;
    last = { dAcct, cAcct, party };
    if (!dAmount && !cAmount) continue;
    entries.push({ side: "transfer", dAcct, cAcct, party: party || "", content: (c.content || "").replace(/^[〃”"'’`]+/, ""), dAmount: dAmount || cAmount, cAmount: cAmount || dAmount });
  }
  // 合計欄: 本日入金合計(B)・本日出金合計(C)・前日繰越(A)・本日現金残高
  const near = (y0, y1, x0, x1) => tokens.filter(k => k.y > y0 && k.y < y1 && k.x >= x0 && k.x < x1 && /\d{3,}/.test(k.t)).map(k => numOf(k.t));
  const bTotal = near(totalY - 0.03, totalY + 0.03, 0.40, 0.50)[0] || 0;
  const cTotal = near(totalY - 0.03, totalY + 0.03, 0.90, 1)[0] || 0;
  const balance = near(totalY + 0.012, totalY + 0.06, 0.85, 1)[0] || 0;
  const prevRaw = near(totalY + 0.012, totalY + 0.06, 0.15, 0.38)[0] || 0;
  return { date, entries, bTotal, cTotal, balance, prevRaw };
}
// 読み取った内容を確かめる（入金・出金の合計、前日繰越＋入金−出金＝本日残高）
function checkNikkei(p) {
  const notes = [];
  const sumB = p.entries.filter(e => e.side === "income").reduce((s, e) => s + e.amount, 0);
  const sumC = p.entries.filter(e => e.side === "expense").reduce((s, e) => s + e.amount, 0);
  if (p.bTotal && sumB !== p.bTotal) notes.push(`入金の合計が合いません（読み取り ${sumB.toLocaleString()}円／日計表 ${p.bTotal.toLocaleString()}円）`);
  if (p.cTotal && sumC !== p.cTotal) notes.push(`出金の合計が合いません（読み取り ${sumC.toLocaleString()}円／日計表 ${p.cTotal.toLocaleString()}円）`);
  if (p.balance && p.prevRaw) {
    // 前日繰越は、枠の線を「1」と読むことがあるので、先頭の1桁を外したものでも確かめる
    const s = String(p.prevRaw), cands = [p.prevRaw, s.length > 1 ? Number(s.slice(1)) : 0];
    if (!cands.some(a => a + (p.bTotal || sumB) - (p.cTotal || sumC) === p.balance)) notes.push("前日繰越＋入金−出金が、本日現金残高と合いません");
  }
  return notes;
}

// ---- 表の読み取り: 文字のかたまりを、行の高さに合わせて1行ずつに分ける ----
function tableRows(items, width, height) {
  const maxW = Math.max(0, ...items.map(i => i.w));
  const angles = items.filter(i => typeof i.angle === "number" && i.w >= maxW * 0.3).map(i => i.angle).sort((a, b) => a - b);
  const theta = angles.length ? angles[Math.floor(angles.length / 2)] : 0;
  const cos = Math.cos(theta), sin = Math.sin(theta);
  const pts = items.map(it => {
    const cx = (it.x + it.w / 2) * width, cy = (it.y + it.h / 2) * height;
    return { text: it.text, x: cx * cos + cy * sin, y: -cx * sin + cy * cos, h: it.h * height };
  }).sort((a, b) => a.y - b.y);
  const hs = pts.map(p => p.h).sort((a, b) => a - b);
  const tol = (hs[Math.floor(hs.length / 2)] || 10) * 0.5;
  const out = [];
  for (const p of pts) {
    const row = out.find(r => Math.abs(r.y - p.y) < tol);
    if (row) { row.cells.push(p); row.y = (row.y * (row.cells.length - 1) + p.y) / row.cells.length; }
    else out.push({ y: p.y, cells: [p] });
  }
  return out.sort((a, b) => a.y - b.y).map(r => r.cells.sort((a, b) => a.x - b.x).map(c => c.text));
}

// 1ページを読み取って、行ごとのセルの配列にする
async function readTablePage(dataUrl) {
  if (NATIVE) {
    const res = await callNative("recognizeText", { image: dataUrl.split(",")[1] });
    return tableRows(res.items || [], res.width, res.height);
  }
  // Web版（精度は下がる）: 文字認識の結果を行ごとに区切ってセルにする
  const worker = await getOcrWorker();
  const canvas = await preprocessForOcr(dataUrl);
  const { data } = await worker.recognize(canvas);
  return (data.text || "").split(/\r?\n/).map(l => l.replace(/(\d)[,.、]\s+(\d)/g, "$1,$2").trim()).filter(Boolean).map(l => l.split(/\s+/));
}

// PDFを1ページずつ画像にする（同梱の pdf.js を使う）
async function pdfToImages(file) {
  const pdfjs = await import("./vendor/pdfjs/pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc = new URL("./vendor/pdfjs/pdf.worker.min.mjs", location.href).href;
  const doc = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const images = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const page = await doc.getPage(i);
    const base = page.getViewport({ scale: 1 });
    const viewport = page.getViewport({ scale: Math.min(4, 2200 / base.width) });
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(viewport.width); canvas.height = Math.round(viewport.height);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    // 表示用(display)の描画は画面が隠れていると止まるため、印刷用(print)で描く
    await page.render({ canvasContext: ctx, viewport, intent: "print" }).promise;
    images.push(canvas.toDataURL("image/jpeg", 0.9));
  }
  return images;
}

// 金額のセルか（「1,234,567」「-620,000」「△745,000」。OCRでカンマが点になったものも含む）

// 表の各行から、科目・前残・借方・貸方・残高を取り出す
function parseTrialTable(allRows) {

  const headerText = allRows.slice(0, 12).map(c => c.join(" ")).join("\n");
  const codeRows = allRows.filter(c => /[［\[]\s*\d{2,5}/.test(c.join(" "))).length;
  const needCode = codeRows >= 5; // 番号付きの試算表（PCAなど）は、番号のない行を合計行とみなす
  // 科目番号の桁数: 閉じかっこまで読めた行で一番多い桁数（閉じかっこ「］」は数字の1と読まれることがあるため）
  const lens = {};
  for (const c of allRows) { const m = c.join(" ").match(/[［\[]\s*(\d{2,5})\s*[］\]]/); if (m) lens[m[1].length] = (lens[m[1].length] || 0) + 1; }
  const codeLen = Number(Object.entries(lens).sort((a, b) => b[1] - a[1])[0]?.[0] || 3);
  for (const cells of allRows) {
    const joined = cells.join(" ");
    let srcCode = (joined.match(new RegExp(`[［\\[]\\s*(\\d{${codeLen}})`)) || [])[1] || "";
    const name = [], nums = [];
    // 1つのセルに数字が2つ入ることがある（例:「364,391,455 100.00」）ので、空白で分けてから判定する
    const tokens = cells.flatMap((raw, i) => raw.replace(/(\d)[,.、]\s+(\d)/g, "$1,$2").trim().split(/\s+/).map(t => ({ t, first: i === 0 })));
    tokens.forEach(({ t, first }) => {
      if (!t) return;
      if (first && !srcCode && /^\d{3,4}$/.test(t) && cells.length > 2) { srcCode = t; return; } // 先頭の列が科目コード（ミロク形式など）
      if (nums.length && RATIO_RE.test(t)) return;
      if (AMOUNT_RE.test(t)) { nums.push(toAmount(t)); return; }
      if (!nums.length) name.push(t);
    });
    const srcName = name.join("").replace(/[［\[].*$/, "").replace(/\s/g, "");
    if ((!srcName && !srcCode) || nums.length < 4) continue; // 科目名が読めなくても番号があれば残す
    if (needCode && !srcCode) continue;
    if (isSubtotalName(srcName) || /^9\d{3}$/.test(srcName) || /^9\d{3}$/.test(srcCode)) continue;
    const [zen, debit, credit, zan] = nums.slice(-4);
    const ok = zen + debit - credit === zan || zen - debit + credit === zan;
    accounts.push({ srcCode, srcName, zen, debit, credit, zan, ok });
  }
  // 伝票日付の初期値: 見出しにある日付のうち一番新しいもの（例: 令和8年7月31日）
  const dates = [];
  const t = headerText.replace(/(\d)(\d{1,2}:\d{2})/g, "$1 $2");
  for (const m of t.matchAll(/(?:令和|R)\s*(\d{1,2}|元)\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/g)) dates.push([2018 + (m[1] === "元" ? 1 : +m[1]), +m[2], +m[3]]);
  for (const m of t.matchAll(/(20\d{2})\s*[年/.\-]\s*(\d{1,2})\s*[月/.\-]\s*(\d{1,2})/g)) dates.push([+m[1], +m[2], +m[3]]);
  const valid = dates.filter(([y, m, d]) => validDate(y, m, d)).map(([y, m, d]) => `${y}-${pad(m)}-${pad(d)}`).sort();
  return { accounts, date: valid[valid.length - 1] || "" };
}

// ---- Excel・CSVの試算表 ----
// Excelは文字認識を通さず、セルの値をそのまま使う（同梱の SheetJS を必要なときだけ読み込む）
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = Object.assign(document.createElement("script"), { src, onload: resolve, onerror: () => reject(new Error("部品を読み込めませんでした")) });
    document.head.appendChild(el);
  });
}
const isSheetFile = f => /\.(xlsx|xlsm|xls|csv)$/i.test(f.name) || /spreadsheet|excel|text\/csv/.test(f.type);
async function sheetToRows(file) {
  // CSVは文字コード（UTF-8／Excelの標準のShift_JIS）を見分けて読む
  if (/\.csv$/i.test(file.name) || /text\/csv/.test(file.type)) return readCsvFile(file);
  if (!window.XLSX) await loadScript("vendor/sheetjs/xlsx.full.min.js");
  const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: "array", codepage: 932 });
  // すべてのシートを上から順に（試算表が複数シートに分かれている場合も読む）
  return wb.SheetNames.flatMap(name => XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false, defval: "" })
    .map(row => row.map(v => String(v ?? "").trim())));
}

// ---- 会社ごとのマスタのファイル（CSV・Excel）を読む ----
async function readTableFile(file) {
  return /\.(xlsx|xlsm|xls)$/i.test(file.name) ? sheetToRows(file) : readCsvFile(file);
}
const isCodeCell = v => /^\d{1,8}$/.test(String(v).trim());
// 見出しの行から列を探す（例:「コード」「科目名」）。見つからなければ -1
function findHeader(rows, tests) {
  for (let i = 0; i < Math.min(rows.length, 30); i++) {
    // 同じ列を2回使わない（「科目コード」は「コード」にも「科目」にも当てはまるため）
    const cols = [];
    for (const re of tests) cols.push(rows[i].findIndex((c, k) => !cols.includes(k) && re.test(String(c))));
    if (cols.every(c => c >= 0)) return { row: i, cols };
  }
  return null;
}
// 見出しがないとき: 「数字の列」と「その右の文字の列」が一番多く並んでいる位置を使う
function guessCodeName(rows) {
  const count = {};
  for (const r of rows) for (let i = 0; i + 1 < r.length; i++) if (isCodeCell(r[i]) && r[i + 1] && !isCodeCell(r[i + 1])) count[i] = (count[i] || 0) + 1;
  const best = Object.entries(count).sort((a, b) => b[1] - a[1])[0];
  return best ? Number(best[0]) : -1;
}
// ミロク科目マスタ: [{ code, name }]
function parseMasterRows(rows) {
  const h = findHeader(rows, [/コード|ｺｰﾄﾞ|code/i, /科目名|名称|name/i]) || findHeader(rows, [/コード|ｺｰﾄﾞ|code/i, /科目/]);
  let at, from = 0, cc, nc;
  if (h) { [cc, nc] = h.cols; from = h.row + 1; }
  else { at = guessCodeName(rows); if (at < 0) return []; cc = at; nc = at + 1; }
  const seen = new Set(), out = [];
  for (const r of rows.slice(from)) {
    const code = String(r[cc] ?? "").trim(), name = String(r[nc] ?? "").trim();
    if (!isCodeCell(code) || !name || seen.has(code)) continue;
    seen.add(code); out.push({ code, name });
  }
  return out;
}
// 別会計ソフトの科目: [{ srcCode, srcName, code }]。ミロクのコードの列がなければ code は空（あとで科目名から推測する）
function parseSourceRows(rows) {
  // 「勘　定　科　目」のように間に空白が入った見出しも読めるよう、セルの空白を取る
  rows = rows.map(r => r.map(c => String(c ?? "").replace(/[\s　]+/g, "")));
  // 弥生会計の仕訳データ（見出しなし。1列目が識別フラグ 2000/2110/2111 など、5列目が借方科目、11列目が貸方科目）
  const yayoi = rows.filter(r => /^2[01]\d\d$/.test(r[0]) && r.length >= 11);
  if (yayoi.length >= 3 && yayoi.length >= rows.length * 0.5) {
    const names = yayoi.flatMap(r => [r[4], r[10]]).filter(n => n && !isCodeCell(n) && !/^諸口$/.test(n));
    return uniqueSources(names.map(n => ({ srcCode: "", srcName: n, code: "" })));
  }
  const h3 = findHeader(rows, [/(元|別|旧).*(コード|番号)|^(コード|番号|科目コード)$/, /(元|別|旧)?.*科目名?$|名称/, /ミロク/]);
  if (h3) {
    const [sc, nc, mc] = h3.cols;
    return rows.slice(h3.row + 1).map(r => ({ srcCode: isCodeCell(r[sc]) ? String(r[sc]).trim() : "", srcName: String(r[nc] ?? "").trim(), code: isCodeCell(r[mc]) ? String(r[mc]).trim() : "" }))
      .filter(x => x.srcName);
  }
  // 試算表のファイル（「借方」「貸方」の見出しがある）なら、そこから科目を取り出す（弥生会計のようにコードがなく科目名だけでもよい）
  if (rows.slice(0, 30).some(r => r.some(c => /借[\s　]*方/.test(c)) && r.some(c => /貸[\s　]*方/.test(c)))) {
    const fromTrial = parseTrialSheet(rows).accounts;
    if (fromTrial.length) return uniqueSources(fromTrial.map(a => ({ srcCode: a.srcCode || "", srcName: a.srcName, code: "" })));
  }
  // 見出しなし: 「番号, 科目名, ミロクコード」または「番号, 科目名」
  const at = guessCodeName(rows);
  if (at >= 0) return rows.filter(r => isCodeCell(r[at]) && r[at + 1] && !isCodeCell(r[at + 1]))
    .map(r => ({ srcCode: String(r[at]).trim(), srcName: String(r[at + 1]).trim(), code: isCodeCell(r[at + 2] ?? "") ? String(r[at + 2]).trim() : "" }));
  // 科目名の列（見出しが「勘定科目」「科目名」「名称」など）だけの一覧。右にミロクのコードの列があれば使う
  const hn = findHeader(rows, [/科目|勘定|名称/]);
  if (!hn) {
    // 見出しもコードもなく、科目名だけが並んでいる一覧（弥生会計の科目の書き出しなど）: 科目名の多い列を使う
    const isName = c => c && !isCodeCell(c) && !AMOUNT_RE.test(c) && /[\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}]/u.test(c);
    const width = Math.max(0, ...rows.map(r => r.length));
    let best = -1, hits = 0;
    for (let c = 0; c < width; c++) { const n = rows.filter(r => isName(r[c])).length; if (n > hits) { best = c; hits = n; } }
    if (hits < 3) return [];
    return uniqueSources(rows.map(r => r[best]).filter(isName).filter(n => !/合計|小計/.test(n)).map(n => ({ srcCode: "", srcName: n, code: "" })));
  }
  const nc = hn.cols[0], mc = rows[hn.row].findIndex((c, k) => k !== nc && /ミロク/.test(c));
  return uniqueSources(rows.slice(hn.row + 1).map(r => ({ srcCode: "", srcName: String(r[nc] ?? "").replace(/[\s　]+/g, ""), code: mc >= 0 && isCodeCell(r[mc]) ? String(r[mc]).trim() : "" }))
    .filter(x => x.srcName && !isCodeCell(x.srcName) && !isSubtotalName(x.srcName)));
}
// 同じ科目（コードか科目名が同じもの）は1つにする
function uniqueSources(items) {
  const seen = new Set();
  return items.filter(x => { const k = srcKeyOf(x.srcCode, x.srcName); if (seen.has(k)) return false; seen.add(k); return true; });
}
// 会社にマスタを入れる（置き換え）
function setCompanyMaster(cid, items) { masters[cid] = items.map(m => ({ ...m })); saveMasters(); }
// 会社に別会計ソフトの対応を入れる。ミロクのコードがない科目は、その会社の科目マスタの科目名から推測する
function setCompanySource(cid, items, replace) {
  if (replace) mappings[cid] = {};
  const map = mappingOf(cid);
  let guessed = 0;
  for (const it of items) {
    const code = it.code || suggestCode(it.srcName, cid);
    if (!it.code && code) guessed++;
    map[srcKeyOf(it.srcCode, it.srcName)] = { code, srcName: it.srcName, srcCode: it.srcCode };
  }
  saveMasters();
  return { total: items.length, guessed, unset: items.filter(it => !map[srcKeyOf(it.srcCode, it.srcName)].code).length };
}

// 見出しの行（「借方」「貸方」を含む行）から列の位置を決めて読む。見つからなければ表の読み取りと同じ方法で読む
// 小計・合計・見出しの行（科目ではない行）か
function isSubtotalName(name) {
  const n = String(name).replace(/\s/g, "");
  return /計$|合計|小計|累計|総計/.test(n)
    || /^[【〔(（［\[<＜《].*[】〕)）］\]>＞》]$/.test(n)
    || /の部$|^(資産|負債|純資産|負債純資産|負債・純資産)(の部)?$/.test(n)
    || /^(売上総|営業|経常|税引前当期純?|税引前|当期純?)(利益|損失|損益)/.test(n)
    || /^(純売上高|売上高合計|売上原価合計|製造原価合計|当期総製造費用|売上総損益金額|営業損益金額|経常損益金額|税引前当期純損益金額|当期純損益金額)$/.test(n)
    || /^(流動資産|固定資産|有形固定資産|無形固定資産|投資その他の資産|繰延資産|流動負債|固定負債|株主資本|利益剰余金|その他利益剰余金|資本剰余金|評価・換算差額等|販売費及び一般管理費|営業外収益|営業外費用|特別利益|特別損失|売上原価|製造原価|製造費用|当期製造費用|当期製品製造原価)$/.test(n);
}
// 科目コードの列がある表では、コードのない行（見出しや小計）は読まない
function dropUncoded(accounts) {
  const coded = accounts.filter(a => a.srcCode).length;
  return coded >= 5 && coded >= accounts.length * 0.5 ? accounts.filter(a => a.srcCode) : accounts;
}
// 見出しの行（「借方」と「貸方」を含む行）か
const isTrialHeader = r => r.some(c => /借方/.test(c)) && r.some(c => /貸方/.test(c)) && !r.some(c => AMOUNT_RE.test(String(c).replace(/[,\s]/g, "")) && /\d{3,}/.test(c));
// 試算表がいくつかの表（貸借対照表と損益計算書のシートなど）に分かれていて、表ごとに列の並びが違うこともあるので、
// 見出しの行ごとに区切って、それぞれの表の見出しから列の位置を決めて読む
function parseTrialSheet(rows) {
  // 「借　方」「勘 定 科 目」のように間に空白が入った見出しも読めるよう、セルの空白を取る
  rows = rows.map(r => r.map(c => String(c ?? "").replace(/[\s　]+/g, "")));
  const starts = rows.map((r, i) => isTrialHeader(r) ? i : -1).filter(i => i >= 0);
  if (starts.length > 1) {
    const parts = starts.map((s, k) => parseTrialSheetPart(rows.slice(s, starts[k + 1] ?? rows.length)));
    const accounts = dropUncoded(parts.flatMap(p => p.accounts));
    const { date } = parseTrialTable(rows.slice(0, 12).map(r => r.filter(c => c !== "")));
    return { accounts, date };
  }
  return parseTrialSheetPart(rows);
}
function parseTrialSheetPart(rows) {
  const headerIdx = rows.findIndex((r, i) => i < 30 && r.some(c => /借方/.test(c)) && r.some(c => /貸方/.test(c)));
  if (headerIdx < 0) return parseTrialTable(rows.map(r => r.filter(c => c !== "")));
  // 見出しが2段になっている表にも対応するため、見出し行と次の行の文字をつなげて列ごとに見る
  const head = rows[headerIdx].map((c, i) => c + (rows[headerIdx + 1]?.[i] && !AMOUNT_RE.test(rows[headerIdx + 1][i].replace(/[,\s]/g, "")) ? rows[headerIdx + 1][i] : ""));
  const find = (re, not) => head.findIndex(h => re.test(h) && !(not && not.test(h)));
  const debitCol = find(/借方/, /残高|繰越|前|期首/);
  const creditCol = find(/貸方/, /残高|繰越|前|期首/);
  const zenCol = find(/前月|前残|前期|期首|繰越/);
  const zanCol = find(/残高/, /前月|前残|期首|繰越|借方残高|貸方残高/);
  let codeCol = find(/コード|番号|^No|^ＮＯ/i);
  let nameCol = find(/科目|勘定/);
  // 見出しに「コード」がなくても、借方の列より左で、ほとんどの行が番号（2〜6桁）の列を科目コードの列とみなす
  if (codeCol < 0) {
    const body = rows.slice(headerIdx + 1).filter(r => r.some(c => String(c).trim()));
    for (let c = 0; c < Math.min(debitCol, creditCol); c++) {
      if (/繰越|残高|金額|借方|貸方|前月|前期|期首|合計|構成|比率/.test(head[c] || "")) continue; // 金額の列は科目コードの列ではない
      const hits = body.filter(r => /^\s*\d{2,6}\s*$/.test(String(r[c] ?? ""))).length;
      if (body.length && hits >= body.length * 0.4) { codeCol = c; break; }
    }
    if (codeCol === nameCol) nameCol = codeCol === 0 ? 1 : 0;
  }
  if (nameCol < 0) nameCol = codeCol === 0 ? 1 : 0;
  if (debitCol < 0 || creditCol < 0) return parseTrialTable(rows.map(r => r.filter(c => c !== "")));
  const amount = v => {
    const t = String(v || "").replace(/[,\s円¥￥]/g, "");
    if (!t) return 0;
    const neg = /^[-△▲]|^\(.*\)$/.test(t);
    const n = Number(t.replace(/[^\d.]/g, ""));
    return Number.isFinite(n) ? Math.round(neg ? -n : n) : 0;
  };
  const accounts = [];
  for (const row of rows.slice(headerIdx + 1)) {
    let srcName = String(row[nameCol] || "").replace(/\s/g, "");
    let srcCode = codeCol >= 0 ? String(row[codeCol] || "").trim() : "";
    const m = srcName.match(/^(.*?)[［\[]\s*(\d+)\s*[］\]]?$/); // 「現金［111］」のように番号が科目名に付いている形
    if (m) { srcName = m[1]; srcCode ||= m[2]; }
    if (!srcCode && /^\d{2,5}$/.test(String(row[0] || "")) && nameCol !== 0) srcCode = String(row[0]);
    if (!srcName || isSubtotalName(srcName) || /^9\d{3}$/.test(srcCode)) continue;
    const debit = amount(row[debitCol]), credit = amount(row[creditCol]);
    const zen = zenCol >= 0 ? amount(row[zenCol]) : 0, zan = zanCol >= 0 ? amount(row[zanCol]) : 0;
    if (!debit && !credit && !zen && !zan) continue;
    const ok = zenCol < 0 || zanCol < 0 || zen + debit - credit === zan || zen - debit + credit === zan;
    accounts.push({ srcCode, srcName, zen, debit, credit, zan, ok });
  }
  const { date } = parseTrialTable(rows.slice(0, 12).map(r => r.filter(c => c !== "")));
  return { accounts: dropUncoded(accounts), date };
}

async function importTrial(files) {
  if (!currentCompany()) { alert("先に会社を登録・選択してください。"); openCompanies(); return; }
  const banner = document.getElementById("ocrBanner");
  const show = msg => { banner.textContent = msg; banner.hidden = false; };
  try {
    // Excel・CSV はセルの値をそのまま使い、PDF・画像は文字認識で表を読み取る
    const sheets = files.filter(isSheetFile), others = files.filter(f => !isSheetFile(f));
    let accounts = [], date = "";
    for (const file of sheets) {
      show(`Excelを読み込んでいます（${file.name}）…`);
      const res = parseTrialSheet(await sheetToRows(file));
      accounts.push(...res.accounts); date = date || res.date;
    }
    if (others.length) {
      const pages = [];
      for (const file of others) {
        if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) { show(`PDFを開いています（${file.name}）…`); pages.push(...await pdfToImages(file)); }
        else pages.push(await resize(file, OCR_MAX_SIDE, 0.9));
      }
      const allRows = [];
      for (let i = 0; i < pages.length; i++) { show(`試算表を読み取っています（${i + 1} / ${pages.length} ページ）…`); allRows.push(...await readTablePage(pages[i])); }
      const res = parseTrialTable(allRows);
      accounts.push(...res.accounts); date = date || res.date;
    }
    // PCA会計の試算表は、科目にコード番号が付いている。番号のない行（純売上高・営業利益などの集計）は読まない
    if (systemOf().id === "pca" && accounts.some(a => a.srcCode)) accounts.splice(0, accounts.length, ...accounts.filter(a => a.srcCode));
    banner.hidden = true;
    if (!accounts.length) { alert("試算表の科目を読み取れませんでした。Excelの場合は「借方」「貸方」の見出しがある表か確認してください。写真の場合は、表全体がまっすぐ写るように撮り直してください。"); return; }

    const map = mappingOf();
    const groupId = uid();
    const made = [];
    for (const a of accounts) {
      const key = srcKeyOf(a.srcCode, a.srcName);
      const learnedD = mappedCode(map[key], "debit"), learnedC = mappedCode(map[key], "credit");
      const learned = learnedD || learnedC;
      // 会社の対応表 → 標準の対応（番号と科目名が一致）→ 科目名からの推測 の順に探す
      // 番号が一致し、科目名もほぼ同じ（読み取りで1〜2文字違うことがあるため）ものを使う
      // Web版の文字認識では科目名（漢字）が読めず番号だけになることがあるので、そのときは番号だけで標準の対応を使い、科目名も補う
      const nameUnread = !/[\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}]/u.test(a.srcName);
      const stdHit = a.srcCode && systemOf().mapping.find(d => d.srcCode === a.srcCode && (nameUnread || nameSimilarity(normName(a.srcName), normName(d.srcName)) >= 0.6));
      if (stdHit && nameUnread) a.srcName = stdHit.srcName;
      const std = stdHit?.code;
      const code = learned || std || suggestCode(a.srcName);
      const base = { id: "", groupId, companyId: currentCompanyId, source: TRIAL_SOURCE, thumb: "", status: "done", review: "pending",
        date, summary: "", debitCode: "", debitSub: "", debitAmount: "", creditCode: "", creditSub: "", creditAmount: "",
        srcKey: key, srcCode: a.srcCode, srcName: a.srcName, codeHow: learned ? "対応表" : std ? "標準の対応" : code ? "推測" : "", note: "", _ok: a.ok };
      if (a.debit) made.push({ ...base, id: uid(), debitCode: learnedD || code, debitAmount: a.debit });
      if (a.credit) made.push({ ...base, id: uid(), creditCode: learnedC || code, creditAmount: a.credit });
    }
    const d = made.reduce((s, r) => s + Number(r.debitAmount || 0), 0), c = made.reduce((s, r) => s + Number(r.creditAmount || 0), 0);
    // 借方と貸方の合計がずれているときだけ、前残・残高の計算が合わない行に目印をつける（読み間違いの候補）
    for (const r of made) { if (d !== c && !r._ok) r.note = "前残・残高の計算が合いません（金額の読み間違いの可能性）"; delete r._ok; }
    rows.push(...made);
    save(); render();
    const unset = made.filter(r => !(r.debitCode || r.creditCode)).length;
    showToast(`${made.length}行` + (d === c ? "" : `／貸借差額 ${Math.abs(d - c).toLocaleString()}円`) + (unset ? `／コード未設定 ${unset}行` : ""));
  } catch (err) {
    banner.hidden = true;
    alert(`試算表を読み取れませんでした: ${err.message || err}`);
  }
}

// 試算表の行: 元の科目の対応を決めたら、同じ科目の行すべてに反映し、対応表に覚える
// 対応表のコード。借方・貸方で別のコードを覚えていればそれを使う
// （例: PCAの「期末材料棚卸高」は、ミロクでは借方が「期首材料棚卸高」、貸方が「期末材料棚卸高」）
const mappedCode = (e, side) => e ? (e[side === "debit" ? "debitCode" : "creditCode"] || e.code || "") : "";
// 対応を覚えて、同じ元の科目の行に反映する。side: "debit"／"credit" はその側だけ、なしは両側の基本のコード
function applyMapping(row, code, side) {
  if (!row.srcKey) return;
  const map = mappingOf(row.companyId);
  const e = map[row.srcKey] ||= { code: "", srcName: row.srcName, srcCode: row.srcCode };
  if (side) { e[side === "debit" ? "debitCode" : "creditCode"] = code; if (!e.code) e.code = code; }
  else e.code = code;
  for (const k of ["debitCode", "creditCode"]) if (k in e && (!e[k] || e[k] === e.code)) delete e[k];
  if (!e.code && !e.debitCode && !e.creditCode) delete map[row.srcKey];
  for (const r of rows) {
    if (r.companyId !== row.companyId || r.srcKey !== row.srcKey || r.review === "exported") continue;
    const rs = Number(r.debitAmount) ? "debit" : "credit", key = rs + "Code";
    if (side && rs !== side && r[key]) continue; // 反対側は、まだ空のときだけ埋める
    r[key] = mappedCode(map[row.srcKey], rs);
    r.codeHow = r[key] ? "対応表" : "";
  }
  saveMasters(); save();
}

// CSVの読み込み（Shift_JIS / UTF-8 のどちらでも）
async function readCsvFile(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  let text;
  try { text = new TextDecoder("utf-8", { fatal: true }).decode(buf); } catch { text = new TextDecoder("shift_jis").decode(buf); }
  text = text.replace(/^﻿/, "");
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  // 区切りはカンマのほか、タブ区切りで書き出す会計ソフトもあるので、多い方を使う
  const count = ch => lines.slice(0, 30).reduce((n, l) => n + l.split(ch).length - 1, 0);
  const sep = count("\t") > count(",") ? "\t" : ",";
  return lines.map(line => {
    const cells = []; let cur = "", q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
      else if (ch === '"') q = true; else if (ch === sep) { cells.push(cur); cur = ""; } else cur += ch;
    }
    cells.push(cur);
    return cells.map(c => c.trim());
  });
}

  for (const el of document.querySelectorAll("[data-view]")) el.classList.toggle("active", el.dataset.view === view);
  document.getElementById("crumb").innerHTML = view === "import" ? "仕訳 / <b>取り込み</b>" : "マスタ / <b>会社マスタ</b>";
  if (view === "companies") renderCompanyList(); else render();
  scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const v = e.target.closest("[data-view]");
  if (v) { e.preventDefault(); showView(v.dataset.view); }
});

// ---- 会社の選択（取り込みの画面） ----
const coPickerMenu = document.getElementById("coPickerMenu");
const coPickerSearch = document.getElementById("coPickerSearch");
function renderCompany() {
  document.getElementById("coPickerName").textContent = currentCompany()?.name || "会社を選んでください";
  const q = normName(coPickerSearch.value);
  const shown = companies.filter(c => !q || normName(c.name).includes(q));
  document.getElementById("coPickerList").innerHTML = shown.length
    ? shown.map(c => `<button class="co-picker-item ${c.id === currentCompanyId ? "active" : ""}" data-pick="${c.id}" role="option">
        <span>${escapeHtml(c.name)}</span><span class="method-tag t-${c.method || "receipt"}">${escapeHtml(methodLabel(c))}</span></button>`).join("")
    : `<div class="co-picker-empty">${companies.length ? "見つかりません" : "会社はまだありません"}</div>`;
}
function closeCoPicker() { coPickerMenu.hidden = true; }
document.getElementById("coPickerBtn").onclick = () => {
  if (!coPickerMenu.hidden) return closeCoPicker();
  coPickerSearch.value = "";
  renderCompany();
  coPickerMenu.hidden = false;
  if (!matchMedia("(max-width: 860px)").matches) coPickerSearch.focus(); // スマホはキーボードが急に出ないように
};
coPickerSearch.addEventListener("input", renderCompany);
coPickerSearch.addEventListener("keydown", e => {
  // Enter で一番上の会社を選ぶ（日本語入力の変換確定は除く）
  if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) document.querySelector("#coPickerList [data-pick]")?.click();
  if (e.key === "Escape") closeCoPicker();
});
document.getElementById("coPickerList").addEventListener("click", e => {
  const b = e.target.closest("[data-pick]"); if (!b) return;
  closeCoPicker();
  switchCompany(b.dataset.pick);
});
document.getElementById("coPickerAdd").onclick = () => { closeCoPicker(); openCompanies(); };
document.addEventListener("click", e => { if (!e.target.closest("#coPicker")) closeCoPicker(); });
function switchCompany(id) {
  currentCompanyId = id;
  const c = currentCompany();
  // 会社の種類（原始資料・日計表・試算表）に取り込み方法を合わせる
  if (c) { settings.method = c.method || "receipt"; if (settings.method === "receipt") settings.docType = "receipt"; saveSettings(); renderMethod(); }
  saveCompanies();
  render();
}


// ---- 会社の画面 ----
function openCompanies() {
  showView("companies");
  openAddCompany();
}
document.getElementById("companySearch").addEventListener("input", renderCompanyList);
// 会社一覧のタグ: 「原始資料（レシート）」「試算表（PCA会計）」など
function methodLabel(c) {
  if (c.method === TRIAL_SOURCE) return systemOf(c.id).id ? `試算表（${systemOf(c.id).name}）` : "試算表（会計ソフト未設定）";
  if (c.method === "format2") return "日計表";
  return "原始資料";
}
function renderCompanyList() {
  const listEl = document.getElementById("companyList");
  document.getElementById("companyCount").textContent = companies.length ? `${companies.length}社` : "";
  const q = normName(document.getElementById("companySearch").value);
  const shown = companies.filter(c => !q || normName(c.name).includes(q));
  listEl.innerHTML = !companies.length ? `<div class="company-empty">会社はまだありません</div>`
    : !shown.length ? `<div class="company-empty">見つかりません</div>`
    : shown.map(c => `<div class="company-item">
      <div class="co-main">
        <span class="co-name">${escapeHtml(c.name)}</span>
        <span class="method-tag t-${c.method || "receipt"}">${escapeHtml(methodLabel(c))}</span>
      </div>
      <button class="btn btn-sm open-master" data-cid="${c.id}">会社設定</button>
      <button class="icon-btn" data-remove="${c.id}" title="削除"><svg><use href="#i-trash"/></svg></button>
    </div>`).join("");
}
document.addEventListener("click", e => {
  const t = e.target.closest(".open-companies");
  if (t) { e.preventDefault(); openCompanies(); }
});
// 会社を追加する画面: 会社名 → 取り込むもの →（試算表なら）元の会計ソフト。すべて選ぶまで追加できない
const addDlg = document.getElementById("addDlg");
const newSystemSel = document.getElementById("newCompanySystem");
newSystemSel.innerHTML = `<option value="">選んでください</option>` + SOURCE_SYSTEMS.map(x => `<option value="${x.id}">${escapeHtml(x.name)}</option>`).join("");
const newType = () => document.querySelector("#newCompanyType .active")?.dataset.type || "";
let newMasterItems = null, newSourceItems = null;
function setFileStatus(id, text, ok) { const el = document.getElementById(id); el.textContent = text; el.classList.toggle("ok", !!ok); el.classList.toggle("ng", ok === false); }
document.getElementById("newMasterFile").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  newMasterItems = parseMasterRows(await readTableFile(file));
  if (!newMasterItems.length) { newMasterItems = null; setFileStatus("newMasterStatus", "読み取れませんでした", false); }
  else setFileStatus("newMasterStatus", `${newMasterItems.length}科目`, true);
});
document.getElementById("newSourceFile").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  newSourceItems = parseSourceRows(await readTableFile(file));
  if (!newSourceItems.length) { newSourceItems = null; setFileStatus("newSourceStatus", "読み取れませんでした", false); }
  else setFileStatus("newSourceStatus", `${newSourceItems.length}科目`, true);
});
function updateAddDlg() {
  document.getElementById("newSystemWrap").hidden = newType() !== TRIAL_SOURCE;
  document.getElementById("newSourceRow").hidden = newType() !== TRIAL_SOURCE;
  document.getElementById("addCompany").disabled = !document.getElementById("newCompany").value.trim() || !newType() || (newType() === TRIAL_SOURCE && !newSystemSel.value);
}
function openAddCompany() {
  document.getElementById("newCompany").value = "";
  for (const x of document.querySelectorAll("#newCompanyType [data-type]")) x.classList.remove("active");
  newSystemSel.value = "";
  newMasterItems = newSourceItems = null;
  setFileStatus("newMasterStatus", "未選択"); setFileStatus("newSourceStatus", "未選択");
  updateAddDlg();
  addDlg.hidden = false;
  setTimeout(() => document.getElementById("newCompany").focus(), 50);
}
document.getElementById("openAddCompany").onclick = openAddCompany;
document.getElementById("addClose").onclick = () => { addDlg.hidden = true; };
document.getElementById("newCompany").addEventListener("input", updateAddDlg);
newSystemSel.onchange = updateAddDlg;
document.getElementById("newCompanyType").onclick = e => {
  const b = e.target.closest("[data-type]"); if (!b) return;
  for (const x of document.querySelectorAll("#newCompanyType [data-type]")) x.classList.toggle("active", x === b);
  updateAddDlg();
};
document.getElementById("addCompany").onclick = () => {
  updateAddDlg();
  if (document.getElementById("addCompany").disabled) return;
  const name = document.getElementById("newCompany").value.trim();
  const c = { id: uid(), name, method: newType() };
  if (c.method === TRIAL_SOURCE) c.system = newSystemSel.value;
  companies.push(c);
  // 読み込んだマスタを入れる（先にミロク科目マスタ、次に別会計ソフトの科目 → 科目名からミロクのコードを推測）
  let note = "";
  if (newMasterItems) setCompanyMaster(c.id, newMasterItems);
  if (newSourceItems && c.method === TRIAL_SOURCE) {
    const res = setCompanySource(c.id, newSourceItems, true);
    if (res.unset) note = `（ミロクのコード未設定 ${res.unset}件は、会社設定で選んでください）`;
  }
  addDlg.hidden = true;
  switchCompany(c.id); // 追加した会社にそのまま切り替える
  renderCompanyList();
  showToast(`「${name}」を追加しました${note}`);
};
// 日本語入力の変換確定の Enter では追加しない
document.getElementById("newCompany").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) document.getElementById("addCompany").click();
});
document.getElementById("companyList").addEventListener("click", e => {
  const t = e.target.closest("[data-remove]");
  if (!t) return;
  const c = companies.find(x => x.id === t.dataset.remove);
  const n = rows.filter(r => r.companyId === c.id).length;
  if (!confirm(n ? `「${c.name}」を削除すると、仕訳 ${n} 件も削除されます。よろしいですか？` : `「${c.name}」を削除しますか？`)) return;
  rows = rows.filter(r => r.companyId !== c.id);
  companies = companies.filter(x => x !== c);
  if (currentCompanyId === c.id) currentCompanyId = companies[0]?.id || null;
  saveCompanies(); save();
  renderCompanyList(); renderCompany(); pruneImages();
});


// ---- 取り込み方法（①レシート ②③は今後フォーマットを追加） ----
// ①原始資料は、さらに種類（レシート・領収書／給与台帳／通帳）ごとに読み込み方を分ける
function renderMethod() {
  const method = settings.method || "receipt";
  const doc = settings.docType || "receipt";
  for (const b of document.querySelectorAll(".method")) b.classList.toggle("active", b.dataset.method === method);
  for (const b of document.querySelectorAll(".doc-type")) b.classList.toggle("active", b.dataset.doc === doc);
  document.getElementById("docTypes").hidden = method !== "receipt";
  const fmt = importFormat(method);
  const ready = (method === "receipt" ? doc === "receipt" : true) && fmt.types.length > 0;
  document.getElementById("methodSoon").hidden = ready;
  const docName = method === "receipt" ? (AUTO_RULE_TYPES.find(t => t.id === doc) || AUTO_RULE_TYPES[0]).name : fmt.name;
  document.getElementById("methodSoonNote").textContent = (method !== "receipt" || doc === "receipt") && !fmt.types.length ? `${docName}は、iPhoneアプリで読み取れます` : "準備中";
  // 試算表はPDFでも読み込めるようにする
  for (const el of document.querySelectorAll(".pick-label")) {
    el.dataset.orig ||= el.textContent;
    el.textContent = "ファイルを選ぶ";
  }
  for (const input of document.querySelectorAll(".file-picker:not([capture])")) input.accept = fmt.types.map(t => FILE_TYPES[t]).join(",");
  const label = el => el ? el.textContent.replace("準備中", "").trim() : "";
  const activeMethod = document.querySelector(`.method[data-method="${method}"]`);
  const activeDoc = document.querySelector(`.doc-type[data-doc="${doc}"]`);
  document.getElementById("methodSoonTitle").textContent =
    method === "receipt" ? label(activeDoc) : label(activeMethod).replace(/^[①②③]/, "");
  document.body.classList.toggle("method-off", !ready);
}
document.getElementById("docTypes").addEventListener("click", e => {
  const b = e.target.closest("[data-doc]");
  if (!b) return;
  settings.docType = b.dataset.doc;
  saveSettings();
  renderMethod();
});
document.getElementById("methods").addEventListener("click", e => {
  const b = e.target.closest("[data-method]");
  if (!b) return;
  settings.method = b.dataset.method;
  saveSettings();
  renderMethod();
  render(); // 取り込み方法ごとに一覧が分かれているため
});
renderMethod();

// ---- 設定（CSVの形式） ----
const settingsDlg = document.getElementById("settings");
for (const el of document.querySelectorAll(".open-settings")) el.addEventListener("click", e => { e.preventDefault(); settingsDlg.hidden = false; });
document.getElementById("settingsClose").onclick = () => { settingsDlg.hidden = true; };

// ---- カメラ（アプリ内で連続撮影） ----
const cameraEl = document.getElementById("camera");
const video = document.getElementById("video");
let stream = null;
let shotCount = 0;

async function openCamera() {
  if (!currentCompany()) { alert("先に会社を登録・選択してください。"); openCompanies(); return; }
  if (NATIVE) return scanReceipts();
  shotCount = 0;
  document.getElementById("camCount").textContent = "0枚";
  document.getElementById("camLast").hidden = true;
  document.getElementById("camMsg").hidden = true;
  cameraEl.classList.remove("no-stream");
  cameraEl.hidden = false;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    });
    video.srcObject = stream;
    await video.play();
  } catch (err) {
    // 権限拒否や非対応ブラウザでは、OS標準のカメラで撮る方法を案内する
    document.getElementById("camMsgText").textContent =
      err && err.name === "NotAllowedError" ? "カメラの使用が許可されていません。ブラウザの設定で許可するか、標準カメラで撮影してください。" : "カメラを起動できませんでした。";
    document.getElementById("camMsg").hidden = false;
    cameraEl.classList.add("no-stream");
  }
}

// iPhoneアプリでは標準の書類スキャンを使う（四隅の自動検出・傾き補正・影の除去で読み取りが正確になる）。
// 1回のスキャンで何枚でも続けて撮れる
async function scanReceipts() {
  try {
    const { images } = await callNative("scanDocument");
    if (!images || !images.length) return; // 閉じた
    const files = images.map((b64, i) => {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
      return new File([bytes], `scan_${Date.now()}_${i}.jpg`, { type: "image/jpeg" });
    });
    await addFiles(files);
  } catch (err) {
    alert(err.message || "スキャンを開けませんでした");
  }
}

function closeCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  video.srcObject = null;
  cameraEl.hidden = true;
}

document.getElementById("shutter").onclick = () => {
  if (!stream || !video.videoWidth) return;
  const c = document.createElement("canvas");
  c.width = video.videoWidth;
  c.height = video.videoHeight;
  c.getContext("2d").drawImage(video, 0, 0);
  const flash = document.getElementById("camFlash");
  flash.classList.add("on");
  setTimeout(() => flash.classList.remove("on"), 60);
  c.toBlob(blob => {
    addFiles([new File([blob], `receipt_${Date.now()}.jpg`, { type: "image/jpeg" })]);
    const last = document.getElementById("camLast");
    last.src = URL.createObjectURL(blob);
    last.hidden = false;
    document.getElementById("camCount").textContent = `${++shotCount}枚`;
  }, "image/jpeg", 0.92);
};
document.getElementById("camClose").onclick = closeCamera;
document.getElementById("camDone").onclick = closeCamera;
for (const el of document.querySelectorAll(".open-camera")) el.addEventListener("click", openCamera);
// 一覧が空のときのボタン
document.getElementById("addMore").onclick = () => document.querySelector(".file-picker:not([capture])").click();
list.addEventListener("click", e => {
  if (e.target.closest(".drop-pick")) document.querySelector(".file-picker:not([capture])").click();
  else if (e.target.closest(".drop-camera")) openCamera();
});
// Web版は撮影ボタンを出さない（スマホのブラウザでも「ファイルを選ぶ」からカメラで撮れる）
document.body.classList.toggle("web", !NATIVE);
// 標準カメラで撮った後はカメラ画面を閉じて一覧へ
document.querySelector("#camMsg .file-picker").addEventListener("change", closeCamera);

// 前回「読み取り中」のまま閉じた行は残さない
rows = rows.filter(r => r.status !== "reading");
// 会社機能より前に取り込んだ仕訳は、仮の会社にまとめる
if (rows.some(r => !r.companyId)) {
  if (!companies.length) companies.push({ id: uid(), name: "会社1" });
  const fallback = currentCompany()?.id || companies[0].id;
  rows.forEach(r => { r.companyId ||= fallback; });
  save();
}
if (!currentCompany()) currentCompanyId = companies[0]?.id || null;
saveCompanies();
rows.forEach(r => {
  if (r.status === "done" && !r.review) r.review = "pending";
  if (/^(日付|金額|店名)(・(日付|金額|店名))*を読み取れませんでした$/.test(r.note || "")) r.note = "";
});
save();
pruneImages();
// 開いたときも、選んでいる会社の種類の取り込み画面にする
if (currentCompany()) { settings.method = currentCompany().method || "receipt"; renderMethod(); }
render();
renderMasterCodes();
showView("import");
</script>
