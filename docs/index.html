<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>仕訳の神様</title>
<meta name="theme-color" content="#0d1629">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="仕訳の神様">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* アイコンに合わせた「紺 × 金」 */
    --navy: #14213d; --navy-deep: #0d1629; --gold: #d9b45f; --gold-light: #ecd08c; --gold-deep: #8c6a22;
    --sidebar: var(--navy-deep); --sidebar-text: #a3abbd; --sidebar-active: rgba(217,180,95,.12);
    --bg: #f5f6f8; --surface: #fff; --surface-2: #f8f9fb;
    --text: #111827; --muted: #5b6272; --line: #e5e7eb; --line-strong: #d1d5db;
    --primary: var(--navy); --primary-hover: #1f3159; --primary-soft: #f4ecd8;
    --debit: #f1f3f8; --debit-text: #26375e; --credit: #faf3e6; --credit-text: #8c6a22; --date-bg: #e9f5ee; --date-text: #1f6b43;
    --ok: #127a4a; --ok-soft: #e4f5ec; --warn: #9a6200; --warn-soft: #fff4d9;
    --err: #c62a2a; --err-soft: #fdeaea; --info: #4a5568; --info-soft: #edf0f4;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(17,24,39,.04), 0 1px 3px rgba(17,24,39,.04);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
    font-family: "Noto Sans JP", -apple-system, "Hiragino Sans", sans-serif; }
  .mono { font-family: "Roboto Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  /* レイアウト */
  .app { display: grid; grid-template-columns: 224px 1fr; min-height: 100vh; }
  .sidebar { background: var(--sidebar); color: var(--sidebar-text); padding: 18px 12px; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 700; font-size: 15px; padding: 0 8px 20px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 7px; display: block; flex: none; }
  .nav-label { font-size: 11px; letter-spacing: .08em; padding: 14px 10px 6px; color: #7382a0; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; color: inherit; text-decoration: none; font-size: 13.5px; }
  .nav a.active { background: var(--sidebar-active); color: #fff; }
  .nav a.disabled { opacity: .5; pointer-events: none; }
  .nav .soon { margin-left: auto; font-size: 10px; border: 1px solid #3a4a6b; border-radius: 4px; padding: 0 5px; }
  .nav svg { width: 16px; height: 16px; flex: none; }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar { height: 56px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 28px; gap: 16px; position: sticky; top: 0; z-index: 10; }
  .crumb { color: var(--muted); font-size: 13px; }
  .crumb b { color: var(--text); font-weight: 500; }
  .topbar .mobile-brand { display: none; }
  .content { padding: 24px 28px 48px; max-width: 1440px; width: 100%; }

  .page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .page-head h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .page-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .page-head .actions { margin-left: auto; display: flex; gap: 8px; }

  /* ボタン */
  .btn { font: inherit; font-size: 13.5px; font-weight: 500; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
    border-radius: 6px; height: 36px; padding: 0 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn input { display: none; }

  /* 集計カード */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .stat-label { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .stat-value { font-size: 22px; font-weight: 500; margin-top: 4px; }
  .stat-value small { font-size: 13px; color: var(--muted); margin-left: 2px; font-family: "Noto Sans JP", sans-serif; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  /* 仕訳テーブル */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .panel-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .panel-title { font-weight: 700; font-size: 14px; }
  .panel-head .spacer { flex: 1; }
  .field { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
  .field select { font: inherit; font-size: 12.5px; color: var(--text); height: 30px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 6px; background: var(--surface); }
  .field input[type=checkbox] { accent-color: var(--primary); }
  .divider { width: 1px; height: 22px; background: var(--line); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 1060px; }
  th, td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: middle; }
  thead th { background: var(--surface-2); font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; position: sticky; top: 0; }
  thead tr.group th { font-weight: 700; text-align: center; border-bottom: 1px solid var(--line); padding: 6px; }
  thead th.debit { background: var(--debit); color: var(--debit-text); }
  thead th.credit { background: var(--credit); color: var(--credit-text); }
  thead th.date { background: var(--date-bg); color: var(--date-text); }
  thead th.num { text-align: right; }
  th.b-left, td.b-left { border-left: 1px solid var(--line); }
  tbody tr:hover td { background: #fafbfd; }
  tbody tr.is-error td, tbody tr.is-reading td { background: var(--surface-2); }
  td.rowno { color: var(--muted); font-size: 12px; text-align: center; width: 36px; }
  td textarea.summary-box { width: 100%; box-sizing: border-box; font: inherit; font-size: 13.5px; line-height: 1.4; height: 32px; min-height: 32px;
    border: 1px solid transparent; border-radius: 5px; padding: 4px 7px; background: transparent; color: var(--text); resize: none; overflow: hidden; display: block; }
  td textarea.summary-box:hover { border-color: var(--line); }
  td textarea.summary-box:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px var(--primary-soft); }
  td input { width: 100%; font: inherit; font-size: 13.5px; height: 32px; border: 1px solid transparent; border-radius: 5px; padding: 0 7px; background: transparent; color: var(--text); }
  td input:hover { border-color: var(--line); }
  td input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px var(--primary-soft); }
  /* iPhoneでは日付の文字が上に寄るので、上下の中央にそろえる */
  td input[type="date"] { -webkit-appearance: none; appearance: none; padding-top: 0; padding-bottom: 0; line-height: 30px; }
  td input[type="date"]::-webkit-date-and-time-value { margin: 0; text-align: left; }
  td input.num { text-align: right; font-family: "Roboto Mono", monospace; font-variant-numeric: tabular-nums; }
  td input.code { font-family: "Roboto Mono", monospace; }
  td input.code::placeholder { color: #c2c8d2; }
  td input.missing { border-color: #f0b4b4; background: var(--err-soft); }
  td.c-date { width: 132px; background: var(--date-bg); }
  td.c-date.unbalanced { background: var(--err-soft); }
  .balance { font-size: 11.5px; margin-top: 4px; font-weight: 600; }
  .balance.ok { color: var(--date-text); }
  .balance.ng { color: var(--err); } td.c-code { width: 68px; } td.c-amount { width: 112px; min-width: 104px; } td.c-summary { min-width: 170px; }
  td.c-amount input { padding: 0 4px; }
  td.c-blank { display: none; }
  td.c-code { min-width: 68px; } td.c-acct { width: 150px; min-width: 150px; } td.c-tax { width: 84px; min-width: 84px; } td.c-rate { width: 84px; min-width: 84px; } td.c-biz { width: 112px; min-width: 112px; }
  td select { width: 100%; font: inherit; font-size: 13px; height: 32px; border: 1px solid transparent; border-radius: 5px; padding: 0 2px; background: transparent; color: var(--text); }
  td select:hover { border-color: var(--line); }
  td select:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px var(--primary-soft); }
  .thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 5px; cursor: zoom-in; border: 1px solid var(--line); display: block; }
  .note[hidden] { display: none; }
  .note { font-size: 11.5px; color: var(--warn); margin: 2px 7px 0; display: flex; gap: 4px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.err { background: var(--err-soft); color: var(--err); }
  .badge.info { background: var(--info-soft); color: var(--info); }
  .spinner { width: 10px; height: 10px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-msg { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .status-msg.error { color: var(--err); }
  .icon-btn { border: none; background: none; color: var(--muted); cursor: pointer; width: 28px; height: 28px; border-radius: 5px; display: grid; place-items: center; }
  .icon-btn:hover { background: var(--err-soft); color: var(--err); }
  .icon-btn svg { width: 15px; height: 15px; }
  tfoot td { background: var(--surface-2); font-weight: 700; border-bottom: none; }
  tfoot td.total { text-align: right; padding-right: 15px; }

  .dropzone { margin: 16px; border: 1.5px dashed var(--line-strong); border-radius: var(--radius); padding: 44px 16px; text-align: center; color: var(--muted); }
  .dropzone svg { width: 36px; height: 36px; color: #a9b2c1; }
  .dropzone b { display: block; color: var(--text); font-size: 15px; margin: 8px 0 4px; }
  body.dragging .panel { outline: 2px solid var(--primary); outline-offset: 2px; }

  .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, .75); display: none; align-items: center; justify-content: center; z-index: 50; padding: 24px; }
  .modal.open { display: flex; }
  .modal { padding: 0; background: rgba(8, 12, 22, .92); }
  .viewer { position: absolute; inset: 0 0 72px; overflow: hidden; display: flex; align-items: center; justify-content: center; touch-action: none; cursor: zoom-in; }
  .viewer.zoomed { cursor: grab; }
  .viewer img { max-width: calc(100% - 32px); max-height: calc(100% - 32px); border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.4); transform-origin: 0 0; user-select: none; -webkit-user-drag: none; }
  .viewer-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 72px; padding-bottom: env(safe-area-inset-bottom); display: flex; align-items: center; justify-content: center; gap: 10px; }
  .viewer-btn { font: inherit; font-size: 16px; font-weight: 600; color: #fff; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: 10px; min-width: 48px; height: 44px; padding: 0 14px; cursor: pointer; }
  .viewer-close { background: var(--gold); color: var(--navy-deep); border-color: var(--gold); }

  .mobile-capture { display: none; }
  .topbar-gear { margin-left: auto; }
  .banner { background: var(--warn-soft); color: var(--warn); border: 1px solid #f1dca4; border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .company-wrap { position: relative; }
  .company-switch { font: inherit; font-size: 13.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px;
    border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--text); cursor: pointer; max-width: 260px; }
  .company-switch svg { width: 15px; height: 15px; flex: none; color: var(--primary); }
  .company-switch #companyName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .company-switch .caret { color: var(--muted); font-size: 11px; }
  .company-menu { position: absolute; top: calc(100% + 6px); left: 0; min-width: 240px; max-width: 320px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: 0 10px 30px rgba(15,23,42,.15); padding: 6px; z-index: 30; color: var(--text); }
  .company-menu[hidden], #companies[hidden] { display: none; }
  .menu-item { display: flex; align-items: center; gap: 8px; width: 100%; font: inherit; font-size: 13.5px; text-align: left; border: none; background: none;
    color: var(--text); padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .menu-item:hover { background: var(--surface-2); }
  .menu-item .check { width: 14px; color: var(--primary); font-weight: 700; }
  .menu-item .cnt { margin-left: auto; color: var(--muted); font-size: 12px; }
  .menu-sep { height: 1px; background: var(--line); margin: 6px 0; }
  .menu-item.sub { color: var(--primary); }
  .company-chip { margin-left: 10px; font-size: 13px; font-weight: 500; color: var(--primary); background: var(--primary-soft); padding: 2px 10px; border-radius: 999px; vertical-align: middle; }
  .company-chip:empty { display: none; }
  .company-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; max-height: 50vh; overflow: auto; }
  .company-item { display: flex; align-items: center; gap: 8px; }
  .company-item input { flex: 1; }
  .company-item .btn-sm { white-space: nowrap; }
  .company-item .cnt { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .company-empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .add-row { display: flex; gap: 8px; }
  .add-row input { flex: 1; }
  .row-actions { display: flex; gap: 2px; }
  .act-label { display: none; }
  /* 複合仕訳の＋・－と、完了 */
  /* ＋：ほかのボタンと同じ白い角丸に、線のアイコン（借方は紺、貸方は茶） */
  .btn.add-line { width: 30px; min-width: 30px; height: 30px; padding: 0; justify-content: center; border-radius: 7px; }
  .btn.add-line svg { width: 15px; height: 15px; flex: none; }
  .add-line.debit { color: var(--debit-text); }
  .add-line.credit { color: var(--credit-text); }
  .act-spacer { flex: 1; }
  .add-wrap { display: flex; gap: 6px; margin-top: 8px; }
  .add-wrap.credit { justify-content: flex-end; }
  td.c-add { display: none; }
  .v-no { display: none; }
  .v-actions { align-items: center; gap: 6px; flex-wrap: wrap; }
  /* －：塊の右上の、項目名と同じ行に置く（枠にも入力欄にもかからない） */
  td.has-minus { position: relative; }
  /* ＋と同じ大きさ（30px） */
  .line-del { position: absolute; top: 2px; right: 2px; width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--surface);
    color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; z-index: 1; }
  .line-del svg { width: 15px; height: 15px; }
  .line-del:hover, .line-del:active { color: var(--err); border-color: #f0c4c4; background: var(--err-soft); }
  tr.locked td.s-debit, tr.locked td.s-credit, tr.locked td.c-date { opacity: .7; }
  td input:disabled, td select:disabled, td textarea:disabled { color: var(--text); -webkit-text-fill-color: var(--text); opacity: 1; }
  .tabs { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .tab { font: inherit; font-size: 13px; font-weight: 500; border: none; background: none; color: var(--muted); padding: 5px 12px; border-radius: 6px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(15,23,42,.1); }
  .tab .nb { display: inline-block; }
  #masterTabs .tab { flex: 1; flex-wrap: wrap; justify-content: center; gap: 0; line-height: 1.3; }
  .tab-cnt { font-size: 11.5px; background: var(--info-soft); color: var(--info); border-radius: 999px; padding: 0 7px; min-width: 20px; text-align: center; }
  .tab.active .tab-cnt { background: var(--primary-soft); color: var(--primary); }
  .no-img { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 5px; border: 1px dashed var(--line-strong); color: var(--muted); font-size: 10px; }
  .no-img-lg { color: #c9d1dc; font-size: 13px; padding: 28px 0; }
  .badge.plain { background: var(--info-soft); color: var(--info); }
  .btn-ok { background: var(--ok); border-color: var(--ok); color: #fff; height: 30px; padding: 0 12px; }
  .btn-ok:hover { background: #0e6a3f; }
  .btn-sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
  tbody tr.leaving td { opacity: 0; transition: opacity .18s; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 80; background: #1b2433; color: #fff; border-radius: 10px;
    padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.25); font-size: 13.5px; white-space: nowrap; }
  .toast[hidden] { display: none; }
  .toast-close { font: inherit; color: #aeb8cc; background: none; border: none; cursor: pointer; padding: 4px; }
  .toast-undo { font: inherit; font-weight: 700; color: #8fb4ff; background: none; border: none; cursor: pointer; padding: 4px 6px; }

  .review { background: var(--surface); }
  .review-top { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 8px; }
  .review-pos { color: var(--muted); font-size: 13px; }
  .review-img { background: #20262f; display: flex; justify-content: center; }
  .review-img img { max-width: 100%; max-height: 46vh; object-fit: contain; display: block; cursor: zoom-in; }
  .review-body { padding: 12px 14px 4px; display: flex; flex-direction: column; gap: 10px; }
  .rv-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .rv-field { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--muted); min-width: 0; }
  .rv-field input { font: inherit; font-size: 16px; color: var(--text); height: 42px; border: 1px solid var(--line-strong); border-radius: 7px; padding: 0 10px; background: #fff; width: 100%; }
  /* iPhone(Safari) の日付欄は独自の高さ・最小幅を持つため、ほかの欄とそろえる */
  input[type="date"] { -webkit-appearance: none; appearance: none; min-width: 0; display: block; line-height: normal; }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
  input[type="date"]::-webkit-datetime-edit { padding: 0; }
  .rv-field input, td input { box-sizing: border-box; min-height: 0; line-height: normal; }
  .rv-field input.num { text-align: right; font-family: "Roboto Mono", monospace; }
  .rv-field input.missing { border-color: #f0b4b4; background: var(--err-soft); }
  .rv-note { margin: 0; }
  .rv-error { padding: 8px 0; flex-wrap: wrap; }
  .rv-more summary { font-size: 13px; color: var(--muted); cursor: pointer; padding: 4px 0; }
  .rv-more .rv-grid { margin: 8px 0 10px; }
  .review-actions { display: flex; gap: 8px; padding: 12px 14px 16px; }
  .review-actions .btn { height: 46px; justify-content: center; }
  .review-actions .btn-big { flex: 1; font-size: 16px; height: 46px; }
  .review-reading { display: flex; align-items: center; gap: 8px; color: var(--info); background: var(--info-soft); font-size: 13px; padding: 8px 14px; }
  .methods { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; }
  .method { font: inherit; font-size: 13.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  .method.active { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
  .method-no { font-weight: 700; }
  .soon-tag { font-size: 10.5px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; }
  .trial-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .trial-bar[hidden] { display: none; }

<script src="vendor/encoding.min.js"></script>
<script type="module">
// お客さんのデータ（画像・試算表・マスタ・仕訳）は、この端末の外へ送らない。読み取りも端末の中だけで行う
// 以前の版で保存されたかもしれない外部AI用のAPIキーは消しておく
try { localStorage.removeItem("shiwake-api-key"); } catch {}
const STORAGE_KEY = "receipt-rows-v1";
const COMPANIES_KEY = "shiwake-companies";
const CURRENT_COMPANY_KEY = "shiwake-current-company";
const SETTINGS_KEY = "receipt-settings-v1";
const MAX_PARALLEL_OCR = 1; // 端末内OCRはスマホの負荷が高いので1枚ずつ
// ---- 取り込めるファイルの形式（取り込むもの × Web版／iPhoneアプリ） ----
// 画面の表示と「ファイルを選ぶ」で選べる種類は、すべてここから作る。
// Web版の文字読み取りは精度が低いので、写真・PDFは読まない（iPhoneアプリで読む）。Web版で読めるのは試算表のExcel・CSVだけ
const FILE_TYPES = {
  写真: "image/*",
  PDF: "application/pdf,.pdf",
  Excel: ".xlsx,.xlsm,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel",
  CSV: ".csv,text/csv",
};
const IMPORT_FORMATS = {
  receipt: { name: "出金領収書", web: [], app: ["写真", "PDF"] },
  format2: { name: "日計表", web: [], app: ["写真", "PDF"] },
  format3: { name: "試算表", web: ["Excel", "CSV"], app: ["Excel", "CSV", "PDF", "写真"] },
};
function importFormat(method) {
  const f = IMPORT_FORMATS[method || settings.method || "receipt"] || IMPORT_FORMATS.receipt;
  return { ...f, types: NATIVE ? f.app : f.web };
}

/** 1行 = 1仕訳。thumb は一覧用の小さい画像（localStorage）、大きい画像は IndexedDB に保存 */
let rows = load(STORAGE_KEY, []);
const fullImages = new Map(); // groupId -> dataURL（読み込み済みの大きい画像のキャッシュ）
// 読み取り専用の、さらに大きい画像（小さい文字をつぶさないため）。読み取りが終わったら捨てる
const ocrImages = new Map();
const OCR_MAX_SIDE = 3000;

// 大きい画像の保存場所（localStorage は容量が小さいため IndexedDB を使う）
const imageStore = (() => {
  let dbPromise = null;
  const open = () => dbPromise ||= new Promise((resolve, reject) => {
    const req = indexedDB.open("shiwake-images", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("images");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction("images", mode);
      const req = fn(tx.objectStore("images"));
      tx.oncomplete = () => resolve(req.result);
      tx.onerror = () => reject(tx.error);
    });
  };
  return {
    get: key => run("readonly", st => st.get(key)),
    put: (key, value) => run("readwrite", st => st.put(value, key)),
    del: key => run("readwrite", st => st.delete(key)),
    keys: () => run("readonly", st => st.getAllKeys()),
  };
})();
async function getFullImage(groupId) {
  if (fullImages.has(groupId)) return fullImages.get(groupId);
  try {
    const src = await imageStore.get(groupId);
    if (src) fullImages.set(groupId, src);
    return src || null;
  } catch { return null; }
}
// どの仕訳からも使われなくなった画像を消す
async function pruneImages() {
  try {
    const used = new Set(rows.map(r => r.groupId));
    for (const key of await imageStore.keys()) if (!used.has(key)) await imageStore.del(key);
    for (const key of fullImages.keys()) if (!used.has(key)) fullImages.delete(key);
    for (const key of ocrImages.keys()) if (!used.has(key)) ocrImages.delete(key);
  } catch {}
}
let queue = [];
let running = 0;

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(rows.filter(r => r.status !== "reading"))); } catch {}
}
// ---- 会社 ----
let companies = load(COMPANIES_KEY, []);
// 以前は会計ソフトが未設定だとPCA会計として扱っていたので、試算表の会社はPCA会計を選んだことにする
for (const c of companies) if (c.method === "format3" && c.system === undefined) c.system = "pca";
let currentCompanyId = load(CURRENT_COMPANY_KEY, null);
function saveCompanies() {
  try {
    localStorage.setItem(COMPANIES_KEY, JSON.stringify(companies));
    localStorage.setItem(CURRENT_COMPANY_KEY, JSON.stringify(currentCompanyId));
  } catch {}
}
const currentCompany = () => companies.find(c => c.id === currentCompanyId) || null;
// 取り込み方法（①レシート ②③…）ごとに一覧を分けて管理する
const currentSource = () => settings.method || "receipt";
const companyRows = () => rows.filter(r => r.companyId === currentCompanyId && (r.source || "receipt") === currentSource());
const countFor = id => rows.filter(r => r.companyId === id && r.status === "done").length;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// ---- 設定 ----
const settings = Object.assign({ dateFormat: "slash", encoding: "sjis", includeHeader: true }, load(SETTINGS_KEY, {}));
for (const key of ["dateFormat", "encoding"]) {
  const el = document.getElementById(key);
  el.value = settings[key];
  el.onchange = () => { settings[key] = el.value; saveSettings(); };
}
const headerBox = document.getElementById("includeHeader");
headerBox.checked = settings.includeHeader;
headerBox.onchange = () => { settings.includeHeader = headerBox.checked; saveSettings(); };
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {} }

// ---- 画像の取り込み ----
for (const input of document.querySelectorAll(".file-picker, .file-camera")) {
  input.onchange = e => { addFiles(e.target.files); e.target.value = ""; };
}
// PC はドラッグ＆ドロップでも取り込める
let dragDepth = 0;
addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
  addFiles([...e.dataTransfer.files].filter(f => f.type.startsWith("image/")));
});

async function addFiles(fileList) {
  const files = Array.from(fileList);
  if (!files.length) return;
  if (settings.method === TRIAL_SOURCE) return importTrial(files);
  if (settings.method === NIKKEI_SOURCE) return importNikkei(files);
  if ((settings.method || "receipt") !== "receipt" || (settings.docType || "receipt") !== "receipt") {
    alert("この取り込み方法は準備中です。");
    return;
  }
  if (!currentCompany()) {
    alert("先に会社を登録・選択してください。");
    openCompanies();
    return;
  }
  // PDFは1ページずつ画像にして、1ページを1枚の領収書として読む
  const images = [];
  for (const file of files) {
    if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) {
      try { for (const page of await pdfToImages(file)) images.push(Object.assign(await dataUrlToBlob(page), { name: file.name })); }
      catch (err) { alert(`${file.name}: PDFを開けませんでした`); }
    } else images.push(file);
  }
  for (const file of images) {
    const groupId = uid();
    try {
      const [full, thumb, forOcr] = await Promise.all([
        resize(file, 1600, 0.85),
        resize(file, 240, 0.7),
        // iPhoneアプリの文字認識は大きい画像のほうが正確（Web版の文字認識は重くなるので保存用と同じ大きさ）
        NATIVE ? resize(file, OCR_MAX_SIDE, 0.9) : null,
      ]);
      fullImages.set(groupId, full);
      if (forOcr) ocrImages.set(groupId, forOcr);
      imageStore.put(groupId, full).catch(() => {});
      rows.push({ id: uid(), groupId, companyId: currentCompanyId, source: "receipt", thumb, status: "reading" });
      queue.push(groupId);
    } catch (err) {
      alert(`${file.name}: ${err.message}`);
    }
  }
  render();
  pump();
}

function resize(file, maxSide, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => reject(new Error("画像を開けませんでした"));
    img.src = URL.createObjectURL(file);
  });
}

function pump() {
  const limit = MAX_PARALLEL_OCR;
  while (running < limit && queue.length) {
    const groupId = queue.shift();
    running++;
    readGroup(groupId).finally(() => { running--; pump(); });
  }
}

async function readGroup(groupId) {
  const placeholder = rows.find(r => r.groupId === groupId && r.status === "reading");
  try {
    const image = ocrImages.get(groupId) || await getFullImage(groupId);
    if (!image) throw new Error("画像が見つかりません。もう一度撮影してください");
    const data = { receipts: await readReceiptFree(image) };

    const idx = rows.indexOf(placeholder);
    if (idx < 0) return; // 読み取り中に削除された
    const receipts = data.receipts.length ? data.receipts
      : [{ date: "", amount: 0, summary: "", note: "レシートを検出できませんでした" }];
    const rc = receiptSettingsOf(placeholder.companyId);
    const newRows = receipts.flatMap(r => {
      // 8%と10%の品物が混ざっていれば、諸口を使った複合仕訳にする
      //   借方 科目（8%の対象額） ／ 貸方 諸口
      //   借方 科目（10%の対象額）／ 貸方 諸口
      //   借方 諸口（合計）       ／ 貸方 現金など
      // 対象額が読めなかった時も3行に分け、8%と10%の金額は空にしておく（手で入れる）
      // 金額はすべて税込。8%と10%の合計が、領収書の合計と必ず一致するようにする
      const hint = receiptTaxHint(r.ocrText);
      if (!hint.mixed) return [r];
      const sp = splitByRate(r.ocrText);
      let total = Number(r.amount) || 0, r8 = "", r10 = "", off = "";
      if (sp && !total) { r8 = sp.r8; r10 = sp.r10; total = r8 + r10; }
      else if (sp && sp.r8 + sp.r10 === total) { r8 = sp.r8; r10 = sp.r10; }
      else if (sp && Math.abs(Math.round(sp.r8 * 1.08) + Math.round(sp.r10 * 1.1) - total) <= 2) { r8 = Math.round(sp.r8 * 1.08); r10 = total - r8; } // 税抜で書かれていた
      else if (sp && sp.r8 < total) { r8 = sp.r8; r10 = total - r8; off = "8%と10%の金額を確かめてください"; }
      else off = "8%の金額を入れてください（10%は合計との差で入ります）";
      return [
        { ...r, amount: r8, reduced: true, split: true, splitRole: "r8", creditShokuchi: true, note: [r.note, off].filter(Boolean).join("／") },
        { ...r, amount: r10, reduced: false, split: true, splitRole: "r10", creditShokuchi: true },
        { ...r, amount: total || "", split: true, splitRole: "total", debitShokuchi: true },
      ];
    }).map(r => ({
      id: uid(), groupId, companyId: placeholder.companyId, source: placeholder.source || "receipt", thumb: placeholder.thumb, status: "done", review: "pending",
      store: r.store || "",
      date: r.date || "",
      debitCode: r.debitShokuchi ? shokuchiOf(placeholder.companyId) : receiptDebitCode(placeholder.companyId, r.store, r.summary || r.store), debitSub: "", debitAmount: r.amount || "",
      summary: r.summary || r.store || "",
      creditCode: r.creditShokuchi ? shokuchiOf(placeholder.companyId) : payCodeOf(placeholder.companyId, r.ocrText, rc), creditSub: "", creditAmount: r.amount || "",
      note: [r.note, receiptTaxHint(r.ocrText).mixed && !r.split ? "8%と10%の品物が混ざっています" : "", receiptTaxHint(r.ocrText).noInvoice && !r.debitShokuchi ? "登録番号（T＋13桁）が見つかりません" : "",
        (!r.splitRole || r.splitRole === "r8") && paidByCard(r.ocrText) ? "クレジット払い（貸方は未払金）" : ""].filter(Boolean).join("／"),
      ocrText: r.ocrText || "",
      ...(r.splitRole ? { splitRole: r.splitRole } : {}),
      taxHint: r.reduced === undefined ? receiptTaxHint(r.ocrText) : { ...receiptTaxHint(r.ocrText), reduced: r.reduced, split: true },
    }));
    newRows.forEach(setAutoTaxBoth);
    rows.splice(idx, 1, ...newRows);
    ocrImages.delete(groupId);
  } catch (err) {
    if (placeholder) Object.assign(placeholder, { status: "error", error: err.message });
  }
  save();
  render();
}

// ---- 無料モード：端末内OCR（Tesseract.js）＋ルールで項目を抜き出す ----
let ocrWorkerPromise = null;
function getOcrWorker() {
  if (!ocrWorkerPromise) {
    const banner = document.getElementById("ocrBanner");
    banner.textContent = "文字認識の準備をしています（初回のみ数MBのデータを読み込みます）…";
    banner.hidden = false;
    // ブラウザ内の文字読み取りの部品は、使うときだけ読み込む（今はWeb版で読み取りをしないので、ふだんは読み込まない）
    ocrWorkerPromise = (window.Tesseract ? Promise.resolve() : loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js"))
      .then(() => Tesseract.createWorker("jpn"))
      .then(async worker => {
        await worker.setParameters({ tessedit_pageseg_mode: "6", preserve_interword_spaces: "1" });
        return worker;
      })
      .catch(err => { ocrWorkerPromise = null; throw new Error("文字認識の準備に失敗しました。電波の良い場所で再読み取りしてください"); })
      .finally(() => { banner.hidden = true; });
  }
  return ocrWorkerPromise;
}

// OCR向けに白黒化・コントラスト強調した画像を作る
function preprocessForOcr(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(2, 1800 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const px = ctx.getImageData(0, 0, c.width, c.height);
      const d = px.data;
      // 明るさの分布の両端を切ってコントラストを広げる（感熱紙の薄い文字対策）
      const hist = new Uint32Array(256);
      const gray = new Uint8ClampedArray(d.length / 4);
      for (let i = 0, j = 0; i < d.length; i += 4, j++) {
        gray[j] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        hist[gray[j]]++;
      }
      const total = gray.length;
      let lo = 0, hi = 255, acc = 0;
      while (lo < 255 && (acc += hist[lo]) < total * 0.02) lo++;
      acc = 0;
      while (hi > 0 && (acc += hist[hi]) < total * 0.02) hi--;
      const range = Math.max(1, hi - lo);
      for (let i = 0, j = 0; i < d.length; i += 4, j++) {
        const v = ((gray[j] - lo) * 255) / range;
        d[i] = d[i + 1] = d[i + 2] = v;
      }
      ctx.putImageData(px, 0, 0);
      resolve(c);
    };
    img.onerror = () => reject(new Error("画像を開けませんでした"));
    img.src = dataUrl;
  });
}

// 全角英数字→半角、日本語の文字間に入る余計な空白を除去
function normalizeText(text) {
  return text
    .replace(/[０-９Ａ-Ｚａ-ｚ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/[，]/g, ",").replace(/[．]/g, ".").replace(/[／]/g, "/").replace(/[：]/g, ":")
    .replace(/[¥￥]/g, "¥")
    .replace(/([^\x00-\x7F])[ \t]+(?=[^\x00-\x7F])/g, "$1")
    .replace(/(\d)[ \t]+(?=[\d,])/g, "$1")
    .replace(/,[ \t]+(?=\d)/g, ",")
    // 「5.,500」「5 ,500」「5、500」のように崩れた桁区切りを「5,500」に直す
    .replace(/(\d)[ \t]*[,.、]{1,2}[ \t]*(?=\d{3}(?!\d))/g, "$1,");
}

function validDate(y, m, d) {
  const dt = new Date(y, m - 1, d);
  return y >= 2000 && y <= 2100 && dt.getMonth() === m - 1 && dt.getDate() === d;
}
const pad = n => String(n).padStart(2, "0");

function extractDate(text) {
  // 日付と時刻の間の空白が読み取りで消えて「26/09/2609:00:47」のようにくっつくことがあるので、時刻の前に空白を入れる
  text = text.replace(/(\d)(\d{1,2}:\d{2}(?::\d{2})?)/g, "$1 $2");
  const candidates = [];
  const push = (y, m, d) => { if (validDate(y, m, d)) candidates.push(`${y}-${pad(m)}-${pad(d)}`); };
  for (const m of text.matchAll(/(20\d{2})\s*[年/.\-]\s*(\d{1,2})\s*[月/.\-]\s*(\d{1,2})/g)) push(+m[1], +m[2], +m[3]);
  for (const m of text.matchAll(/(?:令和|R)\s*(\d{1,2}|元)\s*[年/.\-]\s*(\d{1,2})\s*[月/.\-]\s*(\d{1,2})/g))
    push(2018 + (m[1] === "元" ? 1 : +m[1]), +m[2], +m[3]);
  if (!candidates.length) {
    for (const m of text.matchAll(/(?<!\d)(\d{2})[/.](\d{1,2})[/.](\d{1,2})(?!\d)/g)) push(2000 + +m[1], +m[2], +m[3]);
  }
  const today = new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Tokyo" });
  return candidates.find(c => c <= today) || candidates[0] || "";
}

function amountsIn(line) {
  // 「1,280」「¥1280」「1.280」（OCRでカンマが点になる場合）などを拾う
  return [...line.matchAll(/¥?\s*(\d{1,3}(?:[,.]\d{3})+|\d{1,7})(?![\d%])/g)]
    .map(m => Number(m[1].replace(/[,.]/g, "")))
    .filter(n => n > 0 && n < 10000000);
}

function extractAmount(lines) {
  const exclude = /小計|お?預|釣|つり|税率|対象|内税|外税|消費税|点数|ポイント|電話|TEL|No\.|番号/i;
  const priorities = [/合\s*計|総\s*額|ご?請求/, /お買上|お買い上げ|領収金額|お支払|支払金額|金\s*額|^金\s*[¥\d]|円也/, /(?<!小)計/];
  for (const re of priorities) {
    for (let i = 0; i < lines.length; i++) {
      if (!re.test(lines[i]) || exclude.test(lines[i])) continue;
      // 金額が同じ行になければ次の行を見る
      const nums = amountsIn(lines[i].replace(/.*?(合\s*計|総\s*額|請求|お買上|お買い上げ|領収金額|お支払|支払金額|金\s*額|^金|計)/, ""));
      const found = nums.length ? nums : amountsIn(lines[i + 1] || "");
      if (found.length) return Math.max(...found);
    }
  }
  // キーワードが読めなかった場合は「¥」付きの最大の金額
  const yen = lines.filter(l => /¥/.test(l) && !/お?預|釣|つり/.test(l)).flatMap(amountsIn);
  return yen.length ? Math.max(...yen) : 0;
}

// 店名: レシート上部の行に「店名らしさ」の点数をつけて、一番高い行を選ぶ。
// 一番上はロゴ（英字や崩れた文字）のことが多いので、日本語の店名の行を優先する
function extractStore(lines, confs = []) {
  // 宛名（〜様・〜御中）、但し書き、金額・日付・住所の行は店名にしない
  const skip = /領収|レシート|売上票|伝票|控え|明細|いらっしゃ|ありがと|毎度|TEL|電話|〒|登録番号|様$|御中$|^但|上記|金額|合計|¥|\d\s*円|円也|^金\s|運転手|担当|レジ|\d{4}年|令和|\d{1,2}[/.]\d{1,2}|[都道府県].*[市区町村郡]|^[\d\s\-:/.,¥]+$/i;
  const japanese = /[\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Han}]/u;
  // 店の情報（電話・住所・登録番号）の行。店名はこの近くにあることが多い
  const storeInfo = /TEL|電話|登録番号|〒|[都道府県].*[市区町村郡]/i;
  const clean = line => line.replace(/[^\p{L}\p{N}ー・&\-\s]/gu, "").replace(/\s+/g, " ").trim()
    .replace(/(?<=[\p{Script=Katakana}\p{Script=Han}ー])[A-Za-z]$/u, "");      // 日本語の後ろに紛れた1文字の英字（読み間違い）を除く
  // 「加盟店名」「店舗名」などの見出し。店名は見出しの後ろか、次の行に書かれている
  const label = /^(加盟店名?|店舗名|店名|MERCHANT)[\s:：]*/i;

  const top = lines.slice(0, 12);
  for (let i = 0; i < top.length; i++) {
    if (!label.test(top[i])) continue;
    const rest = clean(top[i].replace(label, "").replace(/MERCHANT/i, ""));
    if (japanese.test(rest) && !skip.test(rest)) return rest.slice(0, 24);
    const next = clean(top[i + 1] || "");
    if (japanese.test(next) && !skip.test(top[i + 1])) return next.slice(0, 24);
  }
  let best = null;
  top.forEach((line, i) => {
    const t = clean(line);
    const letters = (t.match(/\p{L}/gu) || []).length;
    if (letters < 2 || skip.test(line)) return;
    let score = 0;
    if (japanese.test(t)) score += 3; else score -= 3;                 // 英字だけの行はロゴのことが多い
    if (/[^\s]店$|店舗|本店|支店|営業所/.test(t)) score += 2;
    if (/株式会社|有限会社|合同会社|㈱|\(株\)/.test(line)) score += 2;
    if (storeInfo.test(top[i - 1] || "") || storeInfo.test(top[i + 1] || "") || storeInfo.test(top[i + 2] || "")) score += 1;
    const conf = confs[i] ?? 1;
    if (conf < 0.5) score -= 2; else if (conf < 0.7) score -= 1;    // 崩れた文字（ロゴなど）は自信が低い
    const digits = (t.match(/\d/g) || []).length;
    if (digits / t.length > 0.3) score -= 2;
    if (t.length > 22) score -= 2;                                     // 長い行は店名より案内文のことが多い
    score -= i * 0.3;                                                  // 同じくらいなら上の行を優先
    if (!best || score > best.score) best = { score, i, t };
  });
  if (!best) return "";
  // 店名と支店名（〜店）が2行に分かれている場合はつなげる（例: ファミリーマート 新宿西口店）
  const isBranch = t => /^[^\s]{1,10}店$/.test(t);
  const usable = i => {
    const t = clean(top[i] || "");
    return t && japanese.test(t) && !skip.test(top[i]) && !isBranch(t);
  };
  if (isBranch(best.t) && usable(best.i - 1)) return `${clean(top[best.i - 1])} ${best.t}`.slice(0, 24);
  const next = clean(top[best.i + 1] || "");
  if (!/店$/.test(best.t) && isBranch(next) && !skip.test(top[best.i + 1])) return `${best.t} ${next}`.slice(0, 24);
  return best.t.slice(0, 24);
}

// iPhoneアプリの中で開いているときは、iPhone標準の文字認識（Vision）を使う
const NATIVE = window.Capacitor?.isNativePlatform?.() ? window.Capacitor : null;
const callNative = (method, options) => NATIVE.nativePromise("ShiwakeNative", method, options);

// 文字認識は「かたまり」ごとに位置付きで返るので、同じ高さにあるものを1行にまとめる
// （レシートの「合計」と右端の「¥1,280」を同じ行として扱うため）。
// 斜めに撮った写真にも対応するため、傾きの候補を少しずつ変えてまとめてみて、
// 行数が一番少なくなる（左右の組が一番多くそろう）傾きを採用する
function groupLines(items, width, height, theta) {
  const cos = Math.cos(theta), sin = Math.sin(theta);
  const pts = items.map(it => {
    const cx = (it.x + it.w / 2) * width, cy = (it.y + it.h / 2) * height;
    return { text: it.text, conf: it.confidence, x: cx * cos + cy * sin, y: -cx * sin + cy * cos, h: it.h * height };
  });
  const lines = [];
  for (const p of pts.sort((a, b) => a.y - b.y)) {
    const line = lines.find(l => Math.abs(l.y - p.y) < Math.min(l.h, p.h) * 0.5);
    if (line) { line.items.push(p); line.y = (line.y + p.y) / 2; line.h = Math.max(line.h, p.h); }
    else lines.push({ y: p.y, h: p.h, items: [p] });
  }
  return lines.sort((a, b) => a.y - b.y);
}

function itemsToLines(items, width = 1, height = 1) {
  // 目安の傾き: 長い行の傾きの中央値（短い文字は傾きが0で返ることが多いため除く）
  const maxW = Math.max(0, ...items.map(i => i.w));
  const angles = items.filter(i => typeof i.angle === "number" && i.w >= maxW * 0.3).map(i => i.angle).sort((a, b) => a - b);
  const guess = angles.length ? angles[Math.floor(angles.length / 2)] : 0;
  let best = null;
  for (let theta = guess - 0.1; theta <= guess + 0.1; theta += 0.004) {
    const lines = groupLines(items, width, height, theta);
    const score = [lines.length, Math.abs(theta - guess)];
    if (!best || score[0] < best.score[0] || (score[0] === best.score[0] && score[1] < best.score[1])) best = { lines, score };
  }
  // 1行の文字と、その行でいちばん低い「文字認識の自信」（0〜1）
  return (best ? best.lines : []).map(l => {
    const sorted = l.items.sort((a, b) => a.x - b.x);
    return { text: sorted.map(i => i.text).join("  "), conf: Math.min(...sorted.map(i => i.conf ?? 1)) };
  });
}

// 戻り値: 行ごとの { text, conf }（conf は文字認識の自信。分からない場合は 1）
async function recognizeText(dataUrl) {
  if (NATIVE) {
    const res = await callNative("recognizeText", { image: dataUrl.split(",")[1] });
    return itemsToLines(res.items || [], res.width, res.height);
  }
  const worker = await getOcrWorker();
  const canvas = await preprocessForOcr(dataUrl);
  const { data } = await worker.recognize(canvas);
  return (data.text || "").split(/\r?\n/).map(text => ({ text, conf: 1 }));
}

// 領収書の「但し 〇〇代として」から品目を取り出す
function extractPurpose(lines) {
  for (const line of lines) {
    const m = line.match(/^但し?\s*(.+?)(?:として)?\s*$/);
    if (m && m[1]) return m[1].trim().slice(0, 20);
  }
  return "";
}

async function readReceiptFree(dataUrl) {
  const recognized = (await recognizeText(dataUrl))
    .map(l => ({ text: normalizeText(l.text).trim(), conf: l.conf }))
    .filter(l => l.text);
  if (!recognized.length) return [];
  const lines = recognized.map(l => l.text);
  const text = lines.join("\n");
  const date = extractDate(text);
  const amount = extractAmount(lines);
  const store = extractStore(lines, recognized.map(l => l.conf));
  const purpose = extractPurpose(lines);
  const summary = [store, purpose].filter(Boolean).join(" ");
  return [{ date, amount, store, summary, ocrText: text, note: "" }];
}

const TAX_RATES = ["10%", "8%軽", "8%", "非課税", "対象外"];
const BIZ_TYPES = ["課税事業者", "免税事業者"]; // 取引の相手が、インボイスの登録をしている事業者かどうか
const FIELDS = [
  { key: "date", label: "①伝票日付", type: "date", cls: "c-date" },
  { key: "debitCode", label: "②借方科目", head: "②科目", side: "debit", code: true, cls: "c-code c-acct b-left" },
  { key: "debitSub", label: "③借方補助", head: "③補助", side: "debit", sub: true, code: true, cls: "c-code" },
  { key: "debitAmount", label: "④借方金額", head: "④金額", side: "debit", num: true, cls: "c-amount" },
  { key: "debitTax", label: "⑤借方消費税", head: "⑤消費税", side: "debit", tax: true, options: TAX_TYPES, cls: "c-tax" },
  { key: "debitRate", label: "⑥借方税率", head: "⑥税率", side: "debit", tax: true, options: TAX_RATES, cls: "c-rate" },
  { key: "debitBiz", label: "⑦借方事業者区分", head: "⑦事業者区分", side: "debit", tax: true, options: BIZ_TYPES, cls: "c-biz" },
  { key: "summary", label: "⑧借方摘要", head: "⑧摘要", side: "debit", cls: "c-summary" },
  { key: "creditCode", label: "⑨貸方科目", head: "⑨科目", side: "credit", code: true, cls: "c-code c-acct b-left" },
  { key: "creditSub", label: "⑩貸方補助", head: "⑩補助", side: "credit", sub: true, code: true, cls: "c-code" },
  { key: "creditAmount", label: "⑪貸方金額", head: "⑪金額", side: "credit", num: true, cls: "c-amount" },
  { key: "creditTax", label: "⑫貸方消費税", head: "⑫消費税", side: "credit", tax: true, options: TAX_TYPES, cls: "c-tax" },
  { key: "creditRate", label: "⑬貸方税率", head: "⑬税率", side: "credit", tax: true, options: TAX_RATES, cls: "c-rate" },
  { key: "creditBiz", label: "⑭貸方事業者区分", head: "⑭事業者区分", side: "credit", tax: true, options: BIZ_TYPES, cls: "c-biz" },
  { key: "creditSummary", label: "⑮貸方摘要", head: "⑮摘要", side: "credit", cls: "c-summary" },
];
// 借方・貸方をのぞいた項目の種類（debitCode と creditCode は どちらも Code）
const kindOf = key => key === "summary" ? "Summary" : key.replace(/^(debit|credit)/, "");
// 貸方摘要は、借方と別に入れていなければ借方摘要と同じ（単一仕訳）
const creditSummaryOf = r => r.creditSummary ?? r.summary ?? "";
// 試算表は6項目で固定（補助・消費税は使わない）
const TRIAL_KEYS = ["date", "debitCode", "debitAmount", "summary", "creditCode", "creditAmount"];
// 原始資料・日計表は、12項目のうち会社ごとに選んだ項目（選んでいなければ12項目すべて）
function fieldKeysOf(c) {
  if (!c) return FIELDS.map(f => f.key);
  if (c.method === TRIAL_SOURCE) return TRIAL_KEYS;
  if (Array.isArray(c.fields)) {
    // 後から増えた項目（貸方摘要・事業者）は、それより前の設定にも足す
    const f = [...c.fields];
    if (!c.fieldsV2 && f.includes("summary")) f.push("creditSummary");
    if (!c.fieldsV3) for (const side of ["debit", "credit"]) if (f.includes(side + "Rate")) f.push(side + "Biz");
    return f;
  }
  // 以前の「補助コードを使う」「免税事業者」の設定から引き継ぐ
  if ("useSub" in c || "taxExempt" in c) return FIELDS.filter(f => (!f.sub || c.useSub) && (!f.tax || !c.taxExempt)).map(f => f.key);
  return FIELDS.map(f => f.key);
}
// 確認画面とCSVに出す項目（どちらも同じ）
// 番号は、画面に出す順（＝CSVの列の順）に①から振り直す
function visibleFields() {
  const keys = currentSource() === TRIAL_SOURCE ? TRIAL_KEYS : fieldKeysOf(currentCompany());
  const num = i => String.fromCharCode(0x2460 + i), plain = t => t.replace(/^[\u2460-\u2473]/, "");
  // 試算表は片側だけの仕訳なので、摘要は1つ（借方と貸方の間）
  const trialSummary = { key: "summary", label: "摘要", cls: "c-summary b-left" };
  return FIELDS.filter(f => keys.includes(f.key)).map(f => currentSource() === TRIAL_SOURCE && f.key === "summary" ? trialSummary : f)
    .map((f, i) => ({ ...f, label: num(i) + plain(f.label), head: f.head && num(i) + plain(f.head) }));
}

// ---- 消費税の自動判定 ----
// 科目名・摘要から「課税／非課税／対象外」を決め、課税なら領収書の内容から税率を決める
const TAX_WORDS = {
  非課税: ["利息", "保険料", "割引料", "土地", "有価証券", "切手", "はがき", "ハガキ", "印紙", "レターパック", "商品券", "プリペイド", "住宅家賃"],
  対象外: ["現金", "預金", "売掛", "買掛", "未払", "未収", "前払", "前受", "仮払", "仮受", "預り", "立替", "貸付", "借入", "手形", "給料", "給与", "賃金", "賞与",
    "役員報酬", "法定福利", "租税公課", "寄付", "減価償却", "引当", "諸口", "事業主", "元入", "資本", "剰余", "繰越", "源泉", "法人税", "住民税", "事業税",
    "貸倒", "配当", "出資", "保証金", "敷金", "差入", "香典", "祝儀", "御祝", "お祝", "見舞", "罰金", "反則金"],
};
function autoTaxType(code, summary, cid) {
  if (!code) return "";
  if (String(code) === shokuchiOf(cid)) return "対象外"; // 諸口
  const name = masterName(code, cid), text = String(summary || "");
  if (TAX_WORDS.対象外.some(w => name.includes(w))) return "対象外"; // 現金・預金・給料など
  for (const type of ["非課税", "対象外"]) if (TAX_WORDS[type].some(w => text.includes(w))) return type; // 摘要（切手・香典など）
  if (TAX_WORDS.非課税.some(w => name.includes(w))) return "非課税";
  return name ? "課税" : ""; // マスタにないコードは判定しない
}
// 領収書の文字から、軽減税率（8%）と、インボイスの登録番号（T＋13桁）があるかを調べる
// 出金領収書の貸方（全社共通）：ふだんは現金、クレジット払いの領収書は未払金
// 科目はその会社のミロク科目マスタから名前で探す。見つからなければ、自動入力ルールの「いつも使う貸方の科目」
function paidByCard(text) {
  return String(text || "").split("\n").some(line => {
    const t = line.replace(/[\s　]/g, "").toUpperCase().replace(/ポイントカード|POINTCARD|カード会員|会員カード/g, "");
    return /クレジット|VISA|MASTERCARD|JCB|AMEX|AMERICANEXPRESS|DINERS|CREDIT/.test(t) || (/カード/.test(t) && /支払|払|預|決済|売上/.test(t));
  });
}
function payCodeOf(cid, text, rc) {
  const byName = (...names) => masterOf(cid).find(m => names.some(n => normName(m.name) === normName(n)))?.code;
  // 自動入力ルールで決めた科目があればそれを使い、なければマスタの「現金」「未払金」
  return paidByCard(text) ? rc.cardCode || byName("未払金", "未払い金") || "" : rc.fixedCode || byName("現金") || "";
}
// 諸口のコード（その会社のミロク科目マスタの「諸口」。なければミロクで基本の 3999）
const shokuchiOf = (cid = currentCompanyId) => masterOf(cid).find(m => normName(m.name) === "諸口")?.code || "3999";
// 8%と10%が混ざった領収書の、それぞれの対象額（「8%対象 ¥1,080」のような行から読む）。読めなければ null
// 税率ごとの対象額（「8%対象 ¥1,080」「(内 10%対象 ¥1,190)」のような行から読む）: { "8": 金額, "10": 金額 }
function rateAmounts(text) {
  const lines = String(text || "").split("\n").map(l => l.replace(/[\s　]/g, "").replace(/％/g, "%").replace(/[￥\\]/g, "¥"));
  const got = {};
  const amountIn = t => {
    const after = t.includes("対象") ? t.slice(t.indexOf("対象")) : t;
    const m = after.replace(/(10|8)%/g, "").match(/\d{1,3}(?:,\d{3})+|\d{2,}/);
    return m ? Number(m[0].replace(/,/g, "")) : 0;
  };
  lines.forEach((t, i) => {
    if (/※|印/.test(t) || !/対象|合計|計|税抜|税込/.test(t)) return; // 「※印は軽減税率対象」のような説明の行は使わない
    const rate = /10%/.test(t) ? "10" : /8%|軽減/.test(t) ? "8" : "";
    if (!rate || got[rate]) return;
    const amount = amountIn(t) || (lines[i + 1] && !/%/.test(lines[i + 1]) ? amountIn(lines[i + 1]) : 0); // 金額が次の行に分かれていることもある
    if (amount) got[rate] = amount;
  });
  return got;
}
function splitByRate(text) {
  const got = rateAmounts(text);
  return got["8"] > 0 && got["10"] > 0 ? { r8: got["8"], r10: got["10"] } : null;
}
function receiptTaxHint(text) {
  const t = String(text || "").replace(/[\s　]/g, "");
  // 8%・10%の対象額の行があれば、それで決める（「※印は軽減税率(8%)適用商品」のような説明があっても、8%の品物がなければ10%だけ）
  const got = rateAmounts(text);
  const known = got["8"] > 0 || got["10"] > 0;
  // 対象額の行がなければ、説明の行（※印〜）を除いた文字で決める
  const body = String(text || "").split("\n").filter(l => !/※|印は/.test(l)).join("").replace(/[\s　]/g, "");
  const has8 = known ? got["8"] > 0 : /軽減|8[%％]|8パーセント/.test(body), has10 = known ? got["10"] > 0 : /10[%％]/.test(body);
  const invoice = /T[-ー]?\d{13}|登録番号|適格請求書/.test(t);
  return { reduced: has8 && !has10, mixed: has8 && has10, noInvoice: t.length > 20 && !invoice };
}
// 行の借方・貸方の消費税を自動で入れる（手で選び直した側はそのまま）
function setAutoTax(row, side) {
  if (row.source === TRIAL_SOURCE) return;
  const c = companies.find(x => x.id === row.companyId);
  if (!c || row.taxManual?.[side]) return;
  const h = row.taxHint || {};
  const type = autoTaxType(row[side + "Code"], side === "credit" ? creditSummaryOf(row) : row.summary, row.companyId)
    || (side === "debit" && h.split ? "課税" : ""); // 8%と10%に分けた行は、科目がまだ空でも課税
  row[side + "Tax"] = type;
  row[side + "Rate"] = type !== "課税" ? type : h.reduced ? "8%軽" : "10%";
  // 事業者区分は取引の相手で決まる（品物が対象外・非課税でも、相手は課税事業者のことがある）
  row[side + "Biz"] = side === "debit" && h.noInvoice ? "免税事業者" : "課税事業者";
}
// 以前は税率の中に「免税事業者」があったので、事業者の項目に移す
function moveBiz(r) {
  for (const side of ["debit", "credit"]) {
    if (r[side + "Biz"] !== undefined) continue;
    const exempt = r[side + "Rate"] === "免税事業者";
    if (exempt) { r[side + "Rate"] = r.taxHint?.reduced ? "8%軽" : "10%"; r[side + "Tax"] = "課税"; }
    r[side + "Biz"] = exempt ? "免税事業者" : "課税事業者";
  }
}
const setAutoTaxBoth = row => { setAutoTax(row, "debit"); setAutoTax(row, "credit"); };

const isMissing = (key, v) => (key === "date" && !v) || ((key === "debitAmount" || key === "creditAmount") && !Number(v));
// 入力欄の赤い印。試算表の行は片側（借方か貸方）だけを使うので、使っている側だけを確認する
function fieldMissing(row, key, v) {
  if (row.source !== TRIAL_SOURCE) return isMissing(key, v);
  const side = Number(row.debitAmount) ? "debit" : Number(row.creditAmount) ? "credit" : "";
  if (key === "date") return !v;
  if (key === "debitAmount" || key === "creditAmount") return !side;
  if (key === "debitCode") return side === "debit" && !v;
  if (key === "creditCode") return side === "credit" && !v;
  return false;
}
// 注意書きは今の入力内容から毎回判定する（入力すれば消える）
function warningsOf(r) {
  if (r.status !== "done") return [];
  if (r.source === TRIAL_SOURCE) {
    const w = [];
    const code = Number(r.debitAmount) ? r.debitCode : r.creditCode;
    if (!r.date) w.push("日付が空です");
    if (!code) w.push("ミロクのコードが未設定です");
    else if (masterOf(r.companyId).length && !masterOf(r.companyId).some(m => m.code === String(code))) w.push("マスタにないコードです");
    if (r.codeHow === "推測" && code) w.push("科目名から推測したコードです");
    if (r.note) w.push(r.note);
    return w;
  }
  const w = [];
  if (!r.date) w.push("日付が空です");
  const ln = lineOf(r), codes = ln === "d" ? [r.debitCode] : ln === "c" ? [r.creditCode] : [r.debitCode, r.creditCode];
  if (r.source === NIKKEI_SOURCE) {
    if (codes.some(c => !c)) w.push("コードが未設定です");
    for (const c of codes) if (c && masterOf(r.companyId).length && !masterOf(r.companyId).some(m => m.code === String(c))) { w.push("マスタにないコードです"); break; }
    if (r.codeHow === "推測") w.push("科目名から推測したコードです");
  }
  if (!Number(ln === "c" ? r.creditAmount : r.debitAmount)) w.push("金額が空です");
  if (!String(ln === "c" ? creditSummaryOf(r) : r.summary || "").trim()) w.push("摘要が空です");
  if (r.note) w.push(r.note);
  return w;
}
// レシート単位の借方・貸方の一致（試算表は画面の上の合計で見る）
//   ふつうの仕訳：その行の借方金額と貸方金額
//   8%と10%に分けた仕訳：2行の借方の合計と、領収書の合計（貸方の現金など）
function balanceOf(r) {
  if (r.source === TRIAL_SOURCE) return { ok: true };
  const vr = voucherRows(r);
  const d = vr.filter(o => lineOf(o) !== "c").reduce((a, o) => a + Number(o.debitAmount || 0), 0);
  const c = vr.filter(o => lineOf(o) !== "d").reduce((a, o) => a + Number(o.creditAmount || 0), 0);
  return { d, c, ok: d === c && d > 0 };
}
const balanceHtml = r => {
  const b = balanceOf(r);
  if (r.source === TRIAL_SOURCE) return "";
  return `<div class="balance ${b.ok ? "ok" : "ng"}" data-bal-for="${vidOf(r)}">${b.ok ? `✓ 一致 ${b.d.toLocaleString()}円`
    : `⚠ 借方 ${b.d.toLocaleString()} ／ 貸方 ${b.c.toLocaleString()}（差額 ${Math.abs(b.d - b.c).toLocaleString()}円）`}</div>`;
};
// 金額を直したら、そのレシートの一致の表示（伝票日付の枠の色）を更新する
function refreshBalance(row) {
  const v = vidOf(row);
  const el = list.querySelector(`[data-bal-for="${v}"]`);
  if (el) el.outerHTML = balanceHtml(row);
  const head = list.querySelector(`tr[data-vid-head="${v}"]`);
  head?.querySelector("td.c-date")?.classList.toggle("unbalanced", !balanceOf(row).ok);
  const badge = head?.querySelector(".c-status .st");
  if (badge) badge.innerHTML = statusBadge(row);
}
const noteHtml = r => {
  const w = voucherWarnings(r);
  return `<div class="note" data-note-for="${vidOf(r)}" ${w.length ? "" : "hidden"}>⚠ ${escapeHtml(w.join("／"))}</div>`;
};

// 一覧に出すのは、この会社・この取り込み方法の仕訳（CSVに出力した後も「一覧を空にする」まで残す）
function sortedRows() {
  // 撮影・読み込みをした順（並べ替えない）
  return companyRows();
}
// ---- 仕訳のまとまり（1枚の領収書など） ----
// 借方・貸方それぞれ複数の行を持てる（複合仕訳）。CSVでは相手科目を諸口にして1行ずつ書く
//   line: "d" 借方だけの行／"c" 貸方だけの行／なし（"pair"）借方と貸方が1つずつの仕訳
//   8%と10%に分けた仕訳（splitRole）は、r8・r10 が借方の行、total が貸方の行
const lineOf = r => r.line || (r.splitRole === "total" ? "c" : r.splitRole ? "d" : "pair");
const vidOf = r => r.vid || (r.splitRole ? "g:" + r.groupId : r.id);
const voucherRows = r => { const v = vidOf(r); return rows.filter(o => o.companyId === r.companyId && vidOf(o) === v); };
const voucherCount = list => new Set(list.map(vidOf)).size;
const voucherWarnings = r => [...new Set(voucherRows(r).flatMap(warningsOf))];
const shownRows = () => sortedRows();
const csvTargetRows = () => sortedRows().filter(r => r.status === "done");

function statusBadge(row) {
  if (row.status === "reading") return `<span class="badge info"><span class="spinner"></span>読取中</span>`;
  if (row.status === "error") return `<span class="badge err">エラー</span>`;
  if (row.locked) return `<span class="badge ok">完了</span>`;
  if (voucherWarnings(row).length || (row.status === "done" && !balanceOf(row).ok)) return `<span class="badge warn">要確認</span>`;
  return row.review === "exported" ? `<span class="badge ok">出力済み</span>` : "";
}

function renderStats() {
  const target = csvTargetRows();
  const dl = document.getElementById("download");
  dl.disabled = target.length === 0;
  dl.querySelector("span").textContent = `CSVダウンロード（${voucherCount(target)}件）`;
}

function inputHtml(row, f) {
  const v = f.key === "creditSummary" ? creditSummaryOf(row) : row[f.key] ?? "";
  // 摘要は横幅はそのままで2行分の高さにし、長い文は折り返して全部見えるようにする
  if (f.key === "summary" || f.key === "creditSummary")
    return `<textarea class="summary-box" rows="1" ${row.locked ? "disabled" : ""} data-id="${row.id}" data-key="${f.key}" aria-label="${f.label}">${escapeHtml(v)}</textarea>`;
  if (f.options) return `<select ${row.locked ? "disabled" : ""} data-id="${row.id}" data-key="${f.key}" aria-label="${f.label}">
    <option value="">—</option>${f.options.map(o => `<option${o === v ? " selected" : ""}>${o}</option>`).join("")}</select>`;
  const shown = f.num && v !== "" ? Number(v).toLocaleString() : v;
  const attrs = f.type === "date" ? 'type="date"' : f.num ? 'inputmode="numeric"' : "";
  const cls = [f.num ? "num" : "", f.code ? "code" : "", fieldMissing(row, f.key, v) ? "missing" : ""].join(" ");
  const list = f.key === "debitCode" || f.key === "creditCode" ? 'data-code-suggest autocomplete="off"' : "";
  return `<input ${attrs} ${list} ${row.locked ? "disabled" : ""} class="${cls}" ${f.code ? 'placeholder="—"' : ""} data-id="${row.id}" data-key="${f.key}" value="${escapeHtml(shown)}">`;
}

function render() {
  const list = document.getElementById("list");
  renderCompany();
  renderStats();

  if (!currentCompany()) {
    list.innerHTML = `<div class="dropzone"><svg><use href="#i-building"/></svg>
      <b>会社を登録してください</b>
      <button class="btn btn-primary open-companies">会社を登録する</button></div>`;
    return;
  }

  renderTrialBar();
  const items = shownRows();
  document.getElementById("addMore").hidden = !items.length;
  document.getElementById("listClear").hidden = !items.length;
  if (!items.length) {
    const fmt = importFormat(currentSource());
    const what = currentSource() === TRIAL_SOURCE && systemOf().id ? `${systemOf().name}の${fmt.name}` : fmt.name;
    const icon = currentSource() === "receipt" ? "i-receipt" : "i-list";
    list.innerHTML = `<div class="dropzone"><svg><use href="#${icon}"/></svg>
      <b>${escapeHtml(what)}${NATIVE ? "を撮影するか、ファイルを選んでください" : "のファイルを選んでください"}</b>${fmt.types.join("・")}
      <div class="drop-actions">${NATIVE ? `<button class="btn btn-primary drop-camera"><svg><use href="#i-camera"/></svg>撮影する</button>` : ""}
      <button class="btn ${NATIVE ? "" : "btn-primary"} drop-pick"><svg><use href="#i-upload"/></svg>ファイルを選ぶ</button></div></div>`;
    return;
  }

  // ＋：借方か貸方に塊を足す（それぞれの側の一番下の塊のすぐ下に出す）
  const addBtn = (side, v) => `<button class="btn btn-sm add-line ${side}" data-addline="${side}" data-vid="${escapeHtml(v)}" aria-label="${side === "debit" ? "借方" : "貸方"}を増やす" title="${side === "debit" ? "借方" : "貸方"}を増やす"><svg><use href="#i-plus"/></svg></button>`;
  // 行の右（スマホでは仕訳の下）のボタン
  //   試算表：削除だけ
  //   それ以外：完了・削除。完了した仕訳は「完了解除」だけ（＋・－は、それぞれの塊の下に出す）
  const actions = (row, v, locked) => {
    const del = `<button class="icon-btn del" data-del="${row.id}" title="削除"><svg><use href="#i-trash"/></svg><span class="act-label">削除</span></button>`;
    if (row.source === TRIAL_SOURCE || row.status !== "done") return `<td class="c-del"><div class="row-actions">${del}</div></td>`;
    const lock = `<button class="btn btn-sm lock-btn ${locked ? "" : "btn-primary"}" data-lock="${escapeHtml(v)}">${locked ? "完了解除" : "完了"}</button>`;
    return `<td class="c-del"><div class="row-actions v-actions"><span class="act-spacer"></span>${lock}${locked ? "" : del}</div></td>`;
  };
  const fields = visibleFields();
  // 消費税の項目ができる前に読み取った行にも、自動で入れる
  for (const r of items) if (r.status === "done" && r.source !== TRIAL_SOURCE) {
    if (r.debitTax === undefined && r.debitRate === undefined) setAutoTaxBoth(r); else moveBiz(r);
    // 以前は対象外・非課税のとき事業者区分を空にしていたので、一度だけ課税事業者を入れる
    if (!r.bizV2) { for (const side of ["debit", "credit"]) if (!r[side + "Biz"]) r[side + "Biz"] = "課税事業者"; r.bizV2 = true; }
  }
  // 見出しの上の段：続いている借方・貸方の項目をまとめる
  const groupHead = fields.reduce((a, f) => {
    const last = a[a.length - 1];
    if (f.side && last?.side === f.side) last.n++; else a.push({ side: f.side, n: 1, left: f.cls.includes("b-left") });
    return a;
  }, []).map(g => g.side ? `<th class="${g.side} b-left" colspan="${g.n}">${g.side === "debit" ? "借方" : "貸方"}</th>` : `<th class="${g.left ? "b-left" : ""}" colspan="${g.n}"></th>`).join("");
  // 科目コードの欄は、コードのすぐ右に科目名を出す
  const cellInput = (r, f) => {
    if (f.key !== "debitCode" && f.key !== "creditCode") return inputHtml(r, f);
    const code = String(r[f.key] || ""), name = code ? masterName(code) : "";
    return `<div class="code-box" style="--len:${code.length}">${inputHtml(r, f)}<span class="code-name ${code && !name ? "unknown" : ""}" data-code-name-for="${r.id}-${f.key}">${escapeHtml(code ? name || "マスタにない" : "")}</span></div>`;
  };
  const firstOfSide = { debit: fields.find(f => f.side === "debit"), credit: fields.find(f => f.side === "credit") };
  const lastOfSide = { debit: fields.filter(f => f.side === "debit").at(-1), credit: fields.filter(f => f.side === "credit").at(-1) };
  let body = "", no = 0;
  const totalV = voucherCount(items);
  const seen = new Set();
  for (const row0 of items) {
    // 仕訳のまとまりごとに描く（借方・貸方が複数あるときは、何行かに分けて並べる）
    const v = vidOf(row0);
    if (seen.has(v)) continue;
    seen.add(v); no++;
    const vr = items.filter(o => vidOf(o) === v), anchor = vr[0];
    const isTrial = anchor.source === TRIAL_SOURCE;
    const thumbOf = row => isTrial ? `<td class="c-thumb"><span class="trial-tag">試算表</span></td>`
      : row.thumb
      ? `<td class="c-thumb"><img class="thumb" src="${row.thumb}" data-group="${row.groupId}" alt="${row.source === NIKKEI_SOURCE ? "日計表" : "領収書"}"></td>`
      : `<td class="c-thumb"><span class="no-img">画像なし</span></td>`;
    if (anchor.status !== "done") {
      const msg = anchor.status === "reading"
        ? `<span class="status-msg">読み取っています…</span>`
        : `<span class="status-msg error">${escapeHtml(anchor.error)}<button class="btn" data-retry="${anchor.id}">再読み取り</button></span>`;
      body += `<tr class="is-${anchor.status}" data-row="${anchor.id}" data-vid-head="${escapeHtml(v)}"><td class="rowno">${no}</td><td class="c-status">${statusBadge(anchor)}</td>${thumbOf(anchor)}<td colspan="${fields.length}" class="c-msg">${msg}</td>${actions(anchor, v, false)}</tr>`;
      continue;
    }
    const compound = vr.length > 1 || lineOf(anchor) !== "pair";
    const D = compound ? vr.filter(o => lineOf(o) !== "c") : [anchor];
    const C = compound ? vr.filter(o => lineOf(o) !== "d") : [anchor];
    const k = Math.max(D.length, C.length, 1);
    const locked = vr.some(o => o.locked);
    const sideCount = { debit: D.length, credit: C.length };
    for (let i = 0; i < k; i++) {
      const first = i === 0, last = i === k - 1, dRow = D[i] || null, cRow = C[i] || null;
      const srcOf = f => !f.side ? (first ? anchor : null) : f.side === "debit" ? dRow : cRow;
      // スマホでは、仕訳の枠の一番上に「何件目 / 全部で何件」を出す（たくさん読み込んだ時に、今どこを見ているか分かるように）
      const head = `<td class="rowno">${first ? no : ""}</td><td class="c-status">${first ? `<span class="v-no">${no} / ${totalV}</span><span class="st">${statusBadge(anchor)}</span>` : ""}</td>${first ? thumbOf(anchor) : `<td class="c-thumb"></td>`}`;
      // スマホで借方と貸方の同じ項目（科目・金額・摘要など）が横に並ぶよう、片側にしかない項目の反対側に空欄を入れる（PCでは出さない）
      const cells = isTrial ? fields : [...fields.filter(f => !f.side), ...["debit", "credit"].flatMap(side =>
        [...new Set(fields.filter(f => f.side).map(f => kindOf(f.key)))].map(kd => fields.find(f => f.side === side && kindOf(f.key) === kd) || { blank: true, side }))];
      const trCls = [isTrial ? "" : "row-receipt", k > 1 && !last ? "v-mid" : "", first ? "" : "v-cont", locked ? "locked" : ""].filter(Boolean).join(" ");
      body += `<tr data-row="${(dRow || cRow || anchor).id}" ${first ? `data-vid-head="${escapeHtml(v)}"` : ""} class="${trCls}">${head}` + cells.map(f => {
        if (f.blank) return `<td class="c-blank s-${f.side}"></td>`;
        const src = srcOf(f);
        if (!src) return `<td class="${f.cls}${f.side ? ` s-${f.side}` : ""} c-none"></td>`;
        // 借方・貸方が2つ以上あるときは、それぞれの塊に「－」（その塊を消す）を出す
        // －（その塊を消す）は塊の右上（項目名の行）、＋（塊を足す）はその側の一番下の塊の下に出す（並べると押し間違えるため離す）
        const bottom = !isTrial && !locked && f.side && f === lastOfSide[f.side];
        const minus = !isTrial && !locked && f.side && f === firstOfSide[f.side] && compound && sideCount[f.side] > 1
          ? `<button class="line-del" data-linedel="${src.id}" title="この${f.side === "debit" ? "借方" : "貸方"}を消す" aria-label="この${f.side === "debit" ? "借方" : "貸方"}を消す"><svg><use href="#i-minus"/></svg></button>` : "";
        const plus = bottom && src === (f.side === "debit" ? D : C).at(-1) ? addBtn(f.side, v) : "";
        return `<td class="${f.cls}${f.side ? ` s-${f.side}` : ""}${f.key === "date" && !balanceOf(anchor).ok ? " unbalanced" : ""}${minus ? " has-minus" : ""}" data-label="${f.label}">
        ${cellInput(src, f)}${minus}
        ${plus ? `<div class="add-wrap ${f.side}">${plus}</div>` : ""}
        ${f.key === "summary" && isTrial ? `<div class="src-line">元の会計ソフト科目名: ${escapeHtml(anchor.srcName)}${anchor.srcCode ? ` [${escapeHtml(anchor.srcCode)}]` : ""}</div>` : ""}
        ${f.key === "date" ? balanceHtml(anchor) : ""}
        ${f.key === (isTrial ? "summary" : "date") ? noteHtml(anchor) : ""}
      </td>`;
      }).join("")
        // スマホでは＋を、借方・貸方の枠の外（その側の一番下の塊のすぐ下）に出す（PCでは枠の中に出す）
        + (!isTrial && !locked ? ["debit", "credit"].filter(side => (side === "debit" ? dRow === D.at(-1) : cRow === C.at(-1)) && (side === "debit" ? dRow : cRow))
          .map(side => `<td class="c-add c-add-${side}">${addBtn(side, v)}</td>`).join("") : "")
        + (last ? actions(anchor, v, locked) : `<td class="c-del"></td>`) + `</tr>`;
    }
  }

  list.innerHTML = `<div class="table-wrap"><table>
    <thead>
      <tr class="group">
        <th colspan="3"></th>${groupHead}
        <th></th>
      </tr>
      <tr>
        <th>No.</th><th>状態</th><th>画像</th>${fields.map(f => `<th class="${[f.num ? "num" : "", f.cls.includes("b-left") ? "b-left" : "", f.key === "date" ? "date" : ""].join(" ")}">${f.head || f.label}</th>`).join("")}
        <th></th>
      </tr>
    </thead>
    <tbody>${body}</tbody>
  </table></div>`;
  fitSummaries();
  renderStats();
  renderTrialBar();
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---- コードの欄: コードの数字か科目名を入れると、その会社のミロク科目マスタから候補を出して選べる ----
const isCodeSearch = el => el?.matches?.("[data-code-suggest]") && /[^\d\s]/.test(el.value);
const suggestEl = Object.assign(document.createElement("div"), { className: "code-suggest", hidden: true });
document.body.appendChild(suggestEl);
let suggestInput = null, suggestIdx = 0, suggestItems = [];
function suggestList(input) {
  const cid = input.closest("#masterDlg") ? masterCid : (rows.find(r => r.id === input.dataset.id)?.companyId || currentCompanyId);
  return masterOf(cid);
}
function showSuggest(input, showAll) {
  const q = showAll ? "" : input.value.trim(), n = normName(q), all = suggestList(input);
  // 空なら全部、数字ならそのコードで始まるもの、文字なら科目名に含むもの
  const items = (!q ? all : /^\d+$/.test(q) ? all.filter(m => m.code.startsWith(q)) : all.filter(m => normName(m.name).includes(n))).slice(0, 200);
  if (!items.length) return hideSuggest();
  suggestInput = input; suggestItems = items;
  suggestIdx = Math.max(0, items.findIndex(m => m.code === input.value.trim())); // 今のコードを選んだ状態にする
  suggestEl.innerHTML = items.map((m, i) => `<div class="cs-item ${i === suggestIdx ? "active" : ""}" data-i="${i}"><span class="cs-code">${escapeHtml(m.code)}</span>${escapeHtml(m.name)}</div>`).join("");
  suggestEl.hidden = false;
  placeSuggest();
  keepSuggestVisible();
}
// 選んでいる候補が見えるように、候補の一覧の中だけをスクロールする（画面全体は動かさない）
function keepSuggestVisible() {
  const el = suggestEl.children[suggestIdx]; if (!el) return;
  if (el.offsetTop < suggestEl.scrollTop) suggestEl.scrollTop = el.offsetTop;
  else if (el.offsetTop + el.offsetHeight > suggestEl.scrollTop + suggestEl.clientHeight) suggestEl.scrollTop = el.offsetTop + el.offsetHeight - suggestEl.clientHeight;
}
// 候補の位置: 欄のすぐ下（下に入りきらなければ上）
function placeSuggest() {
  if (!suggestInput) return;
  const rc = suggestInput.getBoundingClientRect();
  if (rc.bottom < 0 || rc.top > innerHeight) return hideSuggest(); // 欄が画面の外に出たら閉じる
  const h = Math.min(300, suggestEl.scrollHeight);
  suggestEl.style.left = Math.max(8, Math.min(rc.left, innerWidth - 268)) + "px";
  suggestEl.style.top = (rc.bottom + 4 + h > innerHeight && rc.top - 4 - h > 0 ? rc.top - 4 - h : rc.bottom + 4) + "px";
}
function hideSuggest() { suggestEl.hidden = true; suggestInput = null; }
function pickSuggest(i) {
  const m = suggestItems[i], input = suggestInput;
  if (!m || !input) return;
  hideSuggest();
  input.value = m.code;
  input.dispatchEvent(new Event("input", { bubbles: true }));
  input.dispatchEvent(new Event("change", { bubbles: true }));
  hideSuggest();
}
document.addEventListener("input", e => {
  if (!e.target.matches?.("[data-code-suggest]")) return;
  e.target.closest(".code-box")?.classList.toggle("searching", isCodeSearch(e.target)); // 科目名で探している間は、横の科目名を隠す
  showSuggest(e.target);
});
document.addEventListener("focusin", e => {
  if (!e.target.matches?.("[data-code-suggest]")) return;
  e.target.dataset.prev = e.target.value;
  const t = e.target; setTimeout(() => { if (document.activeElement === t) { showSuggest(t, true); t.select(); } }, 0); // 押しただけで候補の一覧を出し、そのまま科目名を打てるようにする
});
document.addEventListener("focusout", e => {
  const t = e.target;
  if (!t.matches?.("[data-code-suggest]")) return;
  setTimeout(() => { if (suggestInput === t) hideSuggest(); if (isCodeSearch(t)) t.value = t.dataset.prev || ""; }, 150); // 選ばずに離れたら元に戻す
});
document.addEventListener("keydown", e => {
  if (suggestEl.hidden || e.target !== suggestInput) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    suggestIdx = (suggestIdx + (e.key === "ArrowDown" ? 1 : suggestItems.length - 1)) % suggestItems.length;
    [...suggestEl.children].forEach((c, i) => c.classList.toggle("active", i === suggestIdx));
    keepSuggestVisible();
  } else if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); pickSuggest(suggestIdx); }
  else if (e.key === "Escape") hideSuggest();

suggestEl.addEventListener("pointerdown", e => { const it = e.target.closest("[data-i]"); if (it) { e.preventDefault(); pickSuggest(Number(it.dataset.i)); } });
addEventListener("scroll", e => { if (!suggestEl.hidden && !suggestEl.contains(e.target)) placeSuggest(); }, true);
addEventListener("resize", () => { if (!suggestEl.hidden) placeSuggest(); });

// 入力の反映（再描画はしないのでフォーカスが外れない）
const list = document.getElementById("list");
list.addEventListener("input", e => {
  if (isCodeSearch(e.target)) return; // 科目名で探している途中は、まだ反映しない
  const { id, key } = e.target.dataset;
  const row = rows.find(r => r.id === id);
  if (!row) return;
  const field = FIELDS.find(f => f.key === key);
  let value = e.target.value;
  if (field.num) value = value.replace(/[^\d]/g, "");
  const codeKey = key === "debitCode" || key === "creditCode";
  if (codeKey) {
    value = (value.match(/^\s*(\d+)/) || [])[1] || "";
    const label = list.querySelector(`[data-code-name-for="${row.id}-${key}"]`);
    if (label) {
      label.textContent = value ? (masterName(value) || "マスタにない") : "";
      label.classList.toggle("unknown", !!value && !masterName(value));
      label.parentElement.style.setProperty("--len", value.length);
    }
  }
  // 借方金額と貸方金額が同じだった場合は連動させる（試算表の行は片側だけなので連動しない）
  if (row.source !== TRIAL_SOURCE && key === "debitAmount" && String(row.creditAmount) === String(row.debitAmount)) {
    row.creditAmount = value;
    const credit = list.querySelector(`input[data-id="${id}"][data-key="creditAmount"]`);
    if (credit) { credit.value = value ? Number(value).toLocaleString() : ""; credit.classList.toggle("missing", isMissing("creditAmount", value)); }
  }
  // 8%と10%に分けた行：片方の金額を直したら、もう片方を「合計（諸口の行）との差」にして、合計が変わらないようにする
  if (row.splitRole && (key === "debitAmount" || (row.splitRole === "total" && key === "creditAmount"))) {
    if (row.splitRole === "total") row.debitAmount = value; // 隠している諸口の行は、借方も貸方と同じ金額
    const grp = rows.filter(o => o.groupId === row.groupId && o.splitRole);
    const tot = grp.find(o => o.splitRole === "total"), r8 = grp.find(o => o.splitRole === "r8"), r10 = grp.find(o => o.splitRole === "r10");
    const setAmt = (o, v) => {
      o.debitAmount = o.creditAmount = v;
      for (const k of ["debitAmount", "creditAmount"]) {
        const el = list.querySelector(`input[data-id="${o.id}"][data-key="${k}"]`);
        if (el) { el.value = v !== "" ? Number(v).toLocaleString() : ""; el.classList.toggle("missing", isMissing(k, v)); }
      }
    };
    if (tot && r8 && r10) {
      if (row === tot) { if (r8.debitAmount !== "" && value !== "") setAmt(r10, Math.max(0, Number(value) - Number(r8.debitAmount))); }
      else if (value !== "" && tot.debitAmount !== "") setAmt(row === r8 ? r10 : r8, Math.max(0, Number(tot.debitAmount) - Number(value)));
    }
  }
  // 8%と10%に分けた仕訳は、日付と借方摘要を同じレシートの行すべてにそろえる
  if (row.splitRole && (key === "date" || key === "summary")) {
    for (const o of rows.filter(o => o !== row && o.groupId === row.groupId && o.splitRole)) {
      if (key === "summary" && creditSummaryOf(o) === (o.summary ?? "")) {
        o.creditSummary = value;
        const cs = list.querySelector(`[data-id="${o.id}"][data-key="creditSummary"]`);
        if (cs) cs.value = value;
      }
      o[key] = value;
      const el = list.querySelector(`[data-id="${o.id}"][data-key="${key}"]`);
      if (el) el.value = value;
    }
  }
  // 借方摘要と貸方摘要が同じ（単一仕訳）なら、貸方摘要も一緒に変える
  if (row.source !== TRIAL_SOURCE && key === "summary" && creditSummaryOf(row) === (row.summary ?? "")) {
    row.creditSummary = value;
    const cs = list.querySelector(`[data-id="${id}"][data-key="creditSummary"]`);
    if (cs) cs.value = value;
  }
  row[key] = value;
  e.target.classList.toggle("missing", fieldMissing(row, key, value));
  // 複合仕訳は、日付を同じまとまりの行すべてにそろえる
  if (key === "date" && lineOf(row) !== "pair") for (const o of voucherRows(row)) o.date = value;
  const badge = list.querySelector(`tr[data-vid-head="${vidOf(row)}"] .c-status .st`);
  if (badge) badge.innerHTML = statusBadge(row);
  if (/Amount$/.test(key)) refreshBalance(row);
  const noteEl = list.querySelector(`[data-note-for="${vidOf(row)}"]`);
  if (noteEl) {
    const w = voucherWarnings(row);

  }

// 摘要の欄は、中身が入りきる高さにする（短ければ1行、長ければ行が増える）

function fitSummaries() { for (const el of document.querySelectorAll("textarea.summary-box")) fitSummary(el); }
list.addEventListener("input", e => {
  if (!e.target.matches?.("textarea.summary-box")) return;

addEventListener("resize", fitSummaries);
// 摘要の欄は折り返して見せるだけで、改行は入れない（Enterで入力を終える）
list.addEventListener("keydown", e => {

// 金額はフォーカスが外れたらカンマ区切りで表示、日付変更時は並び替え
list.addEventListener("change", e => {
  if (isCodeSearch(e.target)) return; // 科目名で探している途中は、まだ反映しない
  const { id, key } = e.target.dataset;
  const row = rows.find(r => r.id === id);
  if (!row) return;
  const side = key.startsWith("debit") ? "debit" : "credit";
  if (/Tax$|Rate$|Biz$/.test(key)) {
    // 区分と税率の組み合わせをそろえる（非課税・対象外は区分と税率が同じ、税率を選んだら課税）
    // 事業者区分は相手で決まるので、区分・税率とは別に選べる（空なら課税事業者を入れる）
    const v = row[key];
    if (key.endsWith("Tax")) row[side + "Rate"] = v === "課税" ? (TAX_TYPES.includes(row[side + "Rate"]) || !row[side + "Rate"] ? "10%" : row[side + "Rate"]) : v;
    else if (key.endsWith("Rate")) row[side + "Tax"] = TAX_TYPES.includes(v) ? v : v ? "課税" : "";
    if (!key.endsWith("Biz") && !row[side + "Biz"]) row[side + "Biz"] = "課税事業者";
