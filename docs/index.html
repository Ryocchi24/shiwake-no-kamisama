<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>仕訳の神様</title>
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="仕訳の神様">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sidebar: #14213d; --sidebar-text: #aeb8cc; --sidebar-active: #22335a;
    --bg: #f3f5f8; --surface: #fff; --surface-2: #f8f9fb;
    --text: #1b2433; --muted: #6a7385; --line: #e2e6ec; --line-strong: #cfd5de;
    --primary: #2463eb; --primary-hover: #1d52c7; --primary-soft: #eaf1ff;
    --debit: #eef4ff; --debit-text: #2451b3; --credit: #fff3ec; --credit-text: #b3521e;
    --ok: #127a4a; --ok-soft: #e4f5ec; --warn: #9a6200; --warn-soft: #fff4d9;
    --err: #c62a2a; --err-soft: #fdeaea; --info: #4a5568; --info-soft: #edf0f4;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
    font-family: "Noto Sans JP", -apple-system, "Hiragino Sans", sans-serif; }
  .mono { font-family: "Roboto Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  /* レイアウト */
  .app { display: grid; grid-template-columns: 224px 1fr; min-height: 100vh; }
  .sidebar { background: var(--sidebar); color: var(--sidebar-text); padding: 18px 12px; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 700; font-size: 15px; padding: 0 8px 20px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 7px; display: block; flex: none; }
  .nav-label { font-size: 11px; letter-spacing: .08em; padding: 14px 10px 6px; color: #7382a0; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; color: inherit; text-decoration: none; font-size: 13.5px; }
  .nav a.active { background: var(--sidebar-active); color: #fff; }
  .nav a.disabled { opacity: .5; pointer-events: none; }
  .nav .soon { margin-left: auto; font-size: 10px; border: 1px solid #3a4a6b; border-radius: 4px; padding: 0 5px; }
  .nav svg { width: 16px; height: 16px; flex: none; }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar { height: 56px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 28px; gap: 16px; position: sticky; top: 0; z-index: 10; }
  .crumb { color: var(--muted); font-size: 13px; }
  .crumb b { color: var(--text); font-weight: 500; }
  .topbar .mobile-brand { display: none; }
  .content { padding: 24px 28px 48px; max-width: 1440px; width: 100%; }

  .page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .page-head h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .page-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .page-head .actions { margin-left: auto; display: flex; gap: 8px; }

  /* ボタン */
  .btn { font: inherit; font-size: 13.5px; font-weight: 500; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
    border-radius: 6px; height: 36px; padding: 0 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn input { display: none; }

  /* 集計カード */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .stat-label { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .stat-value { font-size: 22px; font-weight: 500; margin-top: 4px; }
  .stat-value small { font-size: 13px; color: var(--muted); margin-left: 2px; font-family: "Noto Sans JP", sans-serif; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  /* 仕訳テーブル */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .panel-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .panel-title { font-weight: 700; font-size: 14px; }
  .panel-head .spacer { flex: 1; }
  .field { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
  .field select { font: inherit; font-size: 12.5px; color: var(--text); height: 30px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 6px; background: var(--surface); }
  .field input[type=checkbox] { accent-color: var(--primary); }
  .divider { width: 1px; height: 22px; background: var(--line); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 1060px; }
  th, td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: middle; }
  thead th { background: var(--surface-2); font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; position: sticky; top: 0; }
  thead tr.group th { font-weight: 700; text-align: center; border-bottom: 1px solid var(--line); padding: 6px; }
  thead th.debit { background: var(--debit); color: var(--debit-text); }
  thead th.credit { background: var(--credit); color: var(--credit-text); }
  thead th.num { text-align: right; }
  th.b-left, td.b-left { border-left: 1px solid var(--line); }
  tbody tr:hover td { background: #fafbfd; }
  tbody tr.is-error td, tbody tr.is-reading td { background: var(--surface-2); }
  td.rowno { color: var(--muted); font-size: 12px; text-align: center; width: 36px; }
  td input { width: 100%; font: inherit; font-size: 13.5px; height: 32px; border: 1px solid transparent; border-radius: 5px; padding: 0 7px; background: transparent; color: var(--text); }
  td input:hover { border-color: var(--line); }
  td input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px var(--primary-soft); }
  td input.num { text-align: right; font-family: "Roboto Mono", monospace; font-variant-numeric: tabular-nums; }
  td input.code { font-family: "Roboto Mono", monospace; }
  td input.code::placeholder { color: #c2c8d2; }
  td input.missing { border-color: #f0b4b4; background: var(--err-soft); }
  td.c-date { width: 132px; } td.c-code { width: 68px; } td.c-amount { width: 112px; min-width: 104px; } td.c-summary { min-width: 170px; }
  td.c-amount input { padding: 0 4px; }
  .thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 5px; cursor: zoom-in; border: 1px solid var(--line); display: block; }
  .note[hidden] { display: none; }
  .note { font-size: 11.5px; color: var(--warn); margin: 2px 7px 0; display: flex; gap: 4px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.err { background: var(--err-soft); color: var(--err); }
  .badge.info { background: var(--info-soft); color: var(--info); }
  .spinner { width: 10px; height: 10px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-msg { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .status-msg.error { color: var(--err); }
  .icon-btn { border: none; background: none; color: var(--muted); cursor: pointer; width: 28px; height: 28px; border-radius: 5px; display: grid; place-items: center; }
  .icon-btn:hover { background: var(--err-soft); color: var(--err); }
  .icon-btn svg { width: 15px; height: 15px; }
  tfoot td { background: var(--surface-2); font-weight: 700; border-bottom: none; }
  tfoot td.total { text-align: right; padding-right: 15px; }

  .dropzone { margin: 16px; border: 1.5px dashed var(--line-strong); border-radius: var(--radius); padding: 44px 16px; text-align: center; color: var(--muted); }
  .dropzone svg { width: 36px; height: 36px; color: #a9b2c1; }
  .dropzone b { display: block; color: var(--text); font-size: 15px; margin: 8px 0 4px; }
  body.dragging .panel { outline: 2px solid var(--primary); outline-offset: 2px; }

  .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, .75); display: none; align-items: center; justify-content: center; z-index: 50; padding: 24px; }
  .modal.open { display: flex; }
  .modal img { max-width: 100%; max-height: 100%; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }

  .mobile-capture { display: none; }
  .topbar-gear { margin-left: auto; }
  .banner { background: var(--warn-soft); color: var(--warn); border: 1px solid #f1dca4; border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .company-wrap { position: relative; }
  .company-switch { font: inherit; font-size: 13.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px;
    border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--text); cursor: pointer; max-width: 260px; }
  .company-switch svg { width: 15px; height: 15px; flex: none; color: var(--primary); }
  .company-switch #companyName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .company-switch .caret { color: var(--muted); font-size: 11px; }
  .company-menu { position: absolute; top: calc(100% + 6px); left: 0; min-width: 240px; max-width: 320px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: 0 10px 30px rgba(15,23,42,.15); padding: 6px; z-index: 30; color: var(--text); }
  .company-menu[hidden], #companies[hidden], #moveDlg[hidden] { display: none; }
  .menu-item { display: flex; align-items: center; gap: 8px; width: 100%; font: inherit; font-size: 13.5px; text-align: left; border: none; background: none;
    color: var(--text); padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .menu-item:hover { background: var(--surface-2); }
  .menu-item .check { width: 14px; color: var(--primary); font-weight: 700; }
  .menu-item .cnt { margin-left: auto; color: var(--muted); font-size: 12px; }
  .menu-sep { height: 1px; background: var(--line); margin: 6px 0; }
  .menu-item.sub { color: var(--primary); }
  .company-chip { margin-left: 10px; font-size: 13px; font-weight: 500; color: var(--primary); background: var(--primary-soft); padding: 2px 10px; border-radius: 999px; vertical-align: middle; }
  .company-chip:empty { display: none; }
  .company-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; max-height: 50vh; overflow: auto; }
  .company-item { display: flex; align-items: center; gap: 8px; }
  .company-item input { flex: 1; }
  .company-item .btn-sm { white-space: nowrap; }
  .company-item .cnt { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .company-empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .add-row { display: flex; gap: 8px; }
  .add-row input { flex: 1; }
  .move-list { display: flex; flex-direction: column; gap: 6px; }
  .move-list .btn { justify-content: flex-start; height: 40px; }
  .row-actions { display: flex; gap: 2px; }
  .icon-btn.move:hover { background: var(--primary-soft); color: var(--primary); }
  .tabs { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .tab { font: inherit; font-size: 13px; font-weight: 500; border: none; background: none; color: var(--muted); padding: 5px 12px; border-radius: 6px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(15,23,42,.1); }
  .tab-cnt { font-size: 11.5px; background: var(--info-soft); color: var(--info); border-radius: 999px; padding: 0 7px; min-width: 20px; text-align: center; }
  .tab.active .tab-cnt { background: var(--primary-soft); color: var(--primary); }
  .no-img { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 5px; border: 1px dashed var(--line-strong); color: var(--muted); font-size: 10px; }
  .no-img-lg { color: #c9d1dc; font-size: 13px; padding: 28px 0; }
  .badge.plain { background: var(--info-soft); color: var(--info); }
  .btn-ok { background: var(--ok); border-color: var(--ok); color: #fff; height: 30px; padding: 0 12px; }
  .btn-ok:hover { background: #0e6a3f; }
  .btn-sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
  tbody tr.leaving td { opacity: 0; transition: opacity .18s; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 80; background: #1b2433; color: #fff; border-radius: 10px;
    padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.25); font-size: 13.5px; white-space: nowrap; }
  .toast[hidden] { display: none; }
  .toast-close { font: inherit; color: #aeb8cc; background: none; border: none; cursor: pointer; padding: 4px; }
  .toast-undo { font: inherit; font-weight: 700; color: #8fb4ff; background: none; border: none; cursor: pointer; padding: 4px 6px; }

  .review { background: var(--surface); }
  .review-top { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 8px; }
  .review-pos { color: var(--muted); font-size: 13px; }
  .review-img { background: #20262f; display: flex; justify-content: center; }
  .review-img img { max-width: 100%; max-height: 46vh; object-fit: contain; display: block; cursor: zoom-in; }
  .review-body { padding: 12px 14px 4px; display: flex; flex-direction: column; gap: 10px; }
  .rv-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .rv-field { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--muted); min-width: 0; }
  .rv-field input { font: inherit; font-size: 16px; color: var(--text); height: 42px; border: 1px solid var(--line-strong); border-radius: 7px; padding: 0 10px; background: #fff; width: 100%; }
  /* iPhone(Safari) の日付欄は独自の高さ・最小幅を持つため、ほかの欄とそろえる */
  input[type="date"] { -webkit-appearance: none; appearance: none; min-width: 0; display: block; line-height: normal; }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
  input[type="date"]::-webkit-datetime-edit { padding: 0; }
  .rv-field input, td input { box-sizing: border-box; min-height: 0; line-height: normal; }
  .rv-field input.num { text-align: right; font-family: "Roboto Mono", monospace; }
  .rv-field input.missing { border-color: #f0b4b4; background: var(--err-soft); }
  .rv-note { margin: 0; }
  .rv-error { padding: 8px 0; flex-wrap: wrap; }
  .rv-more summary { font-size: 13px; color: var(--muted); cursor: pointer; padding: 4px 0; }
  .rv-more .rv-grid { margin: 8px 0 10px; }
  .review-actions { display: flex; gap: 8px; padding: 12px 14px 16px; }
  .review-actions .btn { height: 46px; justify-content: center; }
  .review-actions .btn-big { flex: 1; font-size: 16px; height: 46px; }
  .review-reading { display: flex; align-items: center; gap: 8px; color: var(--info); background: var(--info-soft); font-size: 13px; padding: 8px 14px; }
  .methods { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; }
  .method { font: inherit; font-size: 13.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  .method.active { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
  .method-no { font-weight: 700; }
  .soon-tag { font-size: 10.5px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; }
  .trial-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .trial-bar[hidden] { display: none; }
  .trial-bar .field input { font: inherit; font-size: 12.5px; height: 30px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 6px; }
  .trial-balance { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; }
  .trial-balance.ok { background: var(--ok-soft); color: var(--ok); }
  .trial-balance.ng { background: var(--err-soft); color: var(--err); }
  .src-line { font-size: 11.5px; color: var(--muted); margin: 2px 7px 0; }
  .code-name { font-size: 11px; color: var(--muted); margin: 1px 7px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
  .code-name.unknown { color: var(--err); }
  .trial-tag { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 5px; background: var(--info-soft); color: var(--info); font-size: 10px; }
  .dialog-wide { max-width: 760px; max-height: 90vh; display: flex; flex-direction: column; }
  .dlg-sub { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 6px; }
  #masterDlg[hidden] { display: none; }
  #masterDlg .tabs { margin-bottom: 8px; }
  .master-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .master-tools input[type=search] { flex: 1; min-width: 160px; height: 30px; font: inherit; font-size: 13px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 8px; }
  .master-csv[hidden] { display: none; }
  .rc-credit { display: grid; grid-template-columns: auto 110px 1fr; gap: 8px; align-items: center; padding: 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
  .rc-credit b { font-size: 13px; }
  .rc-credit select { height: 32px; font: inherit; font-size: 13px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 6px; background: var(--surface); }
  .rc-credit input { height: 32px; font: inherit; font-size: 13px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 8px; }
  .rc-head { font-size: 12px; color: var(--muted); padding: 8px 12px 4px; }
  .master-row.rule { grid-template-columns: 1fr 100px 1fr 36px; }
  .master-csv { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .master-csv summary { cursor: pointer; }
  .master-csv-body { display: flex; gap: 8px; margin-top: 8px; }
  .master-list { overflow: auto; border: 1px solid var(--line); border-radius: 8px; min-height: 120px; }
  .master-row { display: grid; grid-template-columns: 90px 1fr 36px; gap: 6px; align-items: center; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  .master-row.mapping { grid-template-columns: 70px 1fr 110px 1fr 36px; }
  .master-row input { width: 100%; font: inherit; font-size: 13px; height: 30px; border: 1px solid transparent; border-radius: 5px; padding: 0 6px; background: transparent; }
  .master-row input:focus { border-color: var(--primary); background: #fff; outline: none; }
  .master-row .muted { color: var(--muted); font-size: 12.5px; }
  .master-empty { padding: 24px; text-align: center; color: var(--muted); font-size: 13px; }
  .doc-types { display: flex; gap: 6px; margin: -6px 0 16px; flex-wrap: wrap; }
  .doc-types[hidden] { display: none; }
  .doc-type { font: inherit; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
    color: var(--muted); border-radius: 999px; padding: 5px 14px; cursor: pointer; }
  .doc-type.active { background: var(--text); border-color: var(--text); color: #fff; }
  .doc-type.active .soon-tag { color: #cfd5de; border-color: #6a7385; }
  .method-soon { background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 8px; padding: 14px 16px; color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .method-soon[hidden] { display: none; }
  body.method-off #panel, body.method-off .page-head .actions, body.method-off .mobile-capture, body.method-off #ocrBanner { display: none !important; }
  .method-soon h2 { font-size: 16px; margin: 0 0 6px; color: var(--text); }
  .method-soon { padding: 40px 20px; text-align: center; }
  #importView[hidden], #companiesView[hidden] { display: none; }
  .nav a[data-view].active { background: var(--sidebar-active); color: #fff; }
  .mobile-nav { display: none; }
  .company-select { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .company-select svg { width: 16px; height: 16px; color: var(--primary); }
  .company-select select { font: inherit; font-size: 14px; font-weight: 500; color: var(--text); height: 36px; min-width: 220px; max-width: 100%;
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 10px; background: var(--surface); }
  .company-add { margin-bottom: 16px; }
  .company-add .add-row { padding: 14px 16px; }
  .company-add .add-row input { height: 40px; font: inherit; border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 12px; }
  .panel-sub { color: var(--muted); font-size: 12.5px; }
  #companiesView .company-list { padding: 6px 16px 12px; max-height: none; margin: 0; }
  #companiesView .company-item { padding: 10px 0; border-bottom: 1px solid var(--line); gap: 10px; }
  #companiesView .company-item:last-child { border-bottom: none; }
  #companiesView .company-item input { height: 36px; font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; }
  .company-item .current-tag { font-size: 11px; color: var(--primary); background: var(--primary-soft); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  body.view-companies .mobile-capture { display: none !important; }
  .mode-tag { display: inline-block; margin-left: 8px; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); }
  .banner .btn { margin-left: auto; height: 32px; }

  .camera { position: fixed; inset: 0; background: #000; z-index: 100; color: #fff; }
  .camera[hidden], .dialog-back[hidden], .banner[hidden], .cam-msg[hidden] { display: none; }
  .camera video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cam-frame { position: absolute; inset: 12% 10% 22%; border: 2px solid rgba(255,255,255,.7); border-radius: 12px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.25); pointer-events: none; }
  .cam-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .cam-flash.on { opacity: .8; transition: none; }
  .cam-top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; }
  .cam-btn { font: inherit; font-size: 15px; color: #fff; background: rgba(0,0,0,.45); border: none; border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  .cam-count { background: rgba(0,0,0,.45); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
  .cam-hint { position: absolute; left: 0; right: 0; bottom: calc(130px + env(safe-area-inset-bottom)); text-align: center; font-size: 13px; text-shadow: 0 1px 3px #000; }
  .cam-bottom { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 16px 24px calc(24px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0,0,0,.6)); }
  .cam-last-wrap img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; border: 2px solid #fff; }
  .shutter { width: 76px; height: 76px; border-radius: 50%; border: 5px solid #fff; background: rgba(255,255,255,.3); cursor: pointer; padding: 0; }
  .shutter::after { content: ""; display: block; width: 58px; height: 58px; margin: 4px auto; border-radius: 50%; background: #fff; }
  .shutter:active::after { transform: scale(.9); }
  .cam-done { justify-self: end; background: var(--primary); font-weight: 700; }
  .cam-top { z-index: 2; }
  .camera.no-stream .shutter, .camera.no-stream .cam-hint, .camera.no-stream .cam-frame, .camera.no-stream .cam-count { visibility: hidden; }
  .cam-msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; background: #111; }

  .dialog-back { position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 90; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .dialog { background: var(--surface); border-radius: 12px; width: 100%; max-width: 460px; padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .dialog h2 { margin: 0 0 16px; font-size: 17px; }
  .dlg-label { font-size: 13px; font-weight: 500; display: block; margin-bottom: 6px; }
  .dialog input { width: 100%; font: inherit; height: 40px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 10px; }
  .csv-opts { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-bottom: 18px; }
  .mode-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; font-size: 13px; }
  .mode-box p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
  .dlg-help { font-size: 12.5px; color: var(--muted); margin: 8px 0 18px; }
  .dlg-help:empty { margin: 0 0 10px; }
  .dlg-actions { display: flex; gap: 8px; align-items: center; }

  /* スマホ */
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .topbar { padding: 0 16px; background: var(--sidebar); border: none; color: #fff; }
    .topbar .crumb { display: none; }
    .topbar .mobile-brand { display: flex; }
    .topbar-gear { color: #fff; }
    .mobile-nav { display: flex; order: 3; width: 100%; background: rgba(255,255,255,.1); border-radius: 8px; padding: 3px; gap: 3px; }
    .mobile-nav button { flex: 1; font: inherit; font-size: 14px; color: #cfd5de; background: none; border: none; border-radius: 6px; height: 34px; cursor: pointer; }
    .mobile-nav button.active { background: #fff; color: var(--text); font-weight: 600; }
    .company-select { display: flex; width: 100%; }
    .company-select select { flex: 1; min-width: 0; font-size: 16px; }
    /* iPhoneは16px未満の入力欄をタップすると画面を拡大するため、スマホでは16pxにする */
    .dialog input, .dialog select, .field select { font-size: 16px; }
    /* iPhoneの時計・電池表示と重ならないよう、上に余白をとる（アプリ・ホーム画面から開いたとき） */
    .topbar { flex-wrap: wrap; height: auto; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; row-gap: 10px; }
    .company-wrap { order: 3; width: 100%; }
    .company-switch { width: 100%; max-width: none; height: 38px; background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2); color: #fff; }
    .company-switch svg, .company-switch .caret { color: #fff; }
    .company-switch .caret { margin-left: auto; }
    .company-menu { left: 0; right: 0; max-width: none; }
    .company-chip { display: none; }
    .content { padding: 16px 16px 110px; }
    .page-head .actions { display: none; }
    .methods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 14px; overflow: visible; }
    .trial-bar { width: 100%; }
    .company-item { flex-wrap: wrap; row-gap: 4px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .company-item .btn-sm { order: 3; flex: 1 1 40%; justify-content: center; }
    .master-row.mapping { grid-template-columns: 1fr 88px 32px; row-gap: 0; }
    .master-row.rule { grid-template-columns: 1fr 88px 32px; row-gap: 0; }
    .master-row.rule > span { grid-column: 2 / 4; grid-row: 2; font-size: 11px; padding-left: 6px; }
    .master-row.rule > button { grid-column: 3; grid-row: 1; }
    .rc-credit { grid-template-columns: 1fr 100px; }
    .rc-credit span { grid-column: 1 / 3; }
    .master-row.mapping .muted.src-no { display: none; }
    .master-row.mapping > span:nth-of-type(3) { grid-column: 2 / 4; grid-row: 2; font-size: 11px; padding-left: 6px; }
    .master-row.mapping > button { grid-column: 3; grid-row: 1; }
    .doc-types { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: -4px 0 14px; }
    .doc-type { justify-content: center; gap: 4px; font-size: 12px; padding: 7px 4px; white-space: nowrap; }
    .doc-type .soon-tag { font-size: 9.5px; padding: 0 3px; }
    .method { flex-direction: column; gap: 2px; white-space: normal; text-align: center; font-size: 12px; line-height: 1.35; padding: 8px 4px; justify-content: center; }
    .page-head { margin-bottom: 12px; }
    .stats { grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat { padding: 10px 12px; }
    .stat-value { font-size: 18px; }
    .panel-head .spacer, .divider { display: none; }
    .panel-head #download { width: 100%; justify-content: center; }
    table { min-width: 0; }
    thead { display: none; }
    table, tbody, tfoot, tr, td { display: block; width: 100%; }
    tbody tr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 10px; padding: 12px 14px 12px 64px; border-bottom: 1px solid var(--line); position: relative; }
    tbody td { border: none; padding: 0; width: auto !important; min-width: 0 !important; }
    td.b-left { border: none; }
    td.rowno { display: none; }
    td.c-thumb { position: absolute; left: 14px; top: 14px; }
    td.c-status { grid-column: 1 / 3; padding-right: 30px; }
    td.c-summary, td.c-msg { grid-column: 1 / 3; }
    td.c-del { position: absolute; right: 8px; top: 8px; }
    td[data-label]::before { content: attr(data-label); display: block; font-size: 11px; color: var(--muted); }
    td input { border-color: var(--line); height: 40px; font-size: 16px; }
    tbody td { min-width: 0; }
    tfoot tr { display: flex; justify-content: space-between; padding: 12px 14px; }
    tfoot td { width: auto; padding: 0; }
    tfoot td.hide-sm { display: none; }
    .mobile-capture { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: var(--surface); border-top: 1px solid var(--line); z-index: 20; }
    .mobile-capture .btn { height: 48px; justify-content: center; font-size: 15px; }
    .toast { bottom: calc(90px + env(safe-area-inset-bottom)); }
    .tabs { width: 100%; }
    .tab { flex: 1; justify-content: center; padding: 7px 4px; }
    .row-actions .btn-sm { height: 32px; }
  }
</style>
</head>

<script type="module">
// 高精度モード（Claude）の部品は、使うときだけネットから読み込む（アプリを電波がなくても開けるように）
const ANTHROPIC_SDK_URL = "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.128.0/+esm";

const MODEL = "claude-opus-5";
const API_KEY_STORAGE = "shiwake-api-key";
const STORAGE_KEY = "receipt-rows-v1";
const COMPANIES_KEY = "shiwake-companies";
const CURRENT_COMPANY_KEY = "shiwake-current-company";
const SETTINGS_KEY = "receipt-settings-v1";
const MAX_PARALLEL_AI = 3;  // Claude はサーバー側で処理するので並列で送る
const MAX_PARALLEL_OCR = 1; // 端末内OCRはスマホの負荷が高いので1枚ずつ

/** 1行 = 1仕訳。thumb は一覧用の小さい画像（localStorage）、大きい画像は IndexedDB に保存 */
let rows = load(STORAGE_KEY, []);
const fullImages = new Map(); // groupId -> dataURL（読み込み済みの大きい画像のキャッシュ）
// 読み取り専用の、さらに大きい画像（小さい文字をつぶさないため）。読み取りが終わったら捨てる
const ocrImages = new Map();
const OCR_MAX_SIDE = 3000;

// 大きい画像の保存場所（localStorage は容量が小さいため IndexedDB を使う）
const imageStore = (() => {
  let dbPromise = null;
  const open = () => dbPromise ||= new Promise((resolve, reject) => {
    const req = indexedDB.open("shiwake-images", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("images");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction("images", mode);
      const req = fn(tx.objectStore("images"));
      tx.oncomplete = () => resolve(req.result);
      tx.onerror = () => reject(tx.error);
    });
  };
  return {
    get: key => run("readonly", st => st.get(key)),
    put: (key, value) => run("readwrite", st => st.put(value, key)),
    del: key => run("readwrite", st => st.delete(key)),
    keys: () => run("readonly", st => st.getAllKeys()),
  };
})();
async function getFullImage(groupId) {
  if (fullImages.has(groupId)) return fullImages.get(groupId);
  try {
    const src = await imageStore.get(groupId);
    if (src) fullImages.set(groupId, src);
    return src || null;
  } catch { return null; }
}
// どの仕訳からも使われなくなった画像を消す
async function pruneImages() {
  try {
    const used = new Set(rows.map(r => r.groupId));
    for (const key of await imageStore.keys()) if (!used.has(key)) await imageStore.del(key);
    for (const key of fullImages.keys()) if (!used.has(key)) fullImages.delete(key);
    for (const key of ocrImages.keys()) if (!used.has(key)) ocrImages.delete(key);
  } catch {}
}
let queue = [];
let running = 0;

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(rows.filter(r => r.status !== "reading"))); } catch {}
}
// ---- 会社 ----
let companies = load(COMPANIES_KEY, []);
let currentCompanyId = load(CURRENT_COMPANY_KEY, null);
function saveCompanies() {
  try {
    localStorage.setItem(COMPANIES_KEY, JSON.stringify(companies));
    localStorage.setItem(CURRENT_COMPANY_KEY, JSON.stringify(currentCompanyId));
  } catch {}
}
const currentCompany = () => companies.find(c => c.id === currentCompanyId) || null;
// 取り込み方法（①レシート ②③…）ごとに一覧を分けて管理する
const currentSource = () => settings.method || "receipt";
const companyRows = () => rows.filter(r => r.companyId === currentCompanyId && (r.source || "receipt") === currentSource());
const countFor = id => rows.filter(r => r.companyId === id && r.status === "done").length;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// ---- 設定 ----
const settings = Object.assign({ dateFormat: "slash", encoding: "sjis", includeHeader: true }, load(SETTINGS_KEY, {}));
for (const key of ["dateFormat", "encoding"]) {
  const el = document.getElementById(key);
  el.value = settings[key];
  el.onchange = () => { settings[key] = el.value; saveSettings(); };
}
const headerBox = document.getElementById("includeHeader");
headerBox.checked = settings.includeHeader;
headerBox.onchange = () => { settings.includeHeader = headerBox.checked; saveSettings(); };
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {} }

// ---- 画像の取り込み ----
for (const input of document.querySelectorAll(".file-picker, .file-camera")) {
  input.onchange = e => { addFiles(e.target.files); e.target.value = ""; };
}
// PC はドラッグ＆ドロップでも取り込める
let dragDepth = 0;
addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
  addFiles([...e.dataTransfer.files].filter(f => f.type.startsWith("image/")));
});

async function addFiles(fileList) {
  const files = Array.from(fileList);
  if (!files.length) return;
  if (settings.method === TRIAL_SOURCE) return importTrial(files);
  if ((settings.method || "receipt") !== "receipt" || (settings.docType || "receipt") !== "receipt") {
    alert("この取り込み方法は準備中です。「① 原始資料」の「レシート・領収書」を選んでください。");
    return;
  }
  if (!currentCompany()) {
    alert("先に会社を登録・選択してください。");
    openCompanies();
    return;
  }
  for (const file of files) {
    const groupId = uid();
    try {
      const [full, thumb, forOcr] = await Promise.all([
        resize(file, 1600, 0.85),
        resize(file, 240, 0.7),
        // iPhoneアプリの文字認識は大きい画像のほうが正確（Web版の文字認識は重くなるので保存用と同じ大きさ）
        NATIVE ? resize(file, OCR_MAX_SIDE, 0.9) : null,
      ]);
      fullImages.set(groupId, full);
      if (forOcr) ocrImages.set(groupId, forOcr);
      imageStore.put(groupId, full).catch(() => {});
      rows.push({ id: uid(), groupId, companyId: currentCompanyId, source: "receipt", thumb, status: "reading" });
      queue.push(groupId);
    } catch (err) {
      alert(`${file.name}: ${err.message}`);
    }
  }
  render();
  pump();
}

function resize(file, maxSide, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => reject(new Error("画像を開けませんでした"));
    img.src = URL.createObjectURL(file);
  });
}

function pump() {
  const limit = getApiKey() ? MAX_PARALLEL_AI : MAX_PARALLEL_OCR;
  while (running < limit && queue.length) {
    const groupId = queue.shift();
    running++;
    readGroup(groupId).finally(() => { running--; pump(); });
  }
}

async function readGroup(groupId) {
  const placeholder = rows.find(r => r.groupId === groupId && r.status === "reading");
  try {
    const image = ocrImages.get(groupId) || await getFullImage(groupId);
    if (!image) throw new Error("画像が見つかりません。もう一度撮影してください");
    const data = { receipts: getApiKey() ? await readReceipt(image.split(",")[1]) : await readReceiptFree(image) };

    const idx = rows.indexOf(placeholder);
    if (idx < 0) return; // 読み取り中に削除された
    const receipts = data.receipts.length ? data.receipts
      : [{ date: "", amount: 0, summary: "", note: "レシートを検出できませんでした" }];
    const rc = receiptSettingsOf(placeholder.companyId);
    const newRows = receipts.map(r => ({
      id: uid(), groupId, companyId: placeholder.companyId, source: placeholder.source || "receipt", thumb: placeholder.thumb, status: "done", review: "pending",
      store: r.store || "",
      date: r.date || "",
      debitCode: receiptDebitCode(placeholder.companyId, r.store, r.summary || r.store), debitSub: "", debitAmount: r.amount || "",
      summary: r.summary || r.store || "",
      creditCode: rc.creditCode || "", creditSub: "", creditAmount: r.amount || "",
      note: r.note || "",
      ocrText: r.ocrText || "",
    }));
    rows.splice(idx, 1, ...newRows);
    ocrImages.delete(groupId);
  } catch (err) {
    if (placeholder) Object.assign(placeholder, { status: "error", error: err.message });
  }
  save();
  render();
}

// ---- AI 読み取り（ブラウザから直接 Claude API を呼ぶ） ----
const RECEIPT_SCHEMA = {
  type: "object",
  properties: {
    receipts: {
      type: "array",
      items: {
        type: "object",
        properties: {
          date: { type: "string", description: "取引日 YYYY-MM-DD。読めない場合は空文字" },
          amount: { type: "integer", description: "支払総額（税込・円）。読めない場合は0" },
          store: { type: "string", description: "店名・発行者名" },
          summary: { type: "string", description: "摘要: 「店名 主な品目」の形で短く（全角20文字程度まで）" },
          note: { type: "string", description: "読み取りに自信がない点があれば短く。なければ空文字" },
        },
        required: ["date", "amount", "store", "summary", "note"],
        additionalProperties: false,
      },
    },
  },
  required: ["receipts"],
  additionalProperties: false,
};

function buildPrompt() {
  const today = new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Tokyo" });
  return `この画像は日本の領収書・レシートです。会計仕訳の入力に使うため、次の情報を読み取ってください。

- date: 取引日を西暦 YYYY-MM-DD で。和暦（令和など）は西暦に変換。年が印字されていない場合は、今日（${today}）以前で最も近い年と判断する。
- amount: 実際に支払った合計金額（税込）。お預かり・お釣りの金額ではなく「合計」「お買上計」「領収金額」の金額を使う。
- store: 店名・発行者名。
- summary: 「店名 主な品目」の形で短く。品目が多い場合は代表的なものか分類名（例: 文具類、飲食代）でまとめる。
- note: かすれ・折れなどで確信が持てない項目があれば短く記載。

1枚の画像に複数のレシートが写っている場合は、それぞれを別の要素として返してください。
レシートが写っていない場合は receipts を空配列にしてください。`;
}

function getApiKey() { try { return localStorage.getItem(API_KEY_STORAGE) || ""; } catch { return ""; } }

async function readReceipt(imageBase64) {
  const apiKey = getApiKey();
  if (!apiKey) throw new Error("APIキーが未設定です（右上の設定から登録してください）");
  const { default: Anthropic } = await import(ANTHROPIC_SDK_URL);
  const client = new Anthropic({ apiKey, dangerouslyAllowBrowser: true });
  let response;
  try {
    response = await client.messages.create({
      model: MODEL,
      max_tokens: 16000,
      output_config: { effort: "medium", format: { type: "json_schema", schema: RECEIPT_SCHEMA } },
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: "image/jpeg", data: imageBase64 } },
          { type: "text", text: buildPrompt() },
        ],
      }],
    });
  } catch (err) {
    if (err instanceof Anthropic.AuthenticationError) throw new Error("APIキーが正しくありません（設定を確認してください）");
    if (err instanceof Anthropic.RateLimitError) throw new Error("混み合っています。少し待ってから再読み取りしてください");
    if (err instanceof Anthropic.APIConnectionError) throw new Error("AIに接続できません。電波状況を確認してください");
    if (err instanceof Anthropic.APIError) throw new Error(`AIエラー (${err.status}): ${err.message}`);
    throw err;
  }
  if (response.stop_reason === "refusal") throw new Error("AIが読み取りを断りました。画像を確認してください");
  const text = response.content.find(b => b.type === "text")?.text;
  if (!text) throw new Error("読み取り結果が空でした");
  return JSON.parse(text).receipts;
}

// ---- 無料モード：端末内OCR（Tesseract.js）＋ルールで項目を抜き出す ----
let ocrWorkerPromise = null;
function getOcrWorker() {
  if (!ocrWorkerPromise) {
    const banner = document.getElementById("ocrBanner");
    banner.textContent = "文字認識の準備をしています（初回のみ数MBのデータを読み込みます）…";
    banner.hidden = false;
    ocrWorkerPromise = Tesseract.createWorker("jpn")
      .then(async worker => {
        await worker.setParameters({ tessedit_pageseg_mode: "6", preserve_interword_spaces: "1" });
        return worker;
      })
      .catch(err => { ocrWorkerPromise = null; throw new Error("文字認識の準備に失敗しました。電波の良い場所で再読み取りしてください"); })
      .finally(() => { banner.hidden = true; });
  }
  return ocrWorkerPromise;
}

// OCR向けに白黒化・コントラスト強調した画像を作る
function preprocessForOcr(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(2, 1800 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const px = ctx.getImageData(0, 0, c.width, c.height);
      const d = px.data;
      // 明るさの分布の両端を切ってコントラストを広げる（感熱紙の薄い文字対策）
      const hist = new Uint32Array(256);
      const gray = new Uint8ClampedArray(d.length / 4);
      for (let i = 0, j = 0; i < d.length; i += 4, j++) {
        gray[j] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        hist[gray[j]]++;
      }
      const total = gray.length;
      let lo = 0, hi = 255, acc = 0;
      while (lo < 255 && (acc += hist[lo]) < total * 0.02) lo++;
      acc = 0;
      while (hi > 0 && (acc += hist[hi]) < total * 0.02) hi--;
      const range = Math.max(1, hi - lo);
      for (let i = 0, j = 0; i < d.length; i += 4, j++) {
        const v = ((gray[j] - lo) * 255) / range;
        d[i] = d[i + 1] = d[i + 2] = v;
      }
      ctx.putImageData(px, 0, 0);
      resolve(c);
    };
    img.onerror = () => reject(new Error("画像を開けませんでした"));
    img.src = dataUrl;
  });
}

// 全角英数字→半角、日本語の文字間に入る余計な空白を除去
function normalizeText(text) {
  return text
    .replace(/[０-９Ａ-Ｚａ-ｚ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/[，]/g, ",").replace(/[．]/g, ".").replace(/[／]/g, "/").replace(/[：]/g, ":")
    .replace(/[¥￥]/g, "¥")
    .replace(/([^\x00-\x7F])[ \t]+(?=[^\x00-\x7F])/g, "$1")
    .replace(/(\d)[ \t]+(?=[\d,])/g, "$1")
    .replace(/,[ \t]+(?=\d)/g, ",")
    // 「5.,500」「5 ,500」「5、500」のように崩れた桁区切りを「5,500」に直す
    .replace(/(\d)[ \t]*[,.、]{1,2}[ \t]*(?=\d{3}(?!\d))/g, "$1,");
}

function validDate(y, m, d) {
  const dt = new Date(y, m - 1, d);
  return y >= 2000 && y <= 2100 && dt.getMonth() === m - 1 && dt.getDate() === d;
}
const pad = n => String(n).padStart(2, "0");

function extractDate(text) {
  // 日付と時刻の間の空白が読み取りで消えて「26/09/2609:00:47」のようにくっつくことがあるので、時刻の前に空白を入れる
  text = text.replace(/(\d)(\d{1,2}:\d{2}(?::\d{2})?)/g, "$1 $2");
  const candidates = [];
  const push = (y, m, d) => { if (validDate(y, m, d)) candidates.push(`${y}-${pad(m)}-${pad(d)}`); };
  for (const m of text.matchAll(/(20\d{2})\s*[年/.\-]\s*(\d{1,2})\s*[月/.\-]\s*(\d{1,2})/g)) push(+m[1], +m[2], +m[3]);
  for (const m of text.matchAll(/(?:令和|R)\s*(\d{1,2}|元)\s*[年/.\-]\s*(\d{1,2})\s*[月/.\-]\s*(\d{1,2})/g))
    push(2018 + (m[1] === "元" ? 1 : +m[1]), +m[2], +m[3]);
  if (!candidates.length) {
    for (const m of text.matchAll(/(?<!\d)(\d{2})[/.](\d{1,2})[/.](\d{1,2})(?!\d)/g)) push(2000 + +m[1], +m[2], +m[3]);
  }
  const today = new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Tokyo" });
  return candidates.find(c => c <= today) || candidates[0] || "";
}

function amountsIn(line) {
  // 「1,280」「¥1280」「1.280」（OCRでカンマが点になる場合）などを拾う
  return [...line.matchAll(/¥?\s*(\d{1,3}(?:[,.]\d{3})+|\d{1,7})(?![\d%])/g)]
    .map(m => Number(m[1].replace(/[,.]/g, "")))
    .filter(n => n > 0 && n < 10000000);
}

function extractAmount(lines) {
  const exclude = /小計|お?預|釣|つり|税率|対象|内税|外税|消費税|点数|ポイント|電話|TEL|No\.|番号/i;
  const priorities = [/合\s*計|総\s*額|ご?請求/, /お買上|お買い上げ|領収金額|お支払|支払金額|金\s*額|^金\s*[¥\d]|円也/, /(?<!小)計/];
  for (const re of priorities) {
    for (let i = 0; i < lines.length; i++) {
      if (!re.test(lines[i]) || exclude.test(lines[i])) continue;
      // 金額が同じ行になければ次の行を見る
      const nums = amountsIn(lines[i].replace(/.*?(合\s*計|総\s*額|請求|お買上|お買い上げ|領収金額|お支払|支払金額|金\s*額|^金|計)/, ""));
      const found = nums.length ? nums : amountsIn(lines[i + 1] || "");
      if (found.length) return Math.max(...found);
    }
  }
  // キーワードが読めなかった場合は「¥」付きの最大の金額
  const yen = lines.filter(l => /¥/.test(l) && !/お?預|釣|つり/.test(l)).flatMap(amountsIn);
  return yen.length ? Math.max(...yen) : 0;
}

// 店名: レシート上部の行に「店名らしさ」の点数をつけて、一番高い行を選ぶ。
// 一番上はロゴ（英字や崩れた文字）のことが多いので、日本語の店名の行を優先する
function extractStore(lines, confs = []) {
  // 宛名（〜様・〜御中）、但し書き、金額・日付・住所の行は店名にしない
  const skip = /領収|レシート|売上票|伝票|控え|明細|いらっしゃ|ありがと|毎度|TEL|電話|〒|登録番号|様$|御中$|^但|上記|金額|合計|¥|\d\s*円|円也|^金\s|運転手|担当|レジ|\d{4}年|令和|\d{1,2}[/.]\d{1,2}|[都道府県].*[市区町村郡]|^[\d\s\-:/.,¥]+$/i;
  const japanese = /[\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Han}]/u;
  // 店の情報（電話・住所・登録番号）の行。店名はこの近くにあることが多い
  const storeInfo = /TEL|電話|登録番号|〒|[都道府県].*[市区町村郡]/i;
  const clean = line => line.replace(/[^\p{L}\p{N}ー・&\-\s]/gu, "").replace(/\s+/g, " ").trim()
    .replace(/(?<=[\p{Script=Katakana}\p{Script=Han}ー])[A-Za-z]$/u, "");      // 日本語の後ろに紛れた1文字の英字（読み間違い）を除く
  // 「加盟店名」「店舗名」などの見出し。店名は見出しの後ろか、次の行に書かれている
  const label = /^(加盟店名?|店舗名|店名|MERCHANT)[\s:：]*/i;

  const top = lines.slice(0, 12);
  for (let i = 0; i < top.length; i++) {
    if (!label.test(top[i])) continue;
    const rest = clean(top[i].replace(label, "").replace(/MERCHANT/i, ""));
    if (japanese.test(rest) && !skip.test(rest)) return rest.slice(0, 24);
    const next = clean(top[i + 1] || "");
    if (japanese.test(next) && !skip.test(top[i + 1])) return next.slice(0, 24);
  }
  let best = null;
  top.forEach((line, i) => {
    const t = clean(line);
    const letters = (t.match(/\p{L}/gu) || []).length;
    if (letters < 2 || skip.test(line)) return;
    let score = 0;
    if (japanese.test(t)) score += 3; else score -= 3;                 // 英字だけの行はロゴのことが多い
    if (/[^\s]店$|店舗|本店|支店|営業所/.test(t)) score += 2;
    if (/株式会社|有限会社|合同会社|㈱|\(株\)/.test(line)) score += 2;
    if (storeInfo.test(top[i - 1] || "") || storeInfo.test(top[i + 1] || "") || storeInfo.test(top[i + 2] || "")) score += 1;
    const conf = confs[i] ?? 1;
    if (conf < 0.5) score -= 2; else if (conf < 0.7) score -= 1;    // 崩れた文字（ロゴなど）は自信が低い
    const digits = (t.match(/\d/g) || []).length;
    if (digits / t.length > 0.3) score -= 2;
    if (t.length > 22) score -= 2;                                     // 長い行は店名より案内文のことが多い
    score -= i * 0.3;                                                  // 同じくらいなら上の行を優先
    if (!best || score > best.score) best = { score, i, t };
  });
  if (!best) return "";
  // 店名と支店名（〜店）が2行に分かれている場合はつなげる（例: ファミリーマート 新宿西口店）
  const isBranch = t => /^[^\s]{1,10}店$/.test(t);
  const usable = i => {
    const t = clean(top[i] || "");
    return t && japanese.test(t) && !skip.test(top[i]) && !isBranch(t);
  };
  if (isBranch(best.t) && usable(best.i - 1)) return `${clean(top[best.i - 1])} ${best.t}`.slice(0, 24);
  const next = clean(top[best.i + 1] || "");
  if (!/店$/.test(best.t) && isBranch(next) && !skip.test(top[best.i + 1])) return `${best.t} ${next}`.slice(0, 24);
  return best.t.slice(0, 24);
}

// iPhoneアプリの中で開いているときは、iPhone標準の文字認識（Vision）を使う
const NATIVE = window.Capacitor?.isNativePlatform?.() ? window.Capacitor : null;
const callNative = (method, options) => NATIVE.nativePromise("ShiwakeNative", method, options);

// 文字認識は「かたまり」ごとに位置付きで返るので、同じ高さにあるものを1行にまとめる
// （レシートの「合計」と右端の「¥1,280」を同じ行として扱うため）。
// 斜めに撮った写真にも対応するため、傾きの候補を少しずつ変えてまとめてみて、
// 行数が一番少なくなる（左右の組が一番多くそろう）傾きを採用する
function groupLines(items, width, height, theta) {
  const cos = Math.cos(theta), sin = Math.sin(theta);
  const pts = items.map(it => {
    const cx = (it.x + it.w / 2) * width, cy = (it.y + it.h / 2) * height;
    return { text: it.text, conf: it.confidence, x: cx * cos + cy * sin, y: -cx * sin + cy * cos, h: it.h * height };
  });
  const lines = [];
  for (const p of pts.sort((a, b) => a.y - b.y)) {
    const line = lines.find(l => Math.abs(l.y - p.y) < Math.min(l.h, p.h) * 0.5);
    if (line) { line.items.push(p); line.y = (line.y + p.y) / 2; line.h = Math.max(line.h, p.h); }
    else lines.push({ y: p.y, h: p.h, items: [p] });
  }
  return lines.sort((a, b) => a.y - b.y);
}

function itemsToLines(items, width = 1, height = 1) {
  // 目安の傾き: 長い行の傾きの中央値（短い文字は傾きが0で返ることが多いため除く）
  const maxW = Math.max(0, ...items.map(i => i.w));
  const angles = items.filter(i => typeof i.angle === "number" && i.w >= maxW * 0.3).map(i => i.angle).sort((a, b) => a - b);
  const guess = angles.length ? angles[Math.floor(angles.length / 2)] : 0;
  let best = null;
  for (let theta = guess - 0.1; theta <= guess + 0.1; theta += 0.004) {
    const lines = groupLines(items, width, height, theta);
    const score = [lines.length, Math.abs(theta - guess)];
    if (!best || score[0] < best.score[0] || (score[0] === best.score[0] && score[1] < best.score[1])) best = { lines, score };
  }
  // 1行の文字と、その行でいちばん低い「文字認識の自信」（0〜1）
  return (best ? best.lines : []).map(l => {
    const sorted = l.items.sort((a, b) => a.x - b.x);
    return { text: sorted.map(i => i.text).join("  "), conf: Math.min(...sorted.map(i => i.conf ?? 1)) };
  });
}

// 戻り値: 行ごとの { text, conf }（conf は文字認識の自信。分からない場合は 1）
async function recognizeText(dataUrl) {
  if (NATIVE) {
    const res = await callNative("recognizeText", { image: dataUrl.split(",")[1] });
    return itemsToLines(res.items || [], res.width, res.height);
  }
  const worker = await getOcrWorker();
  const canvas = await preprocessForOcr(dataUrl);
  const { data } = await worker.recognize(canvas);
  return (data.text || "").split(/\r?\n/).map(text => ({ text, conf: 1 }));
}

// 領収書の「但し 〇〇代として」から品目を取り出す
function extractPurpose(lines) {
  for (const line of lines) {
    const m = line.match(/^但し?\s*(.+?)(?:として)?\s*$/);
    if (m && m[1]) return m[1].trim().slice(0, 20);
  }
  return "";
}

async function readReceiptFree(dataUrl) {
  const recognized = (await recognizeText(dataUrl))
    .map(l => ({ text: normalizeText(l.text).trim(), conf: l.conf }))
    .filter(l => l.text);
  if (!recognized.length) return [];
  const lines = recognized.map(l => l.text);
  const text = lines.join("\n");
  const date = extractDate(text);
  const amount = extractAmount(lines);
  const store = extractStore(lines, recognized.map(l => l.conf));
  const purpose = extractPurpose(lines);
  const summary = [store, purpose].filter(Boolean).join(" ");
  return [{ date, amount, store, summary, ocrText: text, note: "" }];
}

const isMissing = (key, v) => (key === "date" && !v) || ((key === "debitAmount" || key === "creditAmount") && !Number(v));
// 入力欄の赤い印。試算表の行は片側（借方か貸方）だけを使うので、使っている側だけを確認する
function fieldMissing(row, key, v) {
  if (row.source !== TRIAL_SOURCE) return isMissing(key, v);
  const side = Number(row.debitAmount) ? "debit" : Number(row.creditAmount) ? "credit" : "";
  if (key === "date") return !v;
  if (key === "debitAmount" || key === "creditAmount") return !side;
  if (key === "debitCode") return side === "debit" && !v;
  if (key === "creditCode") return side === "credit" && !v;
  return false;
}
// 注意書きは今の入力内容から毎回判定する（入力すれば消える）
function warningsOf(r) {
  if (r.status !== "done") return [];
  if (r.source === TRIAL_SOURCE) {
    const w = [];
    const code = Number(r.debitAmount) ? r.debitCode : r.creditCode;
    if (!r.date) w.push("日付が空です");
    if (!code) w.push("ミロクのコードが未設定です");
    else if (masterOf(r.companyId).length && !masterOf(r.companyId).some(m => m.code === String(code))) w.push("マスタにないコードです");
    if (r.codeHow === "推測" && code) w.push("科目名から推測したコードです");
    if (r.note) w.push(r.note);
    return w;
  }
  const w = [];
  if (!r.date) w.push("日付が空です");
  if (!Number(r.debitAmount)) w.push("金額が空です");
  else if (Number(r.debitAmount) !== Number(r.creditAmount)) w.push("借方と貸方の金額が違います");
  if (!String(r.summary || "").trim()) w.push("摘要が空です");
  if (r.note) w.push(r.note);
  return w;
}
const noteHtml = r => {
  const w = warningsOf(r);
  return `<div class="note" data-note-for="${r.id}" ${w.length ? "" : "hidden"}>⚠ ${escapeHtml(w.join("／"))}</div>`;
};

// 一覧に出すのは、まだCSVに出力していない仕訳（出力済みは「格納済み」として保管）

    const head = `<td class="rowno">${i + 1}</td><td class="c-status">${statusBadge(row)}</td>${thumb}`;
    if (row.status !== "done") {
      const msg = row.status === "reading"
        ? `<span class="status-msg">読み取っています…</span>`
        : `<span class="status-msg error">${escapeHtml(row.error)}<button class="btn" data-retry="${row.id}">再読み取り</button></span>`;
      body += `<tr class="is-${row.status}" data-row="${row.id}">${head}<td colspan="${FIELDS.length}" class="c-msg">${msg}</td>${actions(row)}</tr>`;

    const isTrial = row.source === TRIAL_SOURCE;
    const codeName = key => (key === "debitCode" || key === "creditCode") && row[key]
      ? `<div class="code-name ${masterName(row[key]) ? "" : "unknown"}" data-code-name-for="${row.id}-${key}">${escapeHtml(masterName(row[key]) || "マスタにない")}</div>`
      : (key === "debitCode" || key === "creditCode") ? `<div class="code-name" data-code-name-for="${row.id}-${key}"></div>` : "";
    body += `<tr data-row="${row.id}">${head}` + FIELDS.map(f => `<td class="${f.cls}" data-label="${f.label}">
        ${inputHtml(row, f)}${codeName(f.key)}
        ${f.key === "summary" && isTrial ? `<div class="src-line">元の科目: ${escapeHtml(row.srcName)}${row.srcCode ? ` [${escapeHtml(row.srcCode)}]` : ""}</div>` : ""}
        ${f.key === "summary" ? noteHtml(row) : ""}
      </td>`).join("") + `${actions(row)}</tr>`;
  });

  list.innerHTML = `<div class="table-wrap"><table>
    <thead>

        <th class="credit b-left" colspan="3">貸方</th>
        <th></th>
      </tr>
      <tr>
        <th>No.</th><th>状態</th><th>証憑</th><th>①伝票日付</th>
        <th class="b-left" title="勘定科目コード">②科目</th><th title="科目別補助コード">③補助</th><th class="num">④金額</th>
        <th class="b-left">⑤摘要</th>
        <th class="b-left" title="勘定科目コード">⑥科目</th><th title="科目別補助コード">⑦補助</th><th class="num">⑧金額</th>
        <th></th>
      </tr>
    </thead>
    <tbody>${body}</tbody>
  </table></div>`;
  renderStats();
  renderTrialBar();
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

    const rc = receiptSettingsOf(row.companyId);
    const ex = rc.rules.find(x => normName(x.keyword) === normName(row.store));
    if (row.debitCode) { if (ex) ex.code = row.debitCode; else rc.rules.push({ keyword: row.store, code: row.debitCode }); }
    else if (ex) rc.rules = rc.rules.filter(x => x !== ex);
    for (const o of rows) if (o !== row && o.companyId === row.companyId && o.source !== TRIAL_SOURCE && o.review !== "exported" && !o.debitCode && normName(o.store) === normName(row.store)) o.debitCode = row.debitCode;
    saveReceiptSettings(); save(); render();

  else if (FIELDS.find(f => f.key === key)?.num && row[key] !== "") e.target.value = Number(row[key]).toLocaleString();

  if (!done.length) return;
  const incomplete = done.filter(r => r.source === TRIAL_SOURCE
    ? !r.date || !(Number(r.debitAmount) ? r.debitCode : r.creditCode)
    : !r.date || !Number(r.debitAmount));
  if (incomplete.length && !confirm(`日付・金額・コードが空の行が ${incomplete.length} 件あります。このままダウンロードしますか？`)) return;
  if (done.some(r => r.source === TRIAL_SOURCE)) {
    const d = done.reduce((s, r) => s + Number(r.debitAmount || 0), 0), c = done.reduce((s, r) => s + Number(r.creditAmount || 0), 0);
    if (d !== c && !confirm(`借方合計（${d.toLocaleString()}）と貸方合計（${c.toLocaleString()}）が一致していません。このままダウンロードしますか？`)) return;
  }

  const formatDate = d => !d ? "" : settings.dateFormat === "compact" ? d.replace(/-/g, "") : d.replace(/-/g, "/");
  const cell = v => { const t = String(v ?? ""); return /[",\r\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const lines = done.map(r => [formatDate(r.date), r.debitCode, r.debitSub, r.debitAmount, r.summary, r.creditCode, r.creditSub, r.creditAmount].map(cell).join(","));
  if (settings.includeHeader) lines.unshift(CSV_HEADERS.join(","));
  const csv = lines.join("\r\n") + "\r\n";

  const bytes = settings.encoding === "utf8"
    ? new TextEncoder().encode("﻿" + csv)
    : new Uint8Array(Encoding.convert(Encoding.stringToCode(csv), { to: "SJIS", from: "UNICODE" }));
  const blob = new Blob([bytes], { type: "text/csv" });
  const stamp = new Date().toLocaleString("sv-SE", { timeZone: "Asia/Tokyo" }).replace(/[-: ]/g, "").slice(0, 12);
  const company = (currentCompany()?.name || "会社").replace(/[\\/:*?"<>|]/g, "_");
  const name = `${company}_仕訳_${stamp}.csv`;
  if (!(await saveFile(blob, name))) return; // 保存をキャンセルした場合は一覧に残す

  // 二重取り込みを防ぐため、出力した仕訳は一覧から外して「格納済み」として保管する
  setReview(done.map(r => r.id), "exported", `${done.length}件を保存しました`);
};

// ファイルの保存。スマホはリンクからのダウンロードが不安定（特にiPhone）なので、
// 標準の共有シート（「ファイルに保存」など）を使う。保存できたら true
async function saveFile(blob, name) {
  if (NATIVE) {
    // アプリでは iPhone の共有シートを直接開く
    const data = await new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(",")[1]);
      reader.readAsDataURL(blob);
    });
    const { completed } = await callNative("shareFile", { data, filename: name });
    return !!completed;
  }
  const file = new File([blob], name, { type: blob.type });
  const touch = matchMedia("(pointer: coarse)").matches;
  if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file] });
      return true;
    } catch (err) {
      if (err.name === "AbortError") return false; // 共有シートを閉じた
      if (err.name === "NotAllowedError") return tapToShare(file); // 確認ダイアログなどで操作の直後と判定されなかった
      // それ以外はリンクからのダウンロードに切り替える
    }
  }
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: name });
  document.body.appendChild(a);
  a.click();
  a.remove();
  // すぐに破棄すると保存画面で中身が読めなくなるため、しばらく残す
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  return true;
}

// 共有シートはタップの直後にしか開けないため、もう一度タップしてもらう
function tapToShare(file) {
  return new Promise(resolve => {
    const toast = document.getElementById("toast");
    toast.innerHTML = `<span>CSVの準備ができました</span><button class="toast-undo">保存する</button><button class="toast-close" aria-label="閉じる">✕</button>`;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toast.querySelector(".toast-undo").onclick = async () => {
      toast.hidden = true;
      try { await navigator.share({ files: [file] }); resolve(true); } catch { resolve(false); }
    };
    toast.querySelector(".toast-close").onclick = () => { toast.hidden = true; resolve(false); };
  });
}

function nameSimilarity(a, b) {
  const B = [...b], used = new Array(B.length).fill(false); let hit = 0;
  for (const ch of a) { const i = B.findIndex((c, k) => !used[k] && c === ch); if (i >= 0) { used[i] = true; hit++; } }
  return (2 * hit) / (a.length + B.length || 1);
}
function suggestCode(srcName) {
  const n = normName(srcName);
  const list = masterOf().map(m => ({ ...m, n: normName(m.name) }));
  const exact = list.filter(m => m.n === n);
  if (exact.length === 1) return exact[0].code;          // 同じ名前が2つある科目（製造原価と販管費など）は推測しない
  if (exact.length > 1) return "";
  const best = list.map(m => ({ ...m, s: nameSimilarity(n, m.n) })).sort((a, b) => b.s - a.s)[0];
  return best && best.s >= 0.75 ? best.code : "";
}

// ---- 表の読み取り: 文字のかたまりを、行の高さに合わせて1行ずつに分ける ----
function tableRows(items, width, height) {
  const maxW = Math.max(0, ...items.map(i => i.w));
  const angles = items.filter(i => typeof i.angle === "number" && i.w >= maxW * 0.3).map(i => i.angle).sort((a, b) => a - b);
  const theta = angles.length ? angles[Math.floor(angles.length / 2)] : 0;
  const cos = Math.cos(theta), sin = Math.sin(theta);
  const pts = items.map(it => {
    const cx = (it.x + it.w / 2) * width, cy = (it.y + it.h / 2) * height;
    return { text: it.text, x: cx * cos + cy * sin, y: -cx * sin + cy * cos, h: it.h * height };
  }).sort((a, b) => a.y - b.y);
  const hs = pts.map(p => p.h).sort((a, b) => a - b);
  const tol = (hs[Math.floor(hs.length / 2)] || 10) * 0.5;
  const out = [];
  for (const p of pts) {
    const row = out.find(r => Math.abs(r.y - p.y) < tol);
    if (row) { row.cells.push(p); row.y = (row.y * (row.cells.length - 1) + p.y) / row.cells.length; }
    else out.push({ y: p.y, cells: [p] });
  }
  return out.sort((a, b) => a.y - b.y).map(r => r.cells.sort((a, b) => a.x - b.x).map(c => c.text));
}

// 1ページを読み取って、行ごとのセルの配列にする
async function readTablePage(dataUrl) {
  if (NATIVE) {
    const res = await callNative("recognizeText", { image: dataUrl.split(",")[1] });
    return tableRows(res.items || [], res.width, res.height);
  }
  // Web版（精度は下がる）: 文字認識の結果を行ごとに区切ってセルにする
  const worker = await getOcrWorker();
  const canvas = await preprocessForOcr(dataUrl);
  const { data } = await worker.recognize(canvas);
  return (data.text || "").split(/\r?\n/).map(l => l.replace(/(\d)[,.、]\s+(\d)/g, "$1,$2").trim()).filter(Boolean).map(l => l.split(/\s+/));
}

// PDFを1ページずつ画像にする（同梱の pdf.js を使う）
async function pdfToImages(file) {
  const pdfjs = await import("./vendor/pdfjs/pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc = new URL("./vendor/pdfjs/pdf.worker.min.mjs", location.href).href;
  const doc = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const images = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const page = await doc.getPage(i);
    const base = page.getViewport({ scale: 1 });
    const viewport = page.getViewport({ scale: Math.min(4, 2200 / base.width) });
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(viewport.width); canvas.height = Math.round(viewport.height);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    // 表示用(display)の描画は画面が隠れていると止まるため、印刷用(print)で描く
    await page.render({ canvasContext: ctx, viewport, intent: "print" }).promise;
    images.push(canvas.toDataURL("image/jpeg", 0.9));
  }
  return images;
}

// 金額のセルか（「1,234,567」「-620,000」「△745,000」。OCRでカンマが点になったものも含む）
const AMOUNT_RE = /^[-△▲]?\d{1,3}(?:[,.、]\d{3})+$|^[-△▲]?\d+$/;
const RATIO_RE = /^[-△▲]?\d{1,3}\.\d{1,2}$/; // 構成比（0.17 など）
const toAmount = t => { const neg = /^[-△▲]/.test(t); const n = Number(t.replace(/[^\d]/g, "")); return neg ? -n : n; };

// 表の各行から、科目・前残・借方・貸方・残高を取り出す
function parseTrialTable(allRows) {
  const accounts = [];
  const headerText = allRows.slice(0, 12).map(c => c.join(" ")).join("\n");
  const codeRows = allRows.filter(c => /[［\[]\s*\d{2,5}/.test(c.join(" "))).length;
  const needCode = codeRows >= 5; // 番号付きの試算表（PCAなど）は、番号のない行を合計行とみなす
  // 科目番号の桁数: 閉じかっこまで読めた行で一番多い桁数（閉じかっこ「］」は数字の1と読まれることがあるため）
  const lens = {};
  for (const c of allRows) { const m = c.join(" ").match(/[［\[]\s*(\d{2,5})\s*[］\]]/); if (m) lens[m[1].length] = (lens[m[1].length] || 0) + 1; }
  const codeLen = Number(Object.entries(lens).sort((a, b) => b[1] - a[1])[0]?.[0] || 3);
  for (const cells of allRows) {
    const joined = cells.join(" ");
    let srcCode = (joined.match(new RegExp(`[［\\[]\\s*(\\d{${codeLen}})`)) || [])[1] || "";
    const name = [], nums = [];
    // 1つのセルに数字が2つ入ることがある（例:「364,391,455 100.00」）ので、空白で分けてから判定する
    const tokens = cells.flatMap((raw, i) => raw.replace(/(\d)[,.、]\s+(\d)/g, "$1,$2").trim().split(/\s+/).map(t => ({ t, first: i === 0 })));
    tokens.forEach(({ t, first }) => {
      if (!t) return;
      if (first && !srcCode && /^\d{3,4}$/.test(t) && cells.length > 2) { srcCode = t; return; } // 先頭の列が科目コード（ミロク形式など）
      if (nums.length && RATIO_RE.test(t)) return;
      if (AMOUNT_RE.test(t)) { nums.push(toAmount(t)); return; }
      if (!nums.length) name.push(t);
    });
    const srcName = name.join("").replace(/[［\[].*$/, "").replace(/\s/g, "");
    if (!srcName || nums.length < 4) continue;
    if (needCode && !srcCode) continue;
    if (/計$|合計|^[【〔(（].*[】〕)）]$|^9\d{3}$/.test(srcName) || /^9\d{3}$/.test(srcCode)) continue;
    const [zen, debit, credit, zan] = nums.slice(-4);
    const ok = zen + debit - credit === zan || zen - debit + credit === zan;
    accounts.push({ srcCode, srcName, zen, debit, credit, zan, ok });
  }
  // 伝票日付の初期値: 見出しにある日付のうち一番新しいもの（例: 令和8年7月31日）
  const dates = [];
  const t = headerText.replace(/(\d)(\d{1,2}:\d{2})/g, "$1 $2");
  for (const m of t.matchAll(/(?:令和|R)\s*(\d{1,2}|元)\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/g)) dates.push([2018 + (m[1] === "元" ? 1 : +m[1]), +m[2], +m[3]]);
  for (const m of t.matchAll(/(20\d{2})\s*[年/.\-]\s*(\d{1,2})\s*[月/.\-]\s*(\d{1,2})/g)) dates.push([+m[1], +m[2], +m[3]]);
  const valid = dates.filter(([y, m, d]) => validDate(y, m, d)).map(([y, m, d]) => `${y}-${pad(m)}-${pad(d)}`).sort();
  return { accounts, date: valid[valid.length - 1] || "" };
}

// ---- Excel・CSVの試算表 ----
// Excelは文字認識を通さず、セルの値をそのまま使う（同梱の SheetJS を必要なときだけ読み込む）
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = Object.assign(document.createElement("script"), { src, onload: resolve, onerror: () => reject(new Error("部品を読み込めませんでした")) });
    document.head.appendChild(el);
  });
}
const isSheetFile = f => /\.(xlsx|xlsm|xls|csv)$/i.test(f.name) || /spreadsheet|excel|text\/csv/.test(f.type);
async function sheetToRows(file) {
  if (!window.XLSX) await loadScript("vendor/sheetjs/xlsx.full.min.js");
  const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: "array", codepage: 932 });
  // すべてのシートを上から順に（試算表が複数シートに分かれている場合も読む）
  return wb.SheetNames.flatMap(name => XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false, defval: "" })
    .map(row => row.map(v => String(v ?? "").trim())));
}

// 見出しの行（「借方」「貸方」を含む行）から列の位置を決めて読む。見つからなければ表の読み取りと同じ方法で読む
function parseTrialSheet(rows) {
  const headerIdx = rows.findIndex((r, i) => i < 30 && r.some(c => /借方/.test(c)) && r.some(c => /貸方/.test(c)));
  if (headerIdx < 0) return parseTrialTable(rows.map(r => r.filter(c => c !== "")));
  // 見出しが2段になっている表にも対応するため、見出し行と次の行の文字をつなげて列ごとに見る
  const head = rows[headerIdx].map((c, i) => c + (rows[headerIdx + 1]?.[i] && !AMOUNT_RE.test(rows[headerIdx + 1][i].replace(/[,\s]/g, "")) ? rows[headerIdx + 1][i] : ""));
  const find = (re, not) => head.findIndex(h => re.test(h) && !(not && not.test(h)));
  const debitCol = find(/借方/, /残高|繰越|前|期首/);
  const creditCol = find(/貸方/, /残高|繰越|前|期首/);
  const zenCol = find(/前月|前残|前期|期首|繰越/);
  const zanCol = find(/残高/, /前月|前残|期首|繰越|借方残高|貸方残高/);
  const codeCol = find(/コード|番号|^No|^ＮＯ/i);
  let nameCol = find(/科目|勘定/);
  if (nameCol < 0) nameCol = codeCol === 0 ? 1 : 0;
  if (debitCol < 0 || creditCol < 0) return parseTrialTable(rows.map(r => r.filter(c => c !== "")));
  const amount = v => {
    const t = String(v || "").replace(/[,\s円¥￥]/g, "");
    if (!t) return 0;
    const neg = /^[-△▲]|^\(.*\)$/.test(t);
    const n = Number(t.replace(/[^\d.]/g, ""));
    return Number.isFinite(n) ? Math.round(neg ? -n : n) : 0;
  };
  const accounts = [];
  for (const row of rows.slice(headerIdx + 1)) {
    let srcName = String(row[nameCol] || "").replace(/\s/g, "");
    let srcCode = codeCol >= 0 ? String(row[codeCol] || "").trim() : "";
    const m = srcName.match(/^(.*?)[［\[]\s*(\d+)\s*[］\]]?$/); // 「現金［111］」のように番号が科目名に付いている形
    if (m) { srcName = m[1]; srcCode ||= m[2]; }
    if (!srcCode && /^\d{2,5}$/.test(String(row[0] || "")) && nameCol !== 0) srcCode = String(row[0]);
    if (!srcName || /計$|合計|^[【〔(（].*[】〕)）]$/.test(srcName) || /^9\d{3}$/.test(srcCode)) continue;
    const debit = amount(row[debitCol]), credit = amount(row[creditCol]);
    const zen = zenCol >= 0 ? amount(row[zenCol]) : 0, zan = zanCol >= 0 ? amount(row[zanCol]) : 0;
    if (!debit && !credit && !zen && !zan) continue;
    const ok = zenCol < 0 || zanCol < 0 || zen + debit - credit === zan || zen - debit + credit === zan;
    accounts.push({ srcCode, srcName, zen, debit, credit, zan, ok });
  }
  const { date } = parseTrialTable(rows.slice(0, 12).map(r => r.filter(c => c !== "")));
  return { accounts, date };
}

async function importTrial(files) {
  if (!currentCompany()) { alert("先に会社を登録・選択してください。"); openCompanies(); return; }
  const banner = document.getElementById("ocrBanner");
  const show = msg => { banner.textContent = msg; banner.hidden = false; };
  try {
    // Excel・CSV はセルの値をそのまま使い、PDF・画像は文字認識で表を読み取る
    const sheets = files.filter(isSheetFile), others = files.filter(f => !isSheetFile(f));
    let accounts = [], date = "";
    for (const file of sheets) {
      show(`Excelを読み込んでいます（${file.name}）…`);
      const res = parseTrialSheet(await sheetToRows(file));
      accounts.push(...res.accounts); date = date || res.date;
    }
    if (others.length) {
      const pages = [];
      for (const file of others) {
        if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) { show(`PDFを開いています（${file.name}）…`); pages.push(...await pdfToImages(file)); }
        else pages.push(await resize(file, OCR_MAX_SIDE, 0.9));
      }
      const allRows = [];
      for (let i = 0; i < pages.length; i++) { show(`試算表を読み取っています（${i + 1} / ${pages.length} ページ）…`); allRows.push(...await readTablePage(pages[i])); }
      const res = parseTrialTable(allRows);
      accounts.push(...res.accounts); date = date || res.date;
    }
    banner.hidden = true;
    if (!accounts.length) { alert("試算表の科目を読み取れませんでした。Excelの場合は「借方」「貸方」の見出しがある表か確認してください。写真の場合は、表全体がまっすぐ写るように撮り直してください。"); return; }

    const map = mappingOf();
    const groupId = uid();
    const made = [];
    for (const a of accounts) {
      const key = srcKeyOf(a.srcCode, a.srcName);
      const learned = map[key]?.code;
      // 会社の対応表 → 標準の対応（番号と科目名が一致）→ 科目名からの推測 の順に探す
      // 番号が一致し、科目名もほぼ同じ（読み取りで1〜2文字違うことがあるため）ものを使う
      const std = systemOf().mapping.find(d => d.srcCode === a.srcCode && nameSimilarity(normName(a.srcName), normName(d.srcName)) >= 0.6)?.code;
      const code = learned || std || suggestCode(a.srcName);
      const base = { id: "", groupId, companyId: currentCompanyId, source: TRIAL_SOURCE, thumb: "", status: "done", review: "pending",
        date, summary: "", debitCode: "", debitSub: "", debitAmount: "", creditCode: "", creditSub: "", creditAmount: "",
        srcKey: key, srcCode: a.srcCode, srcName: a.srcName, codeHow: learned ? "対応表" : std ? "標準の対応" : code ? "推測" : "", note: "", _ok: a.ok };
      if (a.debit) made.push({ ...base, id: uid(), debitCode: code, debitAmount: a.debit });
      if (a.credit) made.push({ ...base, id: uid(), creditCode: code, creditAmount: a.credit });
    }
    const d = made.reduce((s, r) => s + Number(r.debitAmount || 0), 0), c = made.reduce((s, r) => s + Number(r.creditAmount || 0), 0);
    // 借方と貸方の合計がずれているときだけ、前残・残高の計算が合わない行に目印をつける（読み間違いの候補）
    for (const r of made) { if (d !== c && !r._ok) r.note = "前残・残高の計算が合いません（金額の読み間違いの可能性）"; delete r._ok; }
    rows.push(...made);
    save(); render();
    const unset = made.filter(r => !(r.debitCode || r.creditCode)).length;
    showToast(`${made.length}行` + (d === c ? "" : `／貸借差額 ${Math.abs(d - c).toLocaleString()}円`) + (unset ? `／コード未設定 ${unset}行` : ""));
  } catch (err) {
    banner.hidden = true;
    alert(`試算表を読み取れませんでした: ${err.message || err}`);
  }
}

// 試算表の行: 元の科目の対応を決めたら、同じ科目の行すべてに反映し、対応表に覚える
function applyMapping(row, code) {
  if (!row.srcKey) return;
  const map = mappingOf(row.companyId);
  if (code) map[row.srcKey] = { code, srcName: row.srcName, srcCode: row.srcCode };
  else delete map[row.srcKey];
  for (const r of rows) {
    if (r.companyId !== row.companyId || r.srcKey !== row.srcKey || r.review === "exported") continue;
    if (Number(r.debitAmount)) r.debitCode = code; else r.creditCode = code;
    r.codeHow = code ? "対応表" : "";
  }
  saveMasters(); save();
}

// 借方・貸方の合計（諸口の差額）
function renderTrialBar() {
  const bar = document.getElementById("trialBar");
  const isTrial = currentSource() === TRIAL_SOURCE;
  const items = isTrial ? sortedRows().filter(r => r.status === "done") : [];
  // 試算表を読み込むまでは表示しない
  bar.hidden = !isTrial || !items.length;
  if (bar.hidden) return;
  const d = items.reduce((s, r) => s + Number(r.debitAmount || 0), 0), c = items.reduce((s, r) => s + Number(r.creditAmount || 0), 0);
  const el = document.getElementById("trialBalance");
  if (!items.length) { el.textContent = ""; el.className = "trial-balance"; }
  else if (d === c) { el.textContent = `✓ 借方・貸方とも ${d.toLocaleString()}円（一致）`; el.className = "trial-balance ok"; }
  else { el.textContent = `⚠ 借方 ${d.toLocaleString()} ／ 貸方 ${c.toLocaleString()}（差額 ${Math.abs(d - c).toLocaleString()}円）`; el.className = "trial-balance ng"; }
  const dateEl = document.getElementById("trialDate");
  if (document.activeElement !== dateEl) dateEl.value = items[0]?.date || "";
}
document.getElementById("trialDate").addEventListener("change", e => {
  for (const r of sortedRows()) r.date = e.target.value;
  save(); render();
});
document.getElementById("trialClear").onclick = () => {
  const items = sortedRows();
  if (!items.length || !confirm(`試算表から作った ${items.length} 行を一覧から消しますか？（対応表は残ります）`)) return;
  const ids = new Set(items.map(r => r.id));
  rows = rows.filter(r => !ids.has(r.id));
  save(); render();
};

// CSVの読み込み（Shift_JIS / UTF-8 のどちらでも）
async function readCsvFile(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  let text;
  try { text = new TextDecoder("utf-8", { fatal: true }).decode(buf); } catch { text = new TextDecoder("shift_jis").decode(buf); }
  text = text.replace(/^﻿/, "");
  return text.split(/\r?\n/).filter(l => l.trim()).map(line => {
    const cells = []; let cur = "", q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
      else if (ch === '"') q = true; else if (ch === ",") { cells.push(cur); cur = ""; } else cur += ch;
    }
    cells.push(cur);
    return cells.map(c => c.trim());
  });
}
document.getElementById("masterImport").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  const table = await readCsvFile(file);
  if (masterTab === "master") {
    const items = table.filter(c => /^\d+$/.test(c[0]) && c[1]).map(c => ({ code: c[0], name: c[1] }));
    if (!items.length) { alert("「コード,科目名」の行が見つかりませんでした。"); return; }
    const replace = masterOf(masterCid).length && confirm(`${items.length}科目を読み込みます。\n今のマスタ（${masterOf(masterCid).length}科目）を置き換えますか？\n［キャンセル］を押すと、今のマスタに追加・上書きします。`);
    if (replace) masters[masterCid] = items;
    else for (const it of items) { const ex = masterOf(masterCid).find(m => m.code === it.code); if (ex) ex.name = it.name; else masterOf(masterCid).push(it); }
    showToast(`${items.length}科目を読み込みました`);
  } else {
    // 「元の番号,元の科目名,ミロクコード」
    const items = table.filter(c => c[1] && /^\d+$/.test(c[2] || "")).map(c => ({ srcCode: /^\d+$/.test(c[0]) ? c[0] : "", srcName: c[1], code: c[2] }));
    if (!items.length) { alert("「元の番号,元の科目名,ミロクコード」の行が見つかりませんでした。"); return; }
    for (const it of items) mappingOf(masterCid)[srcKeyOf(it.srcCode, it.srcName)] = it;
    showToast(`${items.length}件の対応を読み込みました`);
  }
  saveMasters(); renderMaster();
});
document.getElementById("masterExport").onclick = async () => {
  const cell = v => { const t = String(v ?? ""); return /[",\r\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const lines = masterTab === "master"
    ? [["コード", "科目名"], ...masterOf(masterCid).map(m => [m.code, m.name])]
    : [["元の番号", "元の科目名", "ミロクコード", "ミロク科目名"], ...Object.values(mappingOf(masterCid)).map(v => [v.srcCode, v.srcName, v.code, masterName(v.code, masterCid)])];
  const csv = lines.map(l => l.map(cell).join(",")).join("\r\n") + "\r\n";
  const bytes = new Uint8Array(Encoding.convert(Encoding.stringToCode(csv), { to: "SJIS", from: "UNICODE" }));
  const company = (companies.find(c => c.id === masterCid)?.name || "会社").replace(/[\\/:*?"<>|]/g, "_");
  await saveFile(new Blob([bytes], { type: "text/csv" }), `${company}_${masterTab === "master" ? "科目マスタ" : "対応表"}.csv`);
};

// ①原始資料は、さらに種類（レシート・領収書／給与台帳／通帳）ごとに読み込み方を分ける
function renderMethod() {
  const method = settings.method || "receipt";
  const doc = settings.docType || "receipt";
  for (const b of document.querySelectorAll(".method")) b.classList.toggle("active", b.dataset.method === method);
  for (const b of document.querySelectorAll(".doc-type")) b.classList.toggle("active", b.dataset.doc === doc);
