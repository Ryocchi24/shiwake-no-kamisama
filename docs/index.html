<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>仕訳の神様</title>
<meta name="theme-color" content="#0d1629">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="仕訳の神様">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* アイコンに合わせた「紺 × 金」 */
    --navy: #14213d; --navy-deep: #0d1629; --gold: #d9b45f; --gold-light: #ecd08c; --gold-deep: #8c6a22;
    --sidebar: var(--navy-deep); --sidebar-text: #a3abbd; --sidebar-active: rgba(217,180,95,.12);
    --bg: #f5f6f8; --surface: #fff; --surface-2: #f8f9fb;
    --text: #111827; --muted: #5b6272; --line: #e5e7eb; --line-strong: #d1d5db;
    --primary: var(--navy); --primary-hover: #1f3159; --primary-soft: #f4ecd8;
    --debit: #f1f3f8; --debit-text: #26375e; --credit: #faf3e6; --credit-text: #8c6a22; --date-bg: #e9f5ee; --date-text: #1f6b43;
    --ok: #127a4a; --ok-soft: #e4f5ec; --warn: #9a6200; --warn-soft: #fff4d9;
    --err: #c62a2a; --err-soft: #fdeaea; --info: #4a5568; --info-soft: #edf0f4;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(17,24,39,.04), 0 1px 3px rgba(17,24,39,.04);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
    font-family: "Noto Sans JP", -apple-system, "Hiragino Sans", sans-serif; }
  .mono { font-family: "Roboto Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  /* レイアウト */
  .app { display: grid; grid-template-columns: 224px 1fr; min-height: 100vh; }
  .sidebar { background: var(--sidebar); color: var(--sidebar-text); padding: 18px 12px; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 700; font-size: 15px; padding: 0 8px 20px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 7px; display: block; flex: none; }
  .nav-label { font-size: 11px; letter-spacing: .08em; padding: 14px 10px 6px; color: #7382a0; }
  .sidebar .nav { margin-top: 18px; display: flex; flex-direction: column; gap: 4px; } /* 見出しで分けずに、1か所に並べる */
  .nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; color: inherit; text-decoration: none; font-size: 13.5px; }
  .nav a.active { background: var(--sidebar-active); color: #fff; }
  .nav a.disabled { opacity: .5; pointer-events: none; }
  .nav .soon { margin-left: auto; font-size: 10px; border: 1px solid #3a4a6b; border-radius: 4px; padding: 0 5px; }
  .nav svg { width: 16px; height: 16px; flex: none; }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar { height: 56px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 28px; gap: 16px; position: sticky; top: 0; z-index: 10; }
  .crumb { color: var(--muted); font-size: 13px; }
  .crumb b { color: var(--text); font-weight: 500; }
  .topbar .mobile-brand { display: none; }
  .content { padding: 24px 28px 48px; max-width: 1440px; width: 100%; }

  .page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .page-head h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .page-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .page-head .actions { margin-left: auto; display: flex; gap: 8px; }

  /* ボタン */
  .btn { font: inherit; font-size: 13.5px; font-weight: 500; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
    border-radius: 6px; height: 36px; padding: 0 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn input { display: none; }

  /* 集計カード */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .stat-label { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .stat-value { font-size: 22px; font-weight: 500; margin-top: 4px; }
  .stat-value small { font-size: 13px; color: var(--muted); margin-left: 2px; font-family: "Noto Sans JP", sans-serif; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  /* 仕訳テーブル */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .sync-panel { margin-bottom: 16px; }
  .sync-body { padding: 14px 18px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .sync-pass { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; }
  .sync-pass input { font: inherit; height: 38px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 10px; flex: 1 1 180px; min-width: 0; }
  .panel-sub.sync-err { color: var(--err); }
  .panel-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .panel-title { font-weight: 700; font-size: 14px; }
  .panel-head .spacer { flex: 1; }
  .field { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
  .field select { font: inherit; font-size: 12.5px; color: var(--text); height: 30px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 6px; background: var(--surface); }
  .field input[type=checkbox] { accent-color: var(--primary); }
  .divider { width: 1px; height: 22px; background: var(--line); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 1060px; }
  th, td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: middle; }
  thead th { background: var(--surface-2); font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; position: sticky; top: 0; }
  thead tr.group th { font-weight: 700; text-align: center; border-bottom: 1px solid var(--line); padding: 6px; }
  thead th.debit { background: var(--debit); color: var(--debit-text); }
  thead th.credit { background: var(--credit); color: var(--credit-text); }
  thead th.date { background: var(--date-bg); color: var(--date-text); }
  thead th.num { text-align: right; }
  th.b-left, td.b-left { border-left: 1px solid var(--line); }
  tbody tr:hover td { background: #fafbfd; }
  tbody tr.is-error td, tbody tr.is-reading td { background: var(--surface-2); }
  td.rowno { color: var(--muted); font-size: 12px; text-align: center; width: 36px; }
  td textarea.summary-box { width: 100%; box-sizing: border-box; font: inherit; font-size: 13.5px; line-height: 1.4; height: 32px; min-height: 32px;
    border: 1px solid transparent; border-radius: 5px; padding: 4px 7px; background: transparent; color: var(--text); resize: none; overflow: hidden; display: block; }
  td textarea.summary-box:hover { border-color: var(--line); }
  td textarea.summary-box:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px var(--primary-soft); }
  td input { width: 100%; font: inherit; font-size: 13.5px; height: 32px; border: 1px solid transparent; border-radius: 5px; padding: 0 7px; background: transparent; color: var(--text); }
  td input:hover { border-color: var(--line); }
  td input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px var(--primary-soft); }
  /* iPhoneでは日付の文字が上に寄るので、上下の中央にそろえる */
  td input[type="date"] { -webkit-appearance: none; appearance: none; padding-top: 0; padding-bottom: 0; line-height: 30px; }
  td input[type="date"]::-webkit-date-and-time-value { margin: 0; text-align: left; }
  td input.num { text-align: right; font-family: "Roboto Mono", monospace; font-variant-numeric: tabular-nums; }
  td input.code { font-family: "Roboto Mono", monospace; }
  td input.code::placeholder { color: #c2c8d2; }
  td input.missing { border-color: #f0b4b4; background: var(--err-soft); }
  td.c-date { width: 132px; background: var(--date-bg); }
  td.c-date.unbalanced { background: var(--err-soft); }
  .balance { font-size: 11.5px; margin-top: 4px; font-weight: 600; }
  .balance.ok { color: var(--date-text); }
  .balance.ng { color: var(--err); } td.c-code { width: 68px; } td.c-amount { width: 112px; min-width: 104px; } td.c-summary { min-width: 170px; }
  td.c-amount input { padding: 0 4px; }
  td.c-blank { display: none; }
  td.c-code { min-width: 68px; } td.c-acct { width: 150px; min-width: 150px; } td.c-tax { width: 84px; min-width: 84px; } td.c-rate { width: 84px; min-width: 84px; } td.c-biz { width: 112px; min-width: 112px; }
  td select { width: 100%; font: inherit; font-size: 13px; height: 32px; border: 1px solid transparent; border-radius: 5px; padding: 0 2px; background: transparent; color: var(--text); }
  td select:hover { border-color: var(--line); }
  td select:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px var(--primary-soft); }
  .thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 5px; cursor: zoom-in; border: 1px solid var(--line); display: block; }
  .note[hidden] { display: none; }
  .note { font-size: 11.5px; color: var(--warn); margin: 2px 7px 0; display: flex; gap: 4px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.err { background: var(--err-soft); color: var(--err); }
  .badge.info { background: var(--info-soft); color: var(--info); }
  .spinner { width: 10px; height: 10px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-msg { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .status-msg.error { color: var(--err); }
  .icon-btn { border: none; background: none; color: var(--muted); cursor: pointer; width: 28px; height: 28px; border-radius: 5px; display: grid; place-items: center; }
  .icon-btn:hover { background: var(--err-soft); color: var(--err); }
  .icon-btn svg { width: 15px; height: 15px; }
  tfoot td { background: var(--surface-2); font-weight: 700; border-bottom: none; }
  tfoot td.total { text-align: right; padding-right: 15px; }

  .dropzone { margin: 16px; border: 1.5px dashed var(--line-strong); border-radius: var(--radius); padding: 44px 16px; text-align: center; color: var(--muted); }
  .dropzone svg { width: 36px; height: 36px; color: #a9b2c1; }
  .dropzone b { display: block; color: var(--text); font-size: 15px; margin: 8px 0 4px; }
  body.dragging .panel { outline: 2px solid var(--primary); outline-offset: 2px; }

  .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, .75); display: none; align-items: center; justify-content: center; z-index: 50; padding: 24px; }
  .modal.open { display: flex; }
  .modal { padding: 0; background: rgba(8, 12, 22, .92); }
  .viewer { position: absolute; inset: 0 0 72px; overflow: hidden; display: flex; align-items: center; justify-content: center; touch-action: none; cursor: zoom-in; }
  .viewer.zoomed { cursor: grab; }
  .viewer img { max-width: calc(100% - 32px); max-height: calc(100% - 32px); border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.4); transform-origin: 0 0; user-select: none; -webkit-user-drag: none; }
  .viewer-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 72px; padding-bottom: env(safe-area-inset-bottom); display: flex; align-items: center; justify-content: center; gap: 10px; }
  .viewer-btn { font: inherit; font-size: 16px; font-weight: 600; color: #fff; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: 10px; min-width: 48px; height: 44px; padding: 0 14px; cursor: pointer; }
  .viewer-close { background: var(--gold); color: var(--navy-deep); border-color: var(--gold); }

  .mobile-capture { display: none; }
  .topbar-gear { margin-left: auto; }
  .banner { background: var(--warn-soft); color: var(--warn); border: 1px solid #f1dca4; border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .company-wrap { position: relative; }
  .company-switch { font: inherit; font-size: 13.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px;
    border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--text); cursor: pointer; max-width: 260px; }
  .company-switch svg { width: 15px; height: 15px; flex: none; color: var(--primary); }
  .company-switch #companyName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .company-switch .caret { color: var(--muted); font-size: 11px; }
  .company-menu { position: absolute; top: calc(100% + 6px); left: 0; min-width: 240px; max-width: 320px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: 0 10px 30px rgba(15,23,42,.15); padding: 6px; z-index: 30; color: var(--text); }
  .company-menu[hidden], #companies[hidden] { display: none; }
  .menu-item { display: flex; align-items: center; gap: 8px; width: 100%; font: inherit; font-size: 13.5px; text-align: left; border: none; background: none;
    color: var(--text); padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .menu-item:hover { background: var(--surface-2); }
  .menu-item .check { width: 14px; color: var(--primary); font-weight: 700; }
  .menu-item .cnt { margin-left: auto; color: var(--muted); font-size: 12px; }
  .menu-sep { height: 1px; background: var(--line); margin: 6px 0; }
  .menu-item.sub { color: var(--primary); }
  .company-chip { margin-left: 10px; font-size: 13px; font-weight: 500; color: var(--primary); background: var(--primary-soft); padding: 2px 10px; border-radius: 999px; vertical-align: middle; }
  .company-chip:empty { display: none; }
  .company-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; max-height: 50vh; overflow: auto; }
  .company-item { display: flex; align-items: center; gap: 8px; }
  .company-item input { flex: 1; }
  .company-item .btn-sm { white-space: nowrap; }
  .company-item .cnt { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .company-empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .add-row { display: flex; gap: 8px; }
  .add-row input { flex: 1; }
  .row-actions { display: flex; gap: 2px; }
  .act-label { display: none; }
  /* 保管庫 */
  .archive-company { height: 34px; font: inherit; font-size: 13.5px; font-weight: 600; border: 1px solid var(--line-strong); border-radius: 999px; padding: 0 12px; background: var(--surface); color: var(--text); max-width: 100%; }
  .archive-list { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
  .arc-item { border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); overflow: hidden; }
  .arc-head { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; font: inherit; font-size: 14px; color: var(--text); background: none; border: none; cursor: pointer; text-align: left; flex-wrap: wrap; }
  .arc-head .arc-date { font-weight: 700; }
  .arc-head .arc-sum { margin-left: auto; color: var(--muted); font-size: 13px; }
  .arc-body { border-top: 1px solid var(--line); padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
  .arc-v { display: flex; gap: 10px; align-items: flex-start; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .arc-v:last-of-type { border-bottom: none; }
  .arc-thumb { width: 52px; height: 52px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); cursor: zoom-in; flex: none; background: var(--surface-2); }
  .arc-lines { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .arc-line { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; }
  .arc-line .d { color: var(--debit-text); } .arc-line .c { color: var(--credit-text); }
  .arc-line .sm { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .arc-line .amt { font-family: "Roboto Mono", monospace; }
  .arc-actions { display: flex; gap: 8px; justify-content: flex-end; }
  /* 月ごとの見出し（新しい月から） */
  .arc-month { font-size: 13px; font-weight: 700; color: var(--muted); padding: 6px 2px 0; display: flex; gap: 8px; align-items: baseline; }
  .arc-month span { font-weight: 400; font-size: 12px; }
  .arc-head .arc-range { color: var(--muted); font-size: 12.5px; }
  .arc-head .arc-chev { width: 16px; height: 16px; color: var(--muted); flex: none; transition: transform .15s; }
  .arc-item.open .arc-chev { transform: rotate(90deg); }
  /* 複合仕訳の＋・－と、完了 */
  /* ＋：ほかのボタンと同じ白い角丸に、線のアイコン（借方は紺、貸方は茶） */
  .btn.add-line { width: 30px; min-width: 30px; height: 30px; padding: 0; justify-content: center; border-radius: 7px; }
  .btn.add-line svg { width: 15px; height: 15px; flex: none; }
  .add-line.debit { color: var(--debit-text); }
  .add-line.credit { color: var(--credit-text); }
  .act-spacer { flex: 1; }
  .add-wrap { display: flex; gap: 6px; margin-top: 8px; }
  .add-wrap.credit { justify-content: flex-end; }
  td.c-add { display: none; }
  .v-no { display: none; }
  .v-actions { align-items: center; gap: 6px; flex-wrap: wrap; }
  /* －：塊の右上の、項目名と同じ行に置く（枠にも入力欄にもかからない） */
  td.has-minus { position: relative; }
  /* ＋と同じ大きさ（30px） */
  .line-del { position: absolute; top: 2px; right: 2px; width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--surface);
    color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; z-index: 1; }
  .line-del svg { width: 15px; height: 15px; }
  .line-del:hover, .line-del:active { color: var(--err); border-color: #f0c4c4; background: var(--err-soft); }
  /* ⋮⋮：つかんで上下に動かすと、塊の順番を入れ替える（－の左） */
  .line-move { position: absolute; top: 2px; right: 38px; width: 30px; height: 30px; border-radius: 7px; border: none; background: none;
    color: var(--muted); display: grid; place-items: center; cursor: grab; padding: 0; z-index: 1; touch-action: none; }
  .line-move svg { width: 16px; height: 16px; }
  .line-move:hover { color: var(--text); }
  body.block-dragging, body.block-dragging * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
  /* 動かしている塊：元の場所は薄くし、指（マウス）に札を付いてこさせる。入る場所には金色の線 */
  td.drag-from { opacity: .35; }
  .drag-ghost { position: fixed; z-index: 50; pointer-events: none; min-width: 160px; max-width: 260px; padding: 9px 12px; border-radius: 10px;
    border: 1.5px solid var(--gold); box-shadow: 0 10px 28px rgba(13, 22, 41, .22); font-size: 13px; line-height: 1.5; transform: rotate(-1.5deg); }
  .drag-ghost.debit { background: var(--debit); color: var(--debit-text); }
  .drag-ghost.credit { background: var(--credit); color: var(--credit-text); }
  .drag-ghost b { font-weight: 600; display: block; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drag-ghost span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td.drop-here { box-shadow: inset 0 0 0 2px var(--gold); }
  .drop-line { position: fixed; z-index: 49; height: 4px; border-radius: 2px; background: var(--gold); pointer-events: none; }
  /* 入れ替えた塊を、少しの間光らせる */
  @keyframes justMoved { from { box-shadow: inset 0 0 0 2px var(--gold); background-color: var(--gold-light); } to { box-shadow: inset 0 0 0 2px transparent; } }
  td.just-moved { animation: justMoved 1.6s ease-out; }
  tr.locked td.s-debit, tr.locked td.s-credit, tr.locked td.c-date { opacity: .7; }
  td input:disabled, td select:disabled, td textarea:disabled { color: var(--text); -webkit-text-fill-color: var(--text); opacity: 1; }
  .tabs { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }

    /* －は、項目名の行の右に収める（項目名の行を少し高くして、入力欄と重ならないようにする） */
    /* ⋮⋮（左）と－（右）は、項目名の上の段に置く（項目名が改行されないように）。ないほうの側も同じだけ空けて、借方と貸方の欄をそろえる */

    tbody tr.row-receipt td.s-debit input, tbody tr.row-receipt td.s-debit select,
    tbody tr.row-receipt td.s-credit input, tbody tr.row-receipt td.s-credit select { background: #fff; }
    /* 削除・移動は、各仕訳のいちばん下の右に、文字付きのボタンで出す */
    td.c-del { grid-column: 1 / -1 !important; order: 3; margin-top: 10px; }
    td.c-del .row-actions { justify-content: flex-end; gap: 8px; }
    td.c-del .btn-sm { height: 34px; border-radius: 8px; font-size: 13px; }
    td.c-del .icon-btn { width: auto; height: 34px; padding: 0 12px; gap: 5px; display: inline-flex; align-items: center;
      border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); font: inherit; font-size: 13px; color: var(--text); }
    td.c-del .icon-btn.del { color: var(--err); border-color: #f0c4c4; }
    td.c-del .act-label { display: inline; }
    td[data-label]::before { content: attr(data-label); display: block; font-size: 11px; color: var(--muted); }
    td input, td select { border-color: var(--line); height: 40px; font-size: 16px; }
    td textarea.summary-box { border-color: var(--line); font-size: 16px; background: #fff; min-height: 40px; padding-top: 8px; padding-bottom: 8px; }
    .code-box { --cw: 9.6px; } .code-box .code-name { font-size: 13px; left: calc(var(--len) * var(--cw) + 12px); right: 6px; }
    .code-box::after { display: none; } .code-box input { padding-right: 7px; }
    td input[type="date"] { line-height: 38px; }
    tbody td { min-width: 0; }
    tfoot tr { display: flex; justify-content: space-between; padding: 12px 14px; }
    tfoot td { width: auto; padding: 0; }
    tfoot td.hide-sm { display: none; }
    .mobile-capture { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: var(--surface); border-top: 1px solid var(--line); z-index: 20; }
    .mobile-capture .btn { height: 48px; justify-content: center; font-size: 15px; }
    .toast { bottom: calc(90px + env(safe-area-inset-bottom)); }
    .tabs { width: 100%; }
    .tab { flex: 1; justify-content: center; padding: 7px 4px; }
    .row-actions .btn-sm { height: 32px; }
  }

  @media (max-width: 860px) {
    .topbar { background: var(--sidebar); backdrop-filter: none; -webkit-backdrop-filter: none; }
    .content { padding: 16px 16px 110px; }
    .page-head h1 { font-size: 22px; }
    .company-select select { min-width: 0; }
    .methods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; gap: 2px; }
    .method { padding: 8px 4px; font-size: 12px; }
    .doc-types { margin: 0 0 14px; }
    .doc-type { padding: 7px 4px; }
    #companiesView .company-list { padding: 12px; }
    #companiesView .company-item { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 32px; gap: 10px 8px; padding: 14px 14px; }
    #companiesView .co-main { grid-column: 1 / 3; padding-left: 6px; }
    #companiesView .company-item .btn-sm { grid-row: 2; height: 38px; justify-content: center; }
    #companiesView .company-item .open-master { grid-column: 1 / 4; }
    #companiesView .company-item .icon-btn { grid-column: 3; grid-row: 1; }
    #companiesView .co-main input { max-width: none; font-size: 16px; }
    .mobile-capture .btn { border-radius: 12px; }
    .dropzone .btn, .add-more { display: none; }
    #companySearch { order: 3; width: 100%; margin: 0; font-size: 16px; height: 38px; }
    #openAddCompany { margin-left: auto; }
    /* iPhoneは16px未満の入力欄を触ると画面を拡大するので、スマホの入力欄はすべて16pxにする */
    input, select, textarea { font-size: 16px !important; }
    .std-tools .tabs { width: 100%; }
    .std-tools select, .std-tools input { width: 100%; font-size: 16px; }
    .std-row { padding: 9px 14px; }
    .master-row.stdmap { grid-template-columns: 60px minmax(0, 1fr) 72px 32px; row-gap: 0; }
    .master-row.stdmap > span { grid-column: 3 / 5; grid-row: 2; font-size: 11px; padding-left: 6px; }
    #standardsView .panel-head .btn { flex: 1 1 auto; justify-content: center; }
    .std-row.map { grid-template-columns: 44px minmax(0, 1fr) 14px 48px minmax(0, 1fr); gap: 6px; font-size: 13px; }
    body.web .mobile-capture { grid-template-columns: 1fr; }
    body.web .mobile-capture label.btn { background: var(--primary); border-color: var(--primary); color: #fff; }
  }
  /* PC：確認画面の表が横に長いので、列を少し詰め、完了・削除の列は右端に固定して、いつも見えるようにする */
  @media (min-width: 861px) {
    td.c-date { width: 118px; }
    td.c-acct { width: 140px; min-width: 140px; }
    td.c-code:not(.c-acct) { min-width: 56px; }
    td.c-amount { width: 96px; min-width: 92px; }
    td.c-tax, td.c-rate { width: 70px; min-width: 70px; }
    td.c-biz { width: 108px; min-width: 108px; }
    td.c-summary { min-width: 140px; }
    #list td.c-del, #list thead tr > th:last-child { position: sticky; right: 0; z-index: 2; background: var(--surface); box-shadow: -8px 0 8px -8px rgba(15, 23, 42, .28); }
  }
</style>
</head>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><img class="brand-mark" src="apple-touch-icon.png" alt="">仕訳の神様</div>
    <nav class="nav">

      <a href="#" data-view="archive"><svg><use href="#i-box"/></svg>保管庫</a>
    </nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="brand mobile-brand" style="padding:0"><img class="brand-mark" src="apple-touch-icon.png" alt="">仕訳の神様</div>

        <button data-view="archive">保管庫</button>
      </nav>
      <div class="crumb" id="crumb"><b>取り込み</b></div>
    </div>

    <div class="content">
     <section id="importView">
      <div class="page-head">
        <div>
          <h1>取り込み</h1>
          <!-- 会社の選択（名前で検索できる） -->
          <div class="co-picker" id="coPicker">
            <button class="co-picker-btn" id="coPickerBtn" aria-haspopup="listbox"><span id="coPickerName"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
            <div class="co-picker-menu" id="coPickerMenu" hidden>
              <input type="search" id="coPickerSearch" placeholder="会社名で検索" autocomplete="off">
              <div class="co-picker-list" id="coPickerList" role="listbox"></div>
              <button class="co-picker-add" id="coPickerAdd">＋ 会社を追加</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 取り込み方法は会社の「取り込むもの」で決まるので、切り替えは出さない --><div class="methods" id="methods" role="tablist" aria-label="取り込み方法" hidden>
        <button class="method" data-method="receipt"><span class="method-no">①</span>原始資料</button>
        <button class="method" data-method="format2"><span class="method-no">②</span>日計表</button>
        <button class="method" data-method="format3"><span class="method-no">③</span>試算表入力</button>
      </div>
      <!-- ①原始資料の種類（レシート・領収書／給与台帳／通帳） -->
      <div class="doc-types" id="docTypes" role="tablist" aria-label="原始資料の種類">
        <!-- 種類は、会社を選ぶ欄と同じ形で選ぶ（下のボタンは使わないが、選んでいる種類の名前を取るために残す） -->
        <div class="co-picker doc-picker" id="docPicker">
          <button class="co-picker-btn" id="docPickerBtn" aria-haspopup="listbox"><span id="docPickerName"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
          <div class="co-picker-menu" id="docPickerMenu" hidden><div class="co-picker-list" id="docPickerList" role="listbox"></div></div>
        </div>
        <button class="doc-type" data-doc="receipt">出金領収書</button>
        <button class="doc-type" data-doc="income">入金領収書</button>
        <button class="doc-type" data-doc="passbook">通帳</button>
        <button class="doc-type" data-doc="purchase">仕入請求書</button>
        <button class="doc-type" data-doc="sales">売上請求書</button>
        <button class="doc-type" data-doc="payroll">給与台帳</button>
        <button class="doc-type" data-doc="card">クレジット明細</button>

        <span id="methodSoonNote">準備中</span>
      </section>

      <div class="banner" id="ocrBanner" hidden></div>


      <div class="panel" id="panel">

          <span class="panel-title">読み取り結果</span>

          <div class="trial-bar" id="trialBar" hidden>

            <label class="field">伝票日付<input type="date" id="trialDate"></label>

          <button class="btn add-more" id="addMore" hidden><svg><use href="#i-upload"/></svg>ファイルを追加</button>
          <button class="btn btn-primary" id="download"><svg><use href="#i-download"/></svg><span>CSVダウンロード</span></button>
        </div>
        <div id="list"></div>
      </div>
     </section>

    <div class="master-list" id="masterList"></div>
    <!-- 追加・読み込み・絞り込みはあまり使わないので、一覧の下に置く -->
    <div class="master-tools master-tools-below">
      <button class="btn btn-sm" id="masterAdd">＋ 追加</button>
      <label class="btn btn-sm" id="masterImportBtn">ファイルから読み込む<input type="file" id="masterImport" accept=".csv,.xlsx,.xlsm,.xls,text/csv,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden></label>

      <summary>その他</summary>
      <div class="master-csv-body">
        <button class="btn btn-sm" id="masterReset">すべて消す</button>

<script src="vendor/encoding.min.js"></script>
<script type="module">
// お客さんのデータ（画像・試算表・マスタ・仕訳）は、この端末の外へ送らない。読み取りも端末の中だけで行う
// 以前の版で保存されたかもしれない外部AI用のAPIキーは消しておく
try { localStorage.removeItem("shiwake-api-key"); } catch {}
const STORAGE_KEY = "receipt-rows-v1";
const COMPANIES_KEY = "shiwake-companies";
const CURRENT_COMPANY_KEY = "shiwake-current-company";
const SETTINGS_KEY = "receipt-settings-v1";
const MAX_PARALLEL_OCR = 1; // 端末内OCRはスマホの負荷が高いので1枚ずつ
// ---- 取り込めるファイルの形式（取り込むもの × Web版／iPhoneアプリ） ----
// 画面の表示と「ファイルを選ぶ」で選べる種類は、すべてここから作る。
// Web版の文字読み取りは精度が低いので、写真・PDFは読まない（iPhoneアプリで読む）。Web版で読めるのは試算表のExcel・CSVだけ
const FILE_TYPES = {
  写真: "image/*",
  PDF: "application/pdf,.pdf",
  Excel: ".xlsx,.xlsm,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel",
  CSV: ".csv,text/csv",
};
// 読み込める形式は、どの資料も同じ：iPhoneアプリは 写真・PDF・Excel・CSV、PC（Web版）は Excel・CSV
//   写真・PDFは文字の読み取りが要るので、正確に読める iPhone アプリだけ
const ALL_TYPES = { web: ["Excel", "CSV"], app: ["写真", "PDF", "Excel", "CSV"] };
const IMPORT_FORMATS = {
  receipt: { name: "出金領収書", ...ALL_TYPES },
  format2: { name: "日計表", ...ALL_TYPES },
  format3: { name: "試算表", ...ALL_TYPES },
  // 原始資料のうち、出金領収書以外の種類（取り込み方法が「原始資料」のとき、選んだ種類で決まる）
  income: { name: "入金領収書", ...ALL_TYPES },
  purchase: { name: "仕入請求書", ...ALL_TYPES },
  sales: { name: "売上請求書", ...ALL_TYPES },
  card: { name: "クレジット明細", ...ALL_TYPES },
  cashbook: { name: "現金出納帳", ...ALL_TYPES },
  passbook: { name: "通帳", ...ALL_TYPES },
  payroll: { name: "給与台帳", ...ALL_TYPES },
};
function importFormat(method) {
  const key = method || settings.method || "receipt";
  const f = (key === "receipt" && settings.docType !== "receipt" && IMPORT_FORMATS[settings.docType]) || IMPORT_FORMATS[key] || IMPORT_FORMATS.receipt;
  return { ...f, types: NATIVE ? f.app : f.web };
}

/** 1行 = 1仕訳。thumb は一覧用の小さい画像（localStorage）、大きい画像は IndexedDB に保存 */
let rows = load(STORAGE_KEY, []);
// 以前の＋で足した塊は、書類の種類（通帳・給与台帳）の印が付いていなかったので、同じ仕訳の塊から引き継ぐ
{ const docOf = new Map(rows.filter(r => r.doc && r.vid).map(r => [r.vid, r.doc]));
  for (const r of rows) if (!r.doc && r.vid && docOf.has(r.vid)) r.doc = docOf.get(r.vid);
  // 通帳の科目（預金）の側の事業者区分は「－」にした（まだ完了していない行もそろえる）
  for (const r of rows) if (r.doc === "passbook" && r.bankSide && !r.locked && r.review !== "exported") {
    const side = r.bankSide === "d" ? "debit" : "credit";
    if (r[side + "Biz"] === "課税事業者") r[side + "Biz"] = "";
  } }
const fullImages = new Map(); // groupId -> dataURL（読み込み済みの大きい画像のキャッシュ）
// 読み取り専用の、さらに大きい画像（小さい文字をつぶさないため）。読み取りが終わったら捨てる
const ocrImages = new Map();
const OCR_MAX_SIDE = 3000;

// 大きい画像の保存場所（localStorage は容量が小さいため IndexedDB を使う）
const imageStore = (() => {
  let dbPromise = null;
  const open = () => dbPromise ||= new Promise((resolve, reject) => {
    const req = indexedDB.open("shiwake-images", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("images");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction("images", mode);
      const req = fn(tx.objectStore("images"));
      tx.oncomplete = () => resolve(req.result);
      tx.onerror = () => reject(tx.error);
    });
  };
  return {
    get: key => run("readonly", st => st.get(key)),
    put: (key, value) => run("readwrite", st => st.put(value, key)),
    del: key => run("readwrite", st => st.delete(key)),
    keys: () => run("readonly", st => st.getAllKeys()),
  };
})();
async function getFullImage(groupId) {
  if (fullImages.has(groupId)) return fullImages.get(groupId);
  try {
    let src = await imageStore.get(groupId);
    if (!src && window.__shiwakeSync) { src = await window.__shiwakeSync.fetchImage(groupId); if (src) imageStore.put(groupId, src).catch(() => {}); }
    if (src) fullImages.set(groupId, src);
    return src || null;
  } catch { return null; }
}
// どの仕訳からも使われなくなった画像を消す
// 保管庫：CSVに書き出した仕訳（写真は groupId で端末の中に残す）
const ARCHIVE_KEY = "shiwake-archive"; // [{ id, companyId, source, docName, savedAt, fileName, csv, encoding, rows }]
let archives = load(ARCHIVE_KEY, []);
async function pruneImages() {
  try {
    const used = new Set([...rows.map(r => r.groupId), ...archives.flatMap(a => a.rows.map(r => r.groupId))]); // 保管庫の写真も残す
    for (const key of await imageStore.keys()) if (!used.has(key)) await imageStore.del(key);
    for (const key of fullImages.keys()) if (!used.has(key)) fullImages.delete(key);
    for (const key of ocrImages.keys()) if (!used.has(key)) ocrImages.delete(key);
  } catch {}
}
let queue = [];
let running = 0;

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(rows.filter(r => r.status !== "reading"))); } catch {}
  window.__shiwakeSync?.queue(); // 携帯とPCの同期（使っているときだけ）
}
// ---- 会社 ----
let companies = load(COMPANIES_KEY, []);
// 以前は会計ソフトが未設定だとPCA会計として扱っていたので、試算表の会社はPCA会計を選んだことにする
for (const c of companies) if (c.method === "format3" && c.system === undefined) c.system = "pca";
let currentCompanyId = load(CURRENT_COMPANY_KEY, null);
function saveCompanies() {
  try {
    localStorage.setItem(COMPANIES_KEY, JSON.stringify(companies));
    localStorage.setItem(CURRENT_COMPANY_KEY, JSON.stringify(currentCompanyId));
  } catch {}
  window.__shiwakeSync?.queue();
}
const currentCompany = () => companies.find(c => c.id === currentCompanyId) || null;
// 取り込み方法（①レシート ②③…）ごとに一覧を分けて管理する
const currentSource = () => settings.method || "receipt";
// 原始資料は、書類の種類（出金領収書・通帳・給与台帳…）ごとに別の一覧にする
const companyRows = () => rows.filter(r => r.companyId === currentCompanyId && (r.source || "receipt") === currentSource()
  && (currentSource() !== "receipt" || (r.doc || "receipt") === (settings.docType || "receipt")));
const countFor = id => rows.filter(r => r.companyId === id && r.status === "done").length;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// ---- 設定 ----
const settings = Object.assign({ dateFormat: "slash", encoding: "sjis", includeHeader: true }, load(SETTINGS_KEY, {}));
for (const key of ["dateFormat", "encoding"]) {
  const el = document.getElementById(key);
  el.value = settings[key];
  el.onchange = () => { settings[key] = el.value; saveSettings(); };
}
const headerBox = document.getElementById("includeHeader");
headerBox.checked = settings.includeHeader;
headerBox.onchange = () => { settings.includeHeader = headerBox.checked; saveSettings(); };
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {} }

// ---- 画像の取り込み ----
for (const input of document.querySelectorAll(".file-picker, .file-camera")) {
  input.onchange = e => { addFiles(e.target.files); e.target.value = ""; };
}
// PC はドラッグ＆ドロップでも取り込める
let dragDepth = 0;
addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
  addFiles([...e.dataTransfer.files].filter(f => f.type.startsWith("image/")));
});

async function addFiles(fileList) {
  let files = Array.from(fileList);
  if (!files.length) return;
  if (settings.method === TRIAL_SOURCE) return importTrial(files);
  if ((settings.method || "receipt") === "receipt" && settings.docType === "passbook") return importPassbook(files);
  if ((settings.method || "receipt") === "receipt" && settings.docType === "cashbook") return importPassbook(files, "cashbook");
  if ((settings.method || "receipt") === "receipt" && settings.docType === "payroll") return importPayroll(files);
  if ((settings.method || "receipt") === "receipt" && settings.docType === "card") return importCard(files);
  const listDoc = (settings.method || "receipt") === "receipt" ? settings.docType || "receipt" : settings.method === NIKKEI_SOURCE ? "nikkei" : "";
  if (["receipt", "income", "purchase", "sales", "nikkei"].includes(listDoc) && files.some(isSheetFile)) {
    await importListSheet(files.filter(isSheetFile), listDoc);
    files = files.filter(f => !isSheetFile(f));
    if (!files.length) return;
    if (!NATIVE) { alert("写真・PDFは、iPhoneアプリで読み取れます。PCではExcel・CSVを読み込めます。"); return; }
  }
  if (settings.method === NIKKEI_SOURCE) return importNikkei(files);
  if ((settings.method || "receipt") !== "receipt" || !["receipt", "income", "purchase", "sales"].includes(settings.docType || "receipt")) {
    alert("この取り込み方法は準備中です。");
    return;
  }
  if (!currentCompany()) {
    alert("先に会社を登録・選択してください。");
    openCompanies();
    return;
  }
  // PDFは1ページずつ画像にして、1ページを1枚の領収書として読む
  const images = [];
  for (const file of files) {
    if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) {
      try { for (const page of await pdfToImages(file)) images.push(Object.assign(await dataUrlToBlob(page), { name: file.name })); }
      catch (err) { alert(`${file.name}: PDFを開けませんでした`); }
    } else images.push(file);
  }
  for (const file of images) {
    const groupId = uid();
    try {
      const [full, thumb, forOcr] = await Promise.all([
        resize(file, 1600, 0.85),
        resize(file, 240, 0.7),
        // iPhoneアプリの文字認識は大きい画像のほうが正確（Web版の文字認識は重くなるので保存用と同じ大きさ）
        NATIVE ? resize(file, OCR_MAX_SIDE, 0.9) : null,
      ]);
      fullImages.set(groupId, full);
      if (forOcr) ocrImages.set(groupId, forOcr);
      imageStore.put(groupId, full).catch(() => {});
      rows.push({ id: uid(), groupId, companyId: currentCompanyId, source: "receipt", ...(["income", "purchase", "sales"].includes(settings.docType) ? { doc: settings.docType } : {}), thumb, status: "reading" });
      queue.push(groupId);
    } catch (err) {
      alert(`${file.name}: ${err.message}`);
    }
  }
  render();
  pump();
}

function resize(file, maxSide, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => reject(new Error("画像を開けませんでした"));
    img.src = URL.createObjectURL(file);
  });
}

function pump() {
  const limit = MAX_PARALLEL_OCR;
  while (running < limit && queue.length) {
    const groupId = queue.shift();
    running++;
    readGroup(groupId).finally(() => { running--; pump(); });
  }
}

async function readGroup(groupId) {
  const placeholder = rows.find(r => r.groupId === groupId && r.status === "reading");
  try {
    const image = ocrImages.get(groupId) || await getFullImage(groupId);
    if (!image) throw new Error("画像が見つかりません。もう一度撮影してください");
    const data = { receipts: await readReceiptFree(image) };

    const idx = rows.indexOf(placeholder);
    if (idx < 0) return; // 読み取り中に削除された
    const receipts = data.receipts.length ? data.receipts
      : [{ date: "", amount: 0, summary: "", note: "レシートを検出できませんでした" }];
    const rc = receiptSettingsOf(placeholder.companyId);
    const newRows = receipts.flatMap(r => {
      // 8%と10%の品物が混ざっていれば、諸口を使った複合仕訳にする
      //   借方 科目（8%の対象額） ／ 貸方 諸口
      //   借方 科目（10%の対象額）／ 貸方 諸口
      //   借方 諸口（合計）       ／ 貸方 現金など
      // 対象額が読めなかった時も3行に分け、8%と10%の金額は空にしておく（手で入れる）
      // 金額はすべて税込。8%と10%の合計が、領収書の合計と必ず一致するようにする
      const hint = receiptTaxHint(r.ocrText);
      if (!hint.mixed || placeholder.doc === "income" || placeholder.doc === "sales") return [r];
      const sp = splitByRate(r.ocrText);
      let total = Number(r.amount) || 0, r8 = "", r10 = "", off = "";
      if (sp && !total) { r8 = sp.r8; r10 = sp.r10; total = r8 + r10; }
      else if (sp && sp.r8 + sp.r10 === total) { r8 = sp.r8; r10 = sp.r10; }
      else if (sp && Math.abs(Math.round(sp.r8 * 1.08) + Math.round(sp.r10 * 1.1) - total) <= 2) { r8 = Math.round(sp.r8 * 1.08); r10 = total - r8; } // 税抜で書かれていた
      else if (sp && sp.r8 < total) { r8 = sp.r8; r10 = total - r8; off = "8%と10%の金額を確かめてください"; }
      else off = "8%の金額を入れてください（10%は合計との差で入ります）";
      return [
        { ...r, amount: r8, reduced: true, split: true, splitRole: "r8", creditShokuchi: true, note: [r.note, off].filter(Boolean).join("／") },
        { ...r, amount: r10, reduced: false, split: true, splitRole: "r10", creditShokuchi: true },
        { ...r, amount: total || "", split: true, splitRole: "total", debitShokuchi: true },
      ];
    }).map(r => ({
      id: uid(), groupId, companyId: placeholder.companyId, source: placeholder.source || "receipt", thumb: placeholder.thumb, status: "done", review: "pending",
      store: r.store || "", item: r.item || "", bizV2: true, bizV3: true,
      date: r.date || "",
      debitCode: r.debitShokuchi ? shokuchiOf(placeholder.companyId) : receiptDebitCode(placeholder.companyId, r.store, r.summary || r.store), debitSub: "", debitAmount: r.amount || "",
      summary: r.summary || r.store || "",
      creditCode: r.creditShokuchi ? shokuchiOf(placeholder.companyId) : payCodeOf(placeholder.companyId, r.ocrText, rc), creditSub: "", creditAmount: r.amount || "",
      note: [r.note, receiptTaxHint(r.ocrText).mixed && !r.split ? "8%と10%の品物が混ざっています" : "", receiptTaxHint(r.ocrText).noInvoice && !r.debitShokuchi ? "登録番号（T＋13桁）が見つかりません" : "",
        (!r.splitRole || r.splitRole === "r8") && paidByCard(r.ocrText) ? "クレジット払いの領収書です（クレジット明細で取り込む場合は削除）" : ""].filter(Boolean).join("／"),
      ocrText: r.ocrText || "",
      ...(r.splitRole ? { splitRole: r.splitRole } : {}),
      taxHint: r.reduced === undefined ? receiptTaxHint(r.ocrText) : { ...receiptTaxHint(r.ocrText), reduced: r.reduced, split: true },
    }));
    // 入金領収書は出金領収書の逆：借方 現金 ／ 貸方 相手の科目（宛名の取引先から覚えた科目）。摘要は宛名と但し書き
    if (placeholder.doc === "income") for (const r of newRows) {
      const payee = extractPayee(String(r.ocrText || "").split("\n"));
      Object.assign(r, { doc: "income", store: payee, debitCode: incomeCashCode(r.companyId), creditCode: incomeCreditCode(r.companyId, payee, r.item),
        summary: [payee, r.item].filter(Boolean).join(" "), taxHint: {}, note: "" });
      r.creditSummary = r.summary;
    }
    // 仕入請求書：借方 仕入高など（請求元ごとに覚えた科目）／貸方 買掛金（請求元ごとに覚えた科目。未払金など）
    if (placeholder.doc === "purchase") {
      const sk = shokuchiOf(placeholder.companyId);
      for (const r of newRows) {
        const rule = purchaseRule(r.companyId, r.store, r.item);
        r.doc = "purchase";
        if (r.debitCode !== sk) r.debitCode = rule?.code || purchaseDefault(r.companyId, "debit");
        if (r.creditCode !== sk) r.creditCode = rule?.creditCode || purchaseDefault(r.companyId, "credit");
        r.note = String(r.note || "").split("／").filter(n => n && !/クレジット払い/.test(n)).join("／");
      }
    }
    // 売上請求書：借方 売掛金 ／ 貸方 売上高（宛名の取引先ごとに覚えた科目）。8%と10%が混ざっていれば、貸方を分ける
    //   借方 売掛金（合計）／ 貸方 諸口、借方 諸口 ／ 貸方 売上高（8%）、借方 諸口 ／ 貸方 売上高（10%）
    if (placeholder.doc === "sales") {
      const out = [];
      for (const r of newRows) {
        const payee = extractPayee(String(r.ocrText || "").split("\n")), rule = salesRule(r.companyId, payee, r.item);
        const deb = rule?.code || salesDefault(r.companyId, "debit"), cre = rule?.creditCode || salesDefault(r.companyId, "credit");
        const summary = [payee, r.item].filter(Boolean).join(" ");
        const base = { ...r, doc: "sales", store: payee, summary, creditSummary: summary, taxHint: {}, note: "" };
        if (!receiptTaxHint(r.ocrText).mixed) { out.push({ ...base, debitCode: deb, creditCode: cre }); continue; }
        const sp = splitAmounts(r.ocrText, r.debitAmount), vid = base.id;
        const blank = { debitCode: "", debitAmount: "", creditCode: "", creditAmount: "" };
        out.push({ ...base, ...blank, vid, line: "d", debitCode: deb, debitAmount: sp.total || "", note: sp.off });
        out.push({ ...base, ...blank, id: uid(), vid, line: "c", thumb: "", creditCode: cre, creditAmount: sp.r8, taxHint: { reduced: true } });
        out.push({ ...base, ...blank, id: uid(), vid, line: "c", thumb: "", creditCode: cre, creditAmount: sp.r10, taxHint: { reduced: false } });
      }
      newRows.splice(0, newRows.length, ...out);
    }
    newRows.forEach(setAutoTaxBoth);
    rows.splice(idx, 1, ...newRows);
    ocrImages.delete(groupId);
  } catch (err) {
    if (placeholder) Object.assign(placeholder, { status: "error", error: err.message });
  }
  save();
  render();
}

// ---- 無料モード：端末内OCR（Tesseract.js）＋ルールで項目を抜き出す ----
let ocrWorkerPromise = null;
function getOcrWorker() {
  if (!ocrWorkerPromise) {
    const banner = document.getElementById("ocrBanner");
    banner.textContent = "文字認識の準備をしています（初回のみ数MBのデータを読み込みます）…";
    banner.hidden = false;
    // ブラウザ内の文字読み取りの部品は、使うときだけ読み込む（今はWeb版で読み取りをしないので、ふだんは読み込まない）
    ocrWorkerPromise = (window.Tesseract ? Promise.resolve() : loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js"))
      .then(() => Tesseract.createWorker("jpn"))
      .then(async worker => {
        await worker.setParameters({ tessedit_pageseg_mode: "6", preserve_interword_spaces: "1" });
        return worker;
      })
      .catch(err => { ocrWorkerPromise = null; throw new Error("文字認識の準備に失敗しました。電波の良い場所で再読み取りしてください"); })
      .finally(() => { banner.hidden = true; });
  }
  return ocrWorkerPromise;
}

// OCR向けに白黒化・コントラスト強調した画像を作る
function preprocessForOcr(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(2, 1800 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const px = ctx.getImageData(0, 0, c.width, c.height);
      const d = px.data;
      // 明るさの分布の両端を切ってコントラストを広げる（感熱紙の薄い文字対策）
      const hist = new Uint32Array(256);
      const gray = new Uint8ClampedArray(d.length / 4);
      for (let i = 0, j = 0; i < d.length; i += 4, j++) {
        gray[j] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        hist[gray[j]]++;
      }
      const total = gray.length;
      let lo = 0, hi = 255, acc = 0;
      while (lo < 255 && (acc += hist[lo]) < total * 0.02) lo++;
      acc = 0;
      while (hi > 0 && (acc += hist[hi]) < total * 0.02) hi--;
      const range = Math.max(1, hi - lo);
      for (let i = 0, j = 0; i < d.length; i += 4, j++) {
        const v = ((gray[j] - lo) * 255) / range;
        d[i] = d[i + 1] = d[i + 2] = v;
      }
      ctx.putImageData(px, 0, 0);
      resolve(c);
    };
    img.onerror = () => reject(new Error("画像を開けませんでした"));
    img.src = dataUrl;
  });
}

// 全角英数字→半角、日本語の文字間に入る余計な空白を除去
function normalizeText(text) {
  return text
    .replace(/[０-９Ａ-Ｚａ-ｚ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/[，]/g, ",").replace(/[．]/g, ".").replace(/[／]/g, "/").replace(/[：]/g, ":")
    .replace(/[¥￥]/g, "¥")
    .replace(/([^\x00-\x7F])[ \t]+(?=[^\x00-\x7F])/g, "$1")
    .replace(/(\d)[ \t]+(?=[\d,])/g, "$1")
    .replace(/,[ \t]+(?=\d)/g, ",")
    // 「5.,500」「5 ,500」「5、500」のように崩れた桁区切りを「5,500」に直す
    .replace(/(\d)[ \t]*[,.、]{1,2}[ \t]*(?=\d{3}(?!\d))/g, "$1,");
}

function validDate(y, m, d) {
  const dt = new Date(y, m - 1, d);
  return y >= 2000 && y <= 2100 && dt.getMonth() === m - 1 && dt.getDate() === d;
}
const pad = n => String(n).padStart(2, "0");

function extractDate(text) {
  // 日付と時刻の間の空白が読み取りで消えて「26/09/2609:00:47」のようにくっつくことがあるので、時刻の前に空白を入れる
  text = text.replace(/(\d)(\d{1,2}:\d{2}(?::\d{2})?)/g, "$1 $2");
  const candidates = [];
  const push = (y, m, d) => { if (validDate(y, m, d)) candidates.push(`${y}-${pad(m)}-${pad(d)}`); };
  for (const m of text.matchAll(/(20\d{2})\s*[年/.\-]\s*(\d{1,2})\s*[月/.\-]\s*(\d{1,2})/g)) push(+m[1], +m[2], +m[3]);
  for (const m of text.matchAll(/(?:令和|R)\s*(\d{1,2}|元)\s*[年/.\-]\s*(\d{1,2})\s*[月/.\-]\s*(\d{1,2})/g))
    push(2018 + (m[1] === "元" ? 1 : +m[1]), +m[2], +m[3]);
  if (!candidates.length) {
    for (const m of text.matchAll(/(?<!\d)(\d{2})[/.](\d{1,2})[/.](\d{1,2})(?!\d)/g)) push(2000 + +m[1], +m[2], +m[3]);
  }
  const today = new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Tokyo" });
  return candidates.find(c => c <= today) || candidates[0] || "";
}

function amountsIn(line) {
  // 「1,280」「¥1280」「1.280」（OCRでカンマが点になる場合）などを拾う
  return [...line.matchAll(/¥?\s*(\d{1,3}(?:[,.]\d{3})+|\d{1,7})(?![\d%])/g)]
    .map(m => Number(m[1].replace(/[,.]/g, "")))
    .filter(n => n > 0 && n < 10000000);
}

function extractAmount(lines) {
  const exclude = /小計|お?預|釣|つり|税率|対象|内税|外税|消費税|点数|ポイント|電話|TEL|No\.|番号/i;
  const priorities = [/合\s*計|総\s*額|ご?請求/, /お買上|お買い上げ|領収金額|お支払|支払金額|金\s*額|^金\s*[¥\d]|円也/, /(?<!小)計/];
  for (const re of priorities) {
    for (let i = 0; i < lines.length; i++) {
      if (!re.test(lines[i]) || exclude.test(lines[i])) continue;
      // 金額が同じ行になければ次の行を見る
      const nums = amountsIn(lines[i].replace(/.*?(合\s*計|総\s*額|請求|お買上|お買い上げ|領収金額|お支払|支払金額|金\s*額|^金|計)/, ""));
      const found = nums.length ? nums : amountsIn(lines[i + 1] || "");
      if (found.length) return Math.max(...found);
    }
  }
  // キーワードが読めなかった場合は「¥」付きの最大の金額
  const yen = lines.filter(l => /¥/.test(l) && !/お?預|釣|つり/.test(l)).flatMap(amountsIn);
  return yen.length ? Math.max(...yen) : 0;
}

// 店名: レシート上部の行に「店名らしさ」の点数をつけて、一番高い行を選ぶ。
// 一番上はロゴ（英字や崩れた文字）のことが多いので、日本語の店名の行を優先する
function extractStore(lines, confs = []) {
  // 宛名（〜様・〜御中）、但し書き、金額・日付・住所の行は店名にしない
  const skipRe = /領収|レシート|売上票|伝票|控え|明細|いらっしゃ|ありがと|毎度|TEL|電話|〒|登録番号|様$|御中$|^但|上記|金額|合計|¥|\d\s*円|円也|^金\s|運転手|担当|レジ|\d{4}年|令和|\d{1,2}[/.]\d{1,2}|[都道府県].*[市区町村郡]|^[\d\s\-:/.,¥]+$/i;
  const skip = { test: l => skipRe.test(l) || ADDRESS_RE.test(l) }; // 住所の行も店名にしない
  const japanese = /[\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Han}]/u;
  // 店の情報（電話・住所・登録番号）の行。店名はこの近くにあることが多い
  const storeInfo = /TEL|電話|登録番号|〒|[都道府県].*[市区町村郡]/i;
  const clean = line => line.replace(/[^\p{L}\p{N}ー・&\-\s]/gu, "").replace(/\s+/g, " ").trim()
    .replace(/(?<=[\p{Script=Katakana}\p{Script=Han}ー])[A-Za-z]$/u, "");      // 日本語の後ろに紛れた1文字の英字（読み間違い）を除く
  // 「加盟店名」「店舗名」などの見出し。店名は見出しの後ろか、次の行に書かれている
  const label = /^(加盟店名?|店舗名|店名|MERCHANT)[\s:：]*/i;

  const top = lines.slice(0, 12);
  for (let i = 0; i < top.length; i++) {
    if (!label.test(top[i])) continue;
    const rest = clean(top[i].replace(label, "").replace(/MERCHANT/i, ""));
    if (japanese.test(rest) && !skip.test(rest)) return rest.slice(0, 24);
    const next = clean(top[i + 1] || "");
    if (japanese.test(next) && !skip.test(top[i + 1])) return next.slice(0, 24);
  }
  let best = null;
  top.forEach((line, i) => {
    const t = clean(line);
    const letters = (t.match(/\p{L}/gu) || []).length;
    if (letters < 2 || skip.test(line)) return;
    let score = 0;
    if (japanese.test(t)) score += 3; else score -= 3;                 // 英字だけの行はロゴのことが多い
    if (/[^\s]店$|店舗|本店|支店|営業所/.test(t)) score += 2;
    if (/株式会社|有限会社|合同会社|㈱|\(株\)/.test(line)) score += 2;
    if (storeInfo.test(top[i - 1] || "") || storeInfo.test(top[i + 1] || "") || storeInfo.test(top[i + 2] || "")) score += 1;
    const conf = confs[i] ?? 1;
    if (conf < 0.5) score -= 2; else if (conf < 0.7) score -= 1;    // 崩れた文字（ロゴなど）は自信が低い
    const digits = (t.match(/\d/g) || []).length;
    if (digits / t.length > 0.3) score -= 2;
    if (t.length > 22) score -= 2;                                     // 長い行は店名より案内文のことが多い
    score -= i * 0.3;                                                  // 同じくらいなら上の行を優先
    if (!best || score > best.score) best = { score, i, t };
  });
  if (!best) return "";
  // 店名と支店名（〜店）が2行に分かれている場合はつなげる（例: ファミリーマート 新宿西口店）
  const isBranch = t => /^[^\s]{1,10}店$/.test(t) && !/会社|商店$|本店$/.test(t);
  const usable = i => {
    const t = clean(top[i] || "");
    return t && japanese.test(t) && !skip.test(top[i]) && !isBranch(t);
  };
  if (isBranch(best.t) && usable(best.i - 1)) return `${clean(top[best.i - 1])} ${best.t}`.slice(0, 24);
  const next = clean(top[best.i + 1] || "");
  if (!/店$/.test(best.t) && isBranch(next) && !skip.test(top[best.i + 1])) return `${best.t} ${next}`.slice(0, 24);
  return best.t.slice(0, 24);
}

// iPhoneアプリの中で開いているときは、iPhone標準の文字認識（Vision）を使う
const NATIVE = window.Capacitor?.isNativePlatform?.() ? window.Capacitor : null;
const callNative = (method, options) => NATIVE.nativePromise("ShiwakeNative", method, options);

// 文字認識は「かたまり」ごとに位置付きで返るので、同じ高さにあるものを1行にまとめる
// （レシートの「合計」と右端の「¥1,280」を同じ行として扱うため）。
// 斜めに撮った写真にも対応するため、傾きの候補を少しずつ変えてまとめてみて、
// 行数が一番少なくなる（左右の組が一番多くそろう）傾きを採用する
function groupLines(items, width, height, theta) {
  const cos = Math.cos(theta), sin = Math.sin(theta);
  const pts = items.map(it => {
    const cx = (it.x + it.w / 2) * width, cy = (it.y + it.h / 2) * height;
    return { text: it.text, conf: it.confidence, x: cx * cos + cy * sin, y: -cx * sin + cy * cos, h: it.h * height };
  });
  const lines = [];
  for (const p of pts.sort((a, b) => a.y - b.y)) {
    const line = lines.find(l => Math.abs(l.y - p.y) < Math.min(l.h, p.h) * 0.5);
    if (line) { line.items.push(p); line.y = (line.y + p.y) / 2; line.h = Math.max(line.h, p.h); }
    else lines.push({ y: p.y, h: p.h, items: [p] });
  }
  return lines.sort((a, b) => a.y - b.y);
}

function itemsToLines(items, width = 1, height = 1) {
  // 目安の傾き: 長い行の傾きの中央値（短い文字は傾きが0で返ることが多いため除く）
  const maxW = Math.max(0, ...items.map(i => i.w));
  const angles = items.filter(i => typeof i.angle === "number" && i.w >= maxW * 0.3).map(i => i.angle).sort((a, b) => a - b);
  const guess = angles.length ? angles[Math.floor(angles.length / 2)] : 0;
  let best = null;
  for (let theta = guess - 0.1; theta <= guess + 0.1; theta += 0.004) {
    const lines = groupLines(items, width, height, theta);
    const score = [lines.length, Math.abs(theta - guess)];
    if (!best || score[0] < best.score[0] || (score[0] === best.score[0] && score[1] < best.score[1])) best = { lines, score };
  }
  // 1行の文字と、その行でいちばん低い「文字認識の自信」（0〜1）
  return (best ? best.lines : []).map(l => {
    const sorted = l.items.sort((a, b) => a.x - b.x);
    return { text: sorted.map(i => i.text).join("  "), conf: Math.min(...sorted.map(i => i.conf ?? 1)) };
  });
}

// 戻り値: 行ごとの { text, conf }（conf は文字認識の自信。分からない場合は 1）
async function recognizeText(dataUrl) {
  if (NATIVE) {
    const res = await callNative("recognizeText", { image: dataUrl.split(",")[1] });
    return itemsToLines(res.items || [], res.width, res.height);
  }
  const worker = await getOcrWorker();
  const canvas = await preprocessForOcr(dataUrl);
  const { data } = await worker.recognize(canvas);
  return (data.text || "").split(/\r?\n/).map(text => ({ text, conf: 1 }));
}

// レシートの品物の行（右端に金額がある行）から、最初の品名を取り出す。2つ以上あれば「他」を付ける
// 住所の行（例: 福岡市中央区天神2-5-10、〇〇町1丁目）。店名・品名にはしない
const ADDRESS_RE = /〒|丁目|番地|[都道府県].*[市区町村郡]|[市区町村郡].{0,12}\d|\d+\s*[-‐ー−の]\s*\d+\s*[-‐ー−の]\s*\d+|\d+\s*[-‐ー−]\s*\d+\s*$/;
function extractItem(lines) {
  const end = lines.findIndex(l => /小\s*計|合\s*計|総\s*計|お買上|買上計/.test(l));
  // 品物の行は、店の情報（電話・登録番号・日付・時刻）の行より後にある
  const head = lines.slice(0, end < 0 ? lines.length : end).reduce((at, l, i) => /TEL|電話|登録番号|〒|\d{4}\s*[年\/.]\s*\d{1,2}|\d{1,2}:\d{2}/i.test(l) ? i : at, -1);
  const skip = /計|税|対象|釣|預|現金|クレジット|カード|ポイント|値引|割引|点数|領収|TEL|電話|登録番号|No\.?|№|レジ|担当|伝票|\d{1,2}:\d{2}|\d+年|\d+月|\d+日|[x×@＠]|単価?\s*\d/i;
  const names = [];
  for (const line of lines.slice(head + 1, end < 0 ? lines.length : end)) {
    const m = line.match(/^(.*?)[\s¥\\]*\d{1,3}(?:,\d{3})*\s*(?:円|※|軽|外|内|\*|[A-Z])?\s*$/);
    if (!m || skip.test(line) || ADDRESS_RE.test(line)) continue;
    const name = m[1].replace(/^[\d\s*※軽#★☆・.\-]+/, "").replace(/[\s*※軽#★☆・.¥\\-]+$/, "").replace(/(?<=.{2})[外内軽]$/, "").trim();
    if ((name.match(/[\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Han}A-Za-z]/gu) || []).length < 2) continue;
    names.push(name.slice(0, 16));
  }
  return names.length ? names[0] + (names.length > 1 ? " 他" : "") : "";
}

// ---- 店名を覚える ----
// ロゴで印刷された店名は読めないので、直した店名を「電話番号・登録番号（T＋13桁）→ 店名」として覚える（全社共通・端末の中だけ）
const STORE_NAMES_KEY = "shiwake-store-names";
let storeNames = load(STORE_NAMES_KEY, {});
function storeKeyOf(text) {
  const t = String(text || "").normalize("NFKC");
  const reg = t.match(/T\s*[-‐]?\s*((?:\d\s*){13})/);
  if (reg) return "T" + reg[1].replace(/\D/g, "");
  const tel = t.match(/(?:TEL|Tel|電話|☎)[^\d]{0,4}(\d{2,4}[\s\-‐ー()]*\d{2,4}[\s\-‐ー()]*\d{3,4})/);
  return tel ? "TEL" + tel[1].replace(/\D/g, "") : "";
}
// 摘要を直したら、品名の前の部分を店名として覚え、同じお店でまだ直していない行もそろえる
function learnStoreName(row) {
  const key = storeKeyOf(row.ocrText), sum = String(row.summary || "").trim(), item = row.item || "";
  if (!key || !sum) return;
  const store = !item ? sum : sum.endsWith(item) ? sum.slice(0, -item.length).trim() : "";
  if (!store || store === row.store) return;
  for (const o of rows) {
    if (o === row || o.source !== "receipt" || o.doc || o.locked || o.review === "exported" || storeKeyOf(o.ocrText) !== key) continue;
    if (String(o.summary || "") !== [o.store, o.item].filter(Boolean).join(" ")) continue;
    o.store = store; o.summary = [store, o.item].filter(Boolean).join(" ");
  }
  row.store = store;
  storeNames[key] = store;
  try { localStorage.setItem(STORE_NAMES_KEY, JSON.stringify(storeNames)); } catch {}
  window.__shiwakeSync?.queue();
}

// ---- 仕入請求書 ----
// 請求元ごとに「借方の科目・貸方の科目」を覚える。覚えていなければ、借方 仕入高・貸方 買掛金
const purchaseRulesOf = cid => autoRulesOf(cid, "purchase");
function purchaseRule(cid, store, item) {
  const text = normName(`${store || ""} ${item || ""}`);
  return purchaseRulesOf(cid).rules.filter(r => r.keyword && text.includes(normName(r.keyword)))
    .sort((a, b) => normName(b.keyword).length - normName(a.keyword).length)[0] || null;
}
function purchaseDefault(cid, side) {
  const byName = (...names) => masterOf(cid).find(m => names.some(n => normName(m.name) === normName(n)))?.code || "";
  return side === "debit" ? byName("仕入高", "仕入", "商品仕入高") : byName("買掛金");
}
function learnPurchaseRule(r) {
  const kw = String(r.store || r.item || "").trim().slice(0, 30);
  if (r.doc !== "purchase" || !kw || lineOf(r) !== "pair") return;
  const rules = purchaseRulesOf(r.companyId).rules;
  let ex = rules.find(x => normName(x.keyword) === normName(kw));
  if (!ex) rules.push(ex = { keyword: kw });
  if (r.debitCode) ex.code = r.debitCode;
  if (r.creditCode) ex.creditCode = r.creditCode;
}

// ---- 一覧の表（Excel・CSV）：出金・入金領収書、仕入・売上請求書、日計表（現金出納帳） ----
// 見出しの言葉で、日付・相手（店名・取引先・摘要）・金額・入金／出金・税率・科目の列を見つけ、1行を1つの仕訳にする
function parseListSheet(table) {
  const norm = c => String(c ?? "").normalize("NFKC").replace(/\s/g, "");
  const find = (row, re, not) => row.findIndex(c => re.test(norm(c)) && !(not && not.test(norm(c))));
  const hi = table.findIndex(row => find(row, /日付|年月日|取引日|伝票日|利用日|請求日|発行日/) >= 0 && find(row, /金額|税込|合計|請求額|入金|出金|収入|支出/) >= 0);
  if (hi < 0) return [];
  const h = table[hi];
  const col = {
    date: find(h, /日付|年月日|取引日|伝票日|利用日|請求日|発行日/),
    name: find(h, /取引先|得意先|仕入先|支払先|相手|店名|請求先|宛名|摘要|内容|品名/),
    item: find(h, /品名|但し|内容|摘要/),
    acct: find(h, /科目/),
    rate: find(h, /税率/),
    inn: find(h, /入金|収入/), out: find(h, /出金|支出|支払額/),
    amount: find(h, /税込|請求額|合計|金額/, /税抜|消費税|税額/),
  };

// 1行（ご利用1件）→ 1つの仕訳。借方 店名から覚えた科目（出金領収書と同じルール）／ 貸方 未払金
function cardDate(t) {
  const v = String(t || "").normalize("NFKC");
  let m = v.match(/(\d{4})\s*[\/.\-年]\s*(\d{1,2})\s*[\/.\-月]\s*(\d{1,2})/);
  if (m) return validDate(+m[1], +m[2], +m[3]) ? `${m[1]}-${pad(+m[2])}-${pad(+m[3])}` : "";
  m = v.match(/(?<!\d)(\d{2})\s*[\/.]\s*(\d{1,2})\s*[\/.]\s*(\d{1,2})(?!\d)/);
  if (m) return validDate(2000 + +m[1], +m[2], +m[3]) ? `${2000 + +m[1]}-${pad(+m[2])}-${pad(+m[3])}` : "";
  m = v.match(/(?<![\d\/])(\d{1,2})\s*[\/月]\s*(\d{1,2})日?(?![\d\/])/);
  if (!m) return "";
  // 年がなければ、今日より先にならない一番近い年
  const now = new Date(), y = now.getFullYear() - (+m[1] > now.getMonth() + 2 ? 1 : 0);
  return validDate(y, +m[1], +m[2]) ? `${y}-${pad(+m[1])}-${pad(+m[2])}` : "";
}
const CARD_SKIP = /合計|小計|ご?請求|お支払い?(金額|日|総額)|前回|今回|残高|ポイント|年会費|利用可能|お知らせ|振替|口座/;
// 写真・PDF：行ごとのセルから、日付・店名・金額を拾う（金額は、その行で最初の金額 ＝ 利用金額）
function parseCardRows(cellRows) {
  const out = [];
  for (const cells of cellRows) {
    const line = cells.map(c => String(c.text || "").normalize("NFKC")).join(" ");
    if (CARD_SKIP.test(line)) continue;
    const date = cardDate(line);
    if (!date) continue;
    const dm = line.match(/\d{2,4}\s*[\/.\-年]\s*\d{1,2}\s*[\/.\-月]\s*\d{1,2}日?|\d{1,2}\s*[\/月]\s*\d{1,2}日?/);
    let rest = dm ? line.replace(dm[0], " ") : line;
    const am = [...rest.matchAll(/[¥\\]?\s*\d{1,3}(?:,\d{3})+|[¥\\]\s*\d+|(?<![\d.])\d{3,7}(?=\s*円)/g)];
    if (!am.length) continue;
    const amount = Number(am[0][0].replace(/\D/g, ""));
    rest = rest.slice(0, am[0].index);
    const store = rest.replace(/1回払い?|一括|分割|リボ|本人|家族|ご?利用|\s+/g, " ").trim();
    if (amount) out.push({ date, store, amount });
  }
  return out;
}
// Excel・CSV（カード会社の明細のダウンロード）：見出しの言葉で列を見つける
function parseCardSheet(table) {
  const find = (row, re) => row.findIndex(c => re.test(String(c).normalize("NFKC").replace(/\s/g, "")));
  const hi = table.findIndex(row => find(row, /利用日|日付|ご利用年月日/) >= 0 && find(row, /金額/) >= 0);
  if (hi < 0) return [];
  const h = table[hi], dc = find(h, /利用日|日付|ご利用年月日/), sc = find(h, /利用店|ご利用先|店名|加盟店|内容|摘要/), ac = find(h, /利用金額|ご利用金額|金額/);
  return table.slice(hi + 1).map(r => ({ date: cardDate(r[dc]), store: sc >= 0 ? String(r[sc] || "").trim() : "", amount: Math.abs(sheetNum(r[ac]) || 0) }))
    .filter(e => e.date && e.amount);
}

}

// 宛名の取引先ごとに「借方の科目・貸方の科目」を覚える。覚えていなければ、借方 売掛金・貸方 売上高
const salesRulesOf = cid => autoRulesOf(cid, "sales");
function salesRule(cid, payee, item) {
  const text = normName(`${payee || ""} ${item || ""}`);
  return salesRulesOf(cid).rules.filter(r => r.keyword && text.includes(normName(r.keyword)))
    .sort((a, b) => normName(b.keyword).length - normName(a.keyword).length)[0] || null;
}
function salesDefault(cid, side) {
  const byName = (...names) => masterOf(cid).find(m => names.some(n => normName(m.name) === normName(n)))?.code || "";
  return side === "debit" ? byName("売掛金") : byName("売上高", "売上");
}
function learnSalesRule(r) {
  const kw = String(r.store || r.item || "").trim().slice(0, 30);
  if (r.doc !== "sales" || !kw) return;
  const rules = salesRulesOf(r.companyId).rules, ln = lineOf(r);
  let ex = rules.find(x => normName(x.keyword) === normName(kw));
  if (!ex) rules.push(ex = { keyword: kw });
  if (ln !== "c" && r.debitCode) ex.code = r.debitCode;
  if (ln !== "d" && r.creditCode) ex.creditCode = r.creditCode;
}
// 8%と10%の金額（税込）。合計と必ず一致させる。読めなければ空にしてお知らせ
function splitAmounts(text, amount) {
  const sp = splitByRate(text);
  let total = Number(amount) || 0, r8 = "", r10 = "", off = "";
  if (sp && !total) { r8 = sp.r8; r10 = sp.r10; total = r8 + r10; }
  else if (sp && sp.r8 + sp.r10 === total) { r8 = sp.r8; r10 = sp.r10; }
  else if (sp && Math.abs(Math.round(sp.r8 * 1.08) + Math.round(sp.r10 * 1.1) - total) <= 2) { r8 = Math.round(sp.r8 * 1.08); r10 = total - r8; } // 税抜で書かれていた
  else if (sp && sp.r8 < total) { r8 = sp.r8; r10 = total - r8; off = "8%と10%の金額を確かめてください"; }
  else off = "8%の金額を入れてください（10%は合計との差で入ります）";
  return { total, r8, r10, off };
}

// ---- 入金領収書 ----
// 宛名（〜様・〜御中・〜殿）。会社が出した領収書の控えでは、お金を払った相手
function extractPayee(lines) {
  for (const line of lines) {
    const m = String(line).normalize("NFKC").match(/^(.*?)\s*(様|御中|殿)\s*$/);
    const name = m && m[1].replace(/^(領収書|領収証|No\.?\s*\d+|\d+)\s*/, "").trim();
    if (name && name.length <= 30 && !/上記|正に|金額|但/.test(name)) return name;
  }
  return "";
}
const incomeRulesOf = cid => autoRulesOf(cid, "income");
const incomeCashCode = cid => incomeRulesOf(cid).fixedCode || masterOf(cid).find(m => normName(m.name) === "現金")?.code || "";
// 宛名（なければ但し書き）から、前に選んだ貸方の科目
function incomeCreditCode(cid, payee, item) {
  const text = normName(`${payee || ""} ${item || ""}`);
  return incomeRulesOf(cid).rules.filter(r => r.keyword && r.code && text.includes(normName(r.keyword)))
    .sort((a, b) => normName(b.keyword).length - normName(a.keyword).length)[0]?.code || "";
}
function learnIncomeRule(r) {
  const kw = String(r.store || r.item || "").trim().slice(0, 30);
  if (r.doc !== "income" || !kw || !r.creditCode || lineOf(r) === "d") return;
  const rules = incomeRulesOf(r.companyId).rules, ex = rules.find(x => normName(x.keyword) === normName(kw));
  if (ex) ex.code = r.creditCode; else rules.push({ keyword: kw, code: r.creditCode });
}

// 領収書の「但し 〇〇代として」から品目を取り出す
function extractPurpose(lines) {
  for (const line of lines) {
    const m = line.match(/^但し?\s*(.+?)(?:として)?\s*$/);
    if (m && m[1]) return m[1].trim().slice(0, 20);
  }
  return "";
}

async function readReceiptFree(dataUrl) {
  const recognized = (await recognizeText(dataUrl))
    .map(l => ({ text: normalizeText(l.text).trim(), conf: l.conf }))
    .filter(l => l.text);
  if (!recognized.length) return [];
  const lines = recognized.map(l => l.text);
  const text = lines.join("\n");
  const date = extractDate(text);
  const amount = extractAmount(lines);
  // 店名: 前に直した店名があれば、それを使う（電話番号・登録番号で見分ける）
  const store = storeNames[storeKeyOf(text)] || extractStore(lines, recognized.map(l => l.conf));
  // 摘要: 店名 ＋ 品名（手書きの領収書は「但し〇〇」）。品物が2つ以上あれば「他」を付ける
  const item = extractPurpose(lines) || extractItem(lines);
  const summary = [store, item].filter(Boolean).join(" ");
  return [{ date, amount, store, item, summary, ocrText: text, note: "" }];
}

      body += `<tr class="is-${anchor.status}" data-row="${anchor.id}" data-vid-head="${escapeHtml(v)}"><td class="rowno">${no}</td><td class="c-status"><span class="st">${statusBadge(anchor)}</span></td>${thumbOf(anchor).replace(/<\/td>$/, `<span class="v-no">${no} / ${totalV}</span></td>`)}<td colspan="${fields.length}" class="c-msg">${msg}</td>${actions(anchor, v, false)}</tr>`;
      continue;
    }

    const D = compound ? vr.filter(o => lineOf(o) !== "c") : [anchor];
    const C = compound ? vr.filter(o => lineOf(o) !== "d") : [anchor];
    const k = Math.max(D.length, C.length, 1);

    for (let i = 0; i < k; i++) {

      const cells = isTrial ? fields : [...fields.filter(f => !f.side), ...["debit", "credit"].flatMap(side =>
        [...new Set(fields.filter(f => f.side).map(f => kindOf(f.key)))].map(kd => fields.find(f => f.side === side && kindOf(f.key) === kd) || { blank: true, side }))];
      // この段に－が出るか（出るなら、借方・貸方の最初の項目の高さをそろえる）
      const minusRow = compound && !locked && ["debit", "credit"].some(side => sideCount[side] > 1 && (side === "debit" ? dRow : cRow));
      const trCls = [isTrial ? "" : "row-receipt", k > 1 && !last ? "v-mid" : "", first ? "" : "v-cont", locked ? "locked" : "", minusRow ? "minus-row" : ""].filter(Boolean).join(" ");
      body += `<tr data-row="${(dRow || cRow || anchor).id}" data-vid="${escapeHtml(v)}" data-bi="${i}" ${first ? `data-vid-head="${escapeHtml(v)}"` : ""} class="${trCls}">${head}` + cells.map(f => {
        if (f.blank) return `<td class="c-blank s-${f.side}"></td>`;
        const src = srcOf(f);
        if (!src) return `<td class="${f.cls}${f.side ? ` s-${f.side}` : ""} c-none"></td>`;
        // 借方・貸方が2つ以上あるときは、それぞれの塊に「－」（その塊を消す）を出す
        // －（その塊を消す）は塊の右上（項目名の行）、＋（塊を足す）はその側の一番下の塊の下に出す（並べると押し間違えるため離す）
        const bottom = !isTrial && !locked && f.side && f === lastOfSide[f.side];
        const minus = !isTrial && !locked && f.side && f === firstOfSide[f.side] && compound && sideCount[f.side] > 1
          ? `<button class="line-move" data-linemove="${f.side}" data-vid="${escapeHtml(v)}" data-bi="${i}" title="つかんで動かすと順番を入れ替えます" aria-label="順番を入れ替える"><svg><use href="#i-grip"/></svg></button>`
            + `<button class="line-del" data-linedel="${src.id}" title="この${f.side === "debit" ? "借方" : "貸方"}を消す" aria-label="この${f.side === "debit" ? "借方" : "貸方"}を消す"><svg><use href="#i-minus"/></svg></button>` : "";
        const plus = bottom && src === (f.side === "debit" ? D : C).at(-1) ? addBtn(f.side, v) : "";
        return `<td class="${f.cls}${f.side ? ` s-${f.side}` : ""}${f.key === "date" && !balanceOf(anchor).ok ? " unbalanced" : ""}${minus ? " has-minus" : ""}${f.side && f === firstOfSide[f.side] ? " first-f" : ""}" data-label="${f.label}">
        ${cellInput(src, f)}${minus}
        ${plus ? `<div class="add-wrap ${f.side}">${plus}</div>` : ""}
        ${f.key === "summary" && isTrial ? `<div class="src-line">元の会計ソフト科目名: ${escapeHtml(anchor.srcName)}${anchor.srcCode ? ` [${escapeHtml(anchor.srcCode)}]` : ""}</div>` : ""}
        ${f.key === "date" ? balanceHtml(anchor) : ""}
        ${f.key === (isTrial ? "summary" : "date") ? noteHtml(anchor) : ""}
      </td>`;
      }).join("")
        // スマホでは＋を、借方・貸方の枠の外（その側の一番下の塊のすぐ下）に出す（PCでは枠の中に出す）
        + (!isTrial && !locked ? ["debit", "credit"].filter(side => (side === "debit" ? dRow === D.at(-1) : cRow === C.at(-1)) && (side === "debit" ? dRow : cRow))
          .map(side => `<td class="c-add c-add-${side}">${addBtn(side, v)}</td>`).join("") : "")
        + (last ? actions(anchor, v, locked) : `<td class="c-del"></td>`) + `</tr>`;
    }
  }

  list.innerHTML = `<div class="table-wrap"><table>
    <thead>
      <tr class="group">
        <th colspan="3"></th>${groupHead}
        <th></th>
      </tr>
      <tr>
        <th>No.</th><th>状態</th><th>画像</th>${fields.map(f => `<th class="${[f.num ? "num" : "", f.cls.includes("b-left") ? "b-left" : "", f.key === "date" ? "date" : ""].join(" ")}">${f.head || f.label}</th>`).join("")}
        <th></th>
      </tr>
    </thead>
    <tbody>${body}</tbody>
  </table></div>`;
  fitSummaries();
  renderStats();
  renderTrialBar();
}

// ---- コードの欄: コードの数字か科目名を入れると、その会社のミロク科目マスタから候補を出して選べる ----
const isCodeSearch = el => el?.matches?.("[data-code-suggest]") && /[^\d\s]/.test(el.value);
const suggestEl = Object.assign(document.createElement("div"), { className: "code-suggest", hidden: true });
document.body.appendChild(suggestEl);
let suggestInput = null, suggestIdx = 0, suggestItems = [];
function suggestList(input) {
  const cid = input.closest("#masterDlg") ? masterCid : (rows.find(r => r.id === input.dataset.id)?.companyId || currentCompanyId);
  return masterOf(cid);
}
function showSuggest(input, showAll) {
  const q = showAll ? "" : input.value.trim(), n = normName(q), all = suggestList(input);
  // 空なら全部、数字ならそのコードで始まるもの、文字なら科目名に含むもの
  const items = (!q ? all : /^\d+$/.test(q) ? all.filter(m => m.code.startsWith(q)) : all.filter(m => normName(m.name).includes(n))).slice(0, 200);
  if (!items.length) return hideSuggest();
  suggestInput = input; suggestItems = items;
  suggestIdx = Math.max(0, items.findIndex(m => m.code === input.value.trim())); // 今のコードを選んだ状態にする
  suggestEl.innerHTML = items.map((m, i) => `<div class="cs-item ${i === suggestIdx ? "active" : ""}" data-i="${i}"><span class="cs-code">${escapeHtml(m.code)}</span>${escapeHtml(m.name)}</div>`).join("");

function keepSuggestVisible() {

  if (el.offsetTop < suggestEl.scrollTop) suggestEl.scrollTop = el.offsetTop;

  const vv = window.visualViewport, viewBottom = vv ? vv.offsetTop + vv.height : innerHeight;
  if (rc.bottom < 0 || rc.top > viewBottom) return hideSuggest(); // 欄が画面の外に出たら閉じる
  if (isTouch()) {

    suggestEl.style.left = "12px";
    suggestEl.style.width = (innerWidth - 24) + "px";
    const below = viewBottom - rc.bottom - 8, above = rc.top - (vv ? vv.offsetTop : 0) - 8;
    const useAbove = below < 160 && above > below;
    const room = Math.max(120, Math.min(360, useAbove ? above : below));
    suggestEl.style.maxHeight = room + "px";
    const h = Math.min(room, suggestEl.scrollHeight);
    suggestEl.style.top = (useAbove ? rc.top - 4 - h : rc.bottom + 4) + "px";
    return;
  }
  suggestEl.style.width = ""; suggestEl.style.maxHeight = "";
  const h = Math.min(300, suggestEl.scrollHeight);
  suggestEl.style.left = Math.max(8, Math.min(rc.left, innerWidth - 268)) + "px";
  suggestEl.style.top = (rc.bottom + 4 + h > innerHeight && rc.top - 4 - h > 0 ? rc.top - 4 - h : rc.bottom + 4) + "px";

window.visualViewport?.addEventListener("scroll", () => { if (!suggestEl.hidden) placeSuggest(); });

  const D = vr.filter(r => lineOf(r) !== "c"), C = vr.filter(r => lineOf(r) !== "d");
  if (D.length === 1 && C.length === 1 && D[0] !== C[0]) {
    const d = D[0], c = C[0];
    Object.assign(d, { creditCode: c.creditCode, creditSub: c.creditSub, creditAmount: c.creditAmount, creditTax: c.creditTax, creditRate: c.creditRate,
      creditBiz: c.creditBiz, creditSummary: creditSummaryOf(c), taxManual: { ...d.taxManual, credit: !!c.taxManual?.credit } });
    delete d.line; delete d.vid; delete d.splitRole;
    rows = rows.filter(r => r !== c);
  }
  save(); render();
}

const viewer = document.getElementById("viewer"), viewerImg = document.getElementById("modalImg");
let vz = { s: 1, x: 0, y: 0 };            // 拡大率と、ずらした量
const pointers = new Map();               // 画面に触れている指（マウス）
let pinch = null, drag = null, lastTap = 0;
function applyZoom() {
  viewerImg.style.transform = `translate(${vz.x}px, ${vz.y}px) scale(${vz.s})`;
  viewer.classList.toggle("zoomed", vz.s > 1.01);
}
// 画面上の点(cx, cy)を中心に、拡大率を s にする
function zoomAt(s, cx, cy) {
  s = Math.min(8, Math.max(1, s));
  const rc = viewerImg.getBoundingClientRect();
  const ix = (cx - rc.left) / vz.s, iy = (cy - rc.top) / vz.s; // 画像の中のどこか
  vz.x += (cx - rc.left) - ix * s; vz.y += (cy - rc.top) - iy * s;
  vz.s = s;
  if (s === 1) vz.x = vz.y = 0;
  applyZoom();
}
function viewerCenter() { const rc = viewer.getBoundingClientRect(); return [rc.left + rc.width / 2, rc.top + rc.height / 2]; }
function openViewer(src) {
  viewerImg.src = src; vz = { s: 1, x: 0, y: 0 }; applyZoom();
  document.getElementById("modal").classList.add("open");
}
function closeViewer() { document.getElementById("modal").classList.remove("open"); pointers.clear(); pinch = drag = null; }
document.getElementById("viewerClose").onclick = closeViewer;
document.querySelector(".viewer-bar").addEventListener("click", e => {
  const b = e.target.closest("[data-zoom]"); if (!b) return;
  const [cx, cy] = viewerCenter();
  if (b.dataset.zoom === "fit") zoomAt(1, cx, cy);
  else zoomAt(vz.s * (b.dataset.zoom === "in" ? 1.6 : 1 / 1.6), cx, cy);
});
addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("modal").classList.contains("open")) closeViewer(); });
viewer.addEventListener("wheel", e => { e.preventDefault(); zoomAt(vz.s * Math.exp(-e.deltaY / 300), e.clientX, e.clientY); }, { passive: false });
viewer.addEventListener("pointerdown", e => {
  viewer.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: vz.s };
    drag = null;
  } else if (pointers.size === 1) {
    drag = { x: e.clientX, y: e.clientY, vx: vz.x, vy: vz.y, moved: false, onImg: e.target === viewerImg };
  }
});
viewer.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    zoomAt(pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, (a.x + b.x) / 2, (a.y + b.y) / 2);
  } else if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
    if (vz.s > 1.01) { vz.x = drag.vx + dx; vz.y = drag.vy + dy; applyZoom(); }
  }
});
function endPointer(e) {
  const wasDrag = drag && !drag.moved && pointers.size === 1, onImg = drag?.onImg;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!wasDrag) { if (!pointers.size) drag = null; return; }
  drag = null;
  // タップ: 2回続けて押したら拡大／元に戻す。拡大していないときに画像の外を押したら閉じる
  const now = Date.now();
  if (now - lastTap < 320) { zoomAt(vz.s > 1.01 ? 1 : 2.5, e.clientX, e.clientY); lastTap = 0; return; }
  lastTap = now;
  if (vz.s <= 1.01 && !onImg) setTimeout(() => { if (lastTap === now) closeViewer(); }, 330);
}
viewer.addEventListener("pointerup", endPointer);
viewer.addEventListener("pointercancel", endPointer);

  // 相手の科目（諸口）は空欄で書き出す（ミロクの会計データによっては 3999 をエラーにするため。2026-10-05 お父さん）

  const bytes = settings.encoding === "utf8"

  const blob = new Blob([bytes], { type: "text/csv" });
